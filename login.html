<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden | FISI Klasse 11</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0f172a;
      background-image:url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1920&q=80');
      background-size:cover;
      background-position:center;
      background-blend-mode:multiply;
    }
    .login-box{
      width:100%;
      max-width:420px;
      background:rgba(15,23,42,.92);
      border:1px solid rgba(148,163,184,.2);
      border-radius:24px;
      padding:2.5rem 2rem;
      backdrop-filter:blur(20px);
      box-shadow:0 25px 60px rgba(0,0,0,.5);
    }
    .logo{
      text-align:center;
      margin-bottom:1.8rem;
    }
    .logo-icon{
      width:72px;height:72px;
      background:linear-gradient(135deg,#38bdf8,#22d3ee);
      border-radius:18px;
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;
      margin:0 auto .8rem;
      box-shadow:0 8px 30px rgba(56,189,248,.3);
    }
    .logo h1{
      font-size:1.5rem;
      font-weight:800;
      color:#f1f5f9;
      letter-spacing:-.02em;
    }
    .logo p{
      color:#94a3b8;
      font-size:.9rem;
      margin-top:.3rem;
    }
    .form-group{
      margin-bottom:1.2rem;
    }
    .form-group label{
      display:block;
      color:#cbd5e1;
      font-size:.85rem;
      font-weight:600;
      margin-bottom:.4rem;
    }
    .form-group input{
      width:100%;
      padding:.85rem 1rem;
      background:rgba(30,41,59,.8);
      border:1px solid rgba(148,163,184,.25);
      border-radius:12px;
      color:#f1f5f9;
      font-size:1rem;
      font-family:inherit;
      transition:.2s;
    }
    .form-group input:focus{
      outline:none;
      border-color:#38bdf8;
      box-shadow:0 0 0 3px rgba(56,189,248,.2);
    }
    .form-group input::placeholder{color:#64748b}
    .btn-login{
      width:100%;
      padding:1rem;
      background:linear-gradient(135deg,#38bdf8,#22d3ee);
      border:none;
      border-radius:12px;
      color:#0f172a;
      font-size:1rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      transition:.2s;
      margin-top:.5rem;
    }
    .btn-login:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 25px rgba(56,189,248,.4);
    }
    .error{
      background:rgba(239,68,68,.15);
      border:1px solid rgba(239,68,68,.3);
      color:#fca5a5;
      padding:.75rem 1rem;
      border-radius:10px;
      font-size:.85rem;
      margin-bottom:1rem;
      display:none;
    }
    .error.show{display:block}
    .footer-text{
      text-align:center;
      margin-top:1.5rem;
      color:#64748b;
      font-size:.8rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">💻</div>
      <h1>FISI Klasse 11</h1>
      <p>Lernportal – Anmeldung</p>
    </div>
    <div class="error" id="error">Benutzername oder Passwort falsch</div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username" placeholder="Dein Benutzername" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" placeholder="Dein Passwort" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Anmelden</button>
    </form>
    <p class="footer-text">Fachinformatiker Systemintegration · 2026</p>
  </div>
  <script src="users.js"></script>
  <script>
    function doLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      const found = USERS.find(u => u.username === user && u.password === pass);
      if (found) {
        sessionStorage.setItem('fisi-auth', JSON.stringify({ username: found.username, name: found.name, role: found.role || 'student' }));
        window.location.href = 'index.html';
      } else {
        errorEl.classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
      return false;
    }

    // If already logged in, redirect
    if (sessionStorage.getItem('fisi-auth')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
