<!DOCTYPE html>
<html lang="de" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171410" />
  <title>Anmelden | Lernova</title>
  <script>
    try {
      var theme = localStorage.getItem('fisi-theme') || 'dark';
      var lang = localStorage.getItem('fisi-lang');
      if (lang !== 'en' && lang !== 'fa') lang = 'de';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f4efe6' : '#171410');
    } catch (e) {}
  </script>
  <script src="supabase-config.js"></script>
  <script src="supabase-lite.js"></script>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261110c" />
</head>
<body>
  <main class="auth-screen">
    <div class="auth-shell">
      <section class="auth-aside">
        <a class="brand" href="login.html">
        <svg class="brand-logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7 25.2c-.9 0-1.6-.7-1.6-1.6V8.4c0-.9.7-1.6 1.6-1.6h1.1c.9 0 1.6.7 1.6 1.6V22h11.6c.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6H7z"/>
          <circle fill="currentColor" cx="11.2" cy="20.2" r="2"/>
          <circle fill="currentColor" cx="18" cy="14.6" r="2"/>
          <circle fill="currentColor" cx="24.6" cy="9.2" r="2"/>
        </svg>
        <span class="brand-word">Lernova</span>
      </a>
        <div class="lang-switch" role="group" id="loginLang" aria-label="Sprache">
          <button type="button" class="lang-opt" data-lang="de" onclick="setLoginLang('de')">DE</button>
          <button type="button" class="lang-opt" data-lang="en" onclick="setLoginLang('en')">EN</button>
          <button type="button" class="lang-opt" data-lang="fa" onclick="setLoginLang('fa')">فا</button>
        </div>
        <h1 id="heroHeadline">Dein Potenzial. Dein Tempo. Deine Zukunft.</h1>
        <p class="hero-support" id="heroSupport"></p>
        <button type="button" class="btn btn-primary" id="heroCta" onclick="startNow()">Jetzt loslegen</button>
      </section>

      <section class="auth-panel">
        <div class="tabs" id="tabsBar" role="tablist" aria-label="Zugang">
          <button type="button" class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="loginForm" onclick="showTab('login')">Anmelden</button>
          <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="registerForm" onclick="showTab('register')">Registrieren</button>
        </div>

        <div id="msgBox" class="msg" role="status" aria-live="polite"></div>

        <form id="loginForm" role="tabpanel" aria-labelledby="tab-login" onsubmit="return doLogin(event)">
          <div class="form-group">
            <label for="loginEmail" id="loginEmailLabel">E-Mail</label>
            <input type="email" id="loginEmail" name="email" dir="ltr" autocomplete="username" required />
          </div>
          <div class="form-group">
            <div class="label-row">
              <label for="loginPass" id="loginPassLabel">Passwort</label>
              <button type="button" class="text-link" id="forgotLink" aria-controls="recoveryView" aria-expanded="false" onclick="showRecovery()">Passwort vergessen?</button>
            </div>
            <input type="password" id="loginPass" name="password" dir="ltr" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn-submit" id="loginSubmit">Anmelden</button>
        </form>

        <section id="recoveryView" class="recovery-view" hidden aria-labelledby="recoveryTitle">
          <h2 id="recoveryTitle" tabindex="-1">Passwort vergessen</h2>
          <p id="recoveryLead"></p>
          <form id="recoverForm" onsubmit="return doRecover(event)">
            <div class="form-group">
              <label for="recoverEmail" id="recoverEmailLabel">E-Mail</label>
              <input type="email" id="recoverEmail" dir="ltr" autocomplete="email" required />
            </div>
            <button type="submit" class="btn-submit" id="recoverSubmit">Link senden</button>
          </form>
          <button type="button" class="btn btn-soft" id="recoveryBack" onclick="hideRecovery()" style="margin-top:.8rem">Zurück zur Anmeldung</button>
        </section>

        <section id="newPassView" class="recovery-view" hidden aria-labelledby="newPassTitle">
          <h2 id="newPassTitle" tabindex="-1">Neues Passwort festlegen</h2>
          <form id="newPassForm" onsubmit="return doNewPass(event)">
            <div class="form-group">
              <label for="npPass" id="npPassLabel">Neues Passwort</label>
              <input type="password" id="npPass" dir="ltr" autocomplete="new-password" required minlength="6" />
            </div>
            <div class="form-group">
              <label for="npRep" id="npRepLabel">Passwort wiederholen</label>
              <input type="password" id="npRep" dir="ltr" autocomplete="new-password" required minlength="6" />
            </div>
            <button type="submit" class="btn-submit" id="npSubmit">Passwort speichern</button>
          </form>
        </section>

        <form id="registerForm" role="tabpanel" aria-labelledby="tab-register" hidden onsubmit="return doRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="regFirst" id="regFirstLabel">Vorname</label>
              <input type="text" id="regFirst" name="given-name" autocomplete="given-name" required />
            </div>
            <div class="form-group">
              <label for="regLast" id="regLastLabel">Nachname</label>
              <input type="text" id="regLast" name="family-name" autocomplete="family-name" required />
            </div>
          </div>
          <div class="form-group">
            <label for="regUser" id="regUserLabel">Benutzername</label>
            <input type="text" id="regUser" name="username" dir="ltr" autocomplete="nickname" required minlength="3" maxlength="30" />
          </div>
          <div class="form-group">
            <label for="regEmail" id="regEmailLabel">E-Mail</label>
            <input type="email" id="regEmail" name="email" dir="ltr" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="regStudent" id="regStudentLabel">Schülernummer</label>
            <input type="text" id="regStudent" name="student-id" dir="ltr" inputmode="numeric" required />
          </div>
          <div class="form-group">
            <label for="regPass" id="regPassLabel">Passwort</label>
            <input type="password" id="regPass" name="new-password" dir="ltr" autocomplete="new-password" required minlength="6" />
          </div>
          <button type="submit" class="btn-submit" id="registerSubmit">Registrieren</button>
          <p class="form-hint" id="registerHint"></p>
        </form>

        <p class="footer-text">Lernova</p>
      </section>
    </div>
  </main>

        okNoMail: 'ثبت‌نام انجام شد! مدیر هنوز باید حساب را تأیید کند.',

        linkBad: 'پیوند نامعتبر یا منقضی شده است',
        netErr: 'اتصال برقرار نیست. بعداً دوباره تلاش کن',
        rate: 'تلاش‌های زیاد. کمی صبر کن و دوباره امتحان کن',
        langLabel: 'زبان'

    function loginLang() {
      const saved = localStorage.getItem('fisi-lang');
      return loginCopy[saved] ? saved : 'de';
    }
    function copy() { return loginCopy[loginLang()]; }
    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setLoginLang(lang) {
      if (!loginCopy[lang]) return;
      localStorage.setItem('fisi-lang', lang);
      const t = loginCopy[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      setText('heroHeadline', t.headline);
      setText('heroSupport', t.support);
      setText('heroCta', t.cta);
      setText('tab-login', t.loginTab);
      setText('tab-register', t.registerTab);
      setText('loginEmailLabel', t.email);
      setText('loginPassLabel', t.pass);
      setText('forgotLink', t.forgot);
      setText('loginSubmit', t.submit);
      setText('regFirstLabel', t.first);
      setText('regLastLabel', t.last);
      setText('regUserLabel', t.user);
      setText('regEmailLabel', t.email);
      setText('regStudentLabel', t.student);
      setText('regPassLabel', t.pass);
      setText('registerSubmit', t.register);
      setText('registerHint', t.hint);
      setText('recoveryTitle', t.recoveryTitle);
      setText('recoveryLead', t.recoveryLead);
      setText('recoverEmailLabel', t.email);
      setText('recoverSubmit', t.recoverSend);
      setText('recoveryBack', t.recoveryBack);
      setText('newPassTitle', t.newPassTitle);
      setText('npPassLabel', t.newPass);
      setText('npRepLabel', t.newPassRep);
      setText('npSubmit', t.newPassSave);
      const group = document.getElementById('loginLang');
      if (group) group.setAttribute('aria-label', t.langLabel);
      document.querySelectorAll('#loginLang .lang-opt').forEach(btn => {
        const on = btn.dataset.lang === lang;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function showMsg(type, text) {
      const box = document.getElementById('msgBox');
      box.className = 'msg ' + type;
      box.textContent = text;
    }
    function clearMsg() {
      const box = document.getElementById('msgBox');
      box.className = 'msg';
      box.textContent = '';
    }

    function view(name) {
      document.getElementById('loginForm').hidden = name !== 'login';
      document.getElementById('registerForm').hidden = name !== 'register';
      document.getElementById('recoveryView').hidden = name !== 'recovery';
      document.getElementById('newPassView').hidden = name !== 'newpass';
      document.getElementById('tabsBar').hidden = (name === 'recovery' || name === 'newpass');
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      loginTab.classList.toggle('active', name === 'login');
      registerTab.classList.toggle('active', name === 'register');
      loginTab.setAttribute('aria-selected', name === 'login' ? 'true' : 'false');
      registerTab.setAttribute('aria-selected', name === 'register' ? 'true' : 'false');
      document.getElementById('forgotLink').setAttribute('aria-expanded', name === 'recovery' ? 'true' : 'false');
      clearMsg();
    }

    function showTab(tab) { view(tab === 'register' ? 'register' : 'login'); }
    function showRecovery() {
      view('recovery');
      const typed = document.getElementById('loginEmail').value.trim();
      if (typed) document.getElementById('recoverEmail').value = typed;
      document.getElementById('recoveryTitle').focus();
    }
    function hideRecovery() { view('login'); document.getElementById('forgotLink').focus(); }
    function startNow() { view('login'); document.getElementById('loginEmail').focus(); }

    function mapErr(err) {
      const t = copy();
      const msg = String((err && err.message) || '');
      const code = (err && err.code) || '';
      if (err instanceof TypeError) return t.netErr;
      if ((err && err.status === 429) || /rate_limit/.test(code)) return t.rate;
      if (code === 'email_not_confirmed' || /not confirmed/i.test(msg)) return t.notConfirmed;
      if (code === 'weak_password') return t.passShort;
      if (/Database error|already|registered/i.test(msg)) return t.taken;
      if (code === 'invalid_credentials' || (err && (err.status === 400 || err.status === 401))) return t.bad;
      return t.netErr;
    }

    function busy(formId, on) {
      document.querySelectorAll('#' + formId + ' button[type=submit]').forEach(b => { b.disabled = on; });
    }

    async function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      busy('loginForm', true);
      try {
        await SB.signIn(email, pass);
        const rec = await SB.establish();
        if (!rec) { SB.signOutLocal(); showMsg('error', copy().noProfile); return false; }
        if (!rec.approved && rec.role !== 'admin') { SB.signOutLocal(); showMsg('pending', copy().pending); return false; }
        window.location.href = 'index.html';
      } catch (err) {
        showMsg('error', mapErr(err));
      } finally {
        busy('loginForm', false);
      }
      return false;
    }

    async function doRegister(e) {
      e.preventDefault();
      const t = copy();
      const first = document.getElementById('regFirst').value.trim();
      const last = document.getElementById('regLast').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const studentId = document.getElementById('regStudent').value.trim();
      const pass = document.getElementById('regPass').value;
      if (!/^[A-Za-z0-9._-]{3,30}$/.test(username)) { showMsg('error', t.userBad); return false; }
      if (pass.length < 6) { showMsg('error', t.passShort); return false; }
      busy('registerForm', true);
      try {
        const redirect = window.location.origin + window.location.pathname;
        const res = await SB.signUp(email, pass, { username: username, first_name: first, last_name: last, student_id: studentId }, redirect);
        showMsg('success', res.needsConfirm ? t.ok : t.okNoMail);
        document.getElementById('registerForm').reset();
        setTimeout(() => view('login'), 6000);
      } catch (err) {
        showMsg('error', mapErr(err));
      } finally {
        busy('registerForm', false);
      }
      return false;
    }

    async function doRecover(e) {
      e.preventDefault();
      const email = document.getElementById('recoverEmail').value.trim();
      busy('recoverForm', true);
      try {
        await SB.recover(email, window.location.origin + window.location.pathname);
        showMsg('success', copy().recoverSent);
      } catch (err) {
        if ((err && err.status === 429) || err instanceof TypeError) showMsg('error', mapErr(err));
        else showMsg('success', copy().recoverSent);
      } finally {
        busy('recoverForm', false);
      }
      return false;
    }

    let recoveryToken = null;
    async function doNewPass(e) {
      e.preventDefault();
      const t = copy();
      const a = document.getElementById('npPass').value;
      const b = document.getElementById('npRep').value;
      if (a.length < 6) { showMsg('error', t.passShort); return false; }
      if (a !== b) { showMsg('error', t.npMismatch); return false; }
      busy('newPassForm', true);
      try {
        await SB.setPasswordWithToken(recoveryToken, a);
        recoveryToken = null;
        view('login');
        showMsg('success', t.npDone);
        document.getElementById('newPassForm').reset();
      } catch (err) {
        showMsg('error', (err && err.status === 401) || (err && err.status === 403) ? t.linkBad : mapErr(err));
      } finally {
        busy('newPassForm', false);
      }
      return false;
    }

    setLoginLang(loginLang());

    (function handleLinkFromMail() {
      const h = window.location.hash.replace(/^#/, '');
      if (!h) return;
      const p = new URLSearchParams(h);
      history.replaceState(null, '', window.location.pathname + window.location.search);
      if (p.get('error')) { showMsg('error', copy().linkBad); return; }
      const type = p.get('type');
      if (type === 'recovery' && p.get('access_token')) {
        recoveryToken = p.get('access_token');
        view('newpass');
        document.getElementById('newPassTitle').focus();
      } else if (p.get('access_token')) {
        showMsg('success', copy().confirmed);
      }
    })();

    if (sessionStorage.getItem('fisi-auth')) {
      window.location.href = 'index.html';
    } else if (SB && SB.getSession() && !recoveryToken) {
      SB.restore().then(ok => { if (ok) window.location.href = 'index.html'; });
    }
  </script>
</body>
</html>
