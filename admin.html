<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benutzerverwaltung | FISI Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .admin-box{max-width:700px;margin:2rem auto}
    .admin-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem}
    .admin-card h2{margin-bottom:1rem;font-size:1.2rem}
    .user-list{display:flex;flex-direction:column;gap:.6rem}
    .user-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem}
    .user-item .info{display:flex;flex-direction:column}
    .user-item .name{font-weight:600}
    .user-item .role{font-size:.8rem;color:var(--muted)}
    .form-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.6rem;align-items:end}
    .form-row input{padding:.7rem .9rem;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.95rem}
    .form-row input:focus{outline:none;border-color:var(--blue)}
    .btn-add{padding:.7rem 1.2rem;background:var(--blue);color:#0f172a;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit}
    .btn-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.1rem;padding:.3rem}
    .btn-export{margin-top:1rem;padding:.7rem 1.2rem;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-family:inherit;font-weight:600}
    .export-box{margin-top:1rem;background:#1e293b;color:#e2e8f0;padding:1rem;border-radius:10px;font-family:ui-monospace,monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-all;display:none}
    .login-gate{max-width:360px;margin:4rem auto;text-align:center}
    .login-gate input{width:100%;padding:.85rem;margin:.5rem 0 1rem;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:1rem;text-align:center}
    .login-gate button{padding:.85rem 2rem;background:var(--blue);color:#0f172a;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <a href="index.html" style="color:var(--muted);text-decoration:none;font-size:.9rem">← Zurück</a>
    </div>
  </header>

  <div id="loginGate" class="login-gate">
    <h2 style="margin-bottom:1rem">Admin-Zugang</h2>
    <input type="password" id="adminPass" placeholder="Admin-Passwort">
    <button onclick="checkAdmin()">Zugang</button>
    <p id="adminError" style="color:#ef4444;margin-top:.8rem;display:none">Falsches Passwort</p>
  </div>

  <main class="container" id="adminPanel" style="display:none">
    <div class="admin-box">
      <div class="admin-card">
        <h2>Neuen Benutzer hinzufügen</h2>
        <div class="form-row">
          <input type="text" id="newUser" placeholder="Benutzername">
          <input type="text" id="newPass" placeholder="Passwort">
          <input type="text" id="newName" placeholder="Name (optional)">
          <button class="btn-add" onclick="addUser()">Hinzufügen</button>
        </div>
      </div>

      <div class="admin-card">
        <h2>Benutzerliste</h2>
        <div class="user-list" id="userList"></div>
        <button class="btn-export" onclick="exportUsers()">Code für users.js kopieren</button>
        <div class="export-box" id="exportBox"></div>
      </div>
    </div>
  </main>

  <script src="users.js"></script>
  <script>
    let users = [...USERS];

    function checkAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        renderUsers();
      } else {
        document.getElementById('adminError').style.display = 'block';
      }
    }

    function renderUsers() {
      const list = document.getElementById('userList');
      list.innerHTML = '';
      users.forEach((u, i) => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <div class="info">
            <span class="name">${u.username}</span>
            <span class="role">${u.name || ''} · ${u.role || 'student'}</span>
          </div>
          <button class="btn-del" onclick="deleteUser(${i})" title="Löschen">✕</button>
        `;
        list.appendChild(div);
      });
    }

    function addUser() {
      const username = document.getElementById('newUser').value.trim();
      const password = document.getElementById('newPass').value;
      const name = document.getElementById('newName').value.trim();
      if (!username || !password) {
        alert('Benutzername und Passwort erforderlich');
        return;
      }
      if (users.find(u => u.username === username)) {
        alert('Benutzername existiert bereits');
        return;
      }
      users.push({ username, password, name, role: 'student' });
      document.getElementById('newUser').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newName').value = '';
      renderUsers();
    }

    function deleteUser(index) {
      if (users[index].role === 'admin') {
        alert('Admin kann nicht gelöscht werden');
        return;
      }
      if (confirm('Benutzer wirklich löschen?')) {
        users.splice(index, 1);
        renderUsers();
      }
    }

    function exportUsers() {
      const code = `const USERS = ${JSON.stringify(users, null, 2)};\n\nconst ADMIN_PASSWORD = "${ADMIN_PASSWORD}";`;
      const box = document.getElementById('exportBox');
      box.textContent = code;
      box.style.display = 'block';
      navigator.clipboard.writeText(code).then(() => {
        alert('Code kopiert! Füge ihn in users.js ein und committe.');
      }).catch(() => {
        alert('Code angezeigt. Kopiere ihn manuell.');
      });
    }

    document.getElementById('adminPass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAdmin();
    });
  </script>
</body>
</html>
