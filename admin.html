<!DOCTYPE html>
<html lang="de" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101418" />
  <title>Benutzerverwaltung | Lernova</title>
  <script>
    try {
      var theme = localStorage.getItem('fisi-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5f7' : '#101418');
    } catch (e) {}
  </script>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261110c" />
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt</a>
  <header class="site-header">
    <div class="container header-bar">
      <a class="brand" href="index.html">
        <svg class="brand-logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7 25.2c-.9 0-1.6-.7-1.6-1.6V8.4c0-.9.7-1.6 1.6-1.6h1.1c.9 0 1.6.7 1.6 1.6V22h11.6c.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6H7z"/>
          <circle fill="currentColor" cx="11.2" cy="20.2" r="2"/>
          <circle fill="currentColor" cx="18" cy="14.6" r="2"/>
          <circle fill="currentColor" cx="24.6" cy="9.2" r="2"/>
        </svg>
        <span class="brand-word">Lernova</span>
      </a>
      <a class="btn btn-soft" href="index.html">Zur Startseite</a>
    </div>
  </header>

  <main id="main" class="container">
    <div id="loginGate" class="login-gate">
      <h1>Admin-Zugang</h1>
      <p class="sub">Diese Seite verwaltet die Liste in <code>users.js</code>. Die Anmeldung der Lernenden läuft über <code>login.html</code>.</p>
      <form onsubmit="checkAdmin(); return false;">
        <div class="form-group">
          <label for="adminPass">Admin-Passwort</label>
          <input type="password" id="adminPass" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary">Zugang</button>
      </form>
      <p id="adminError" class="form-status err" role="alert" hidden>Falsches Passwort</p>
    </div>

    <div class="admin-box" id="adminPanel" hidden>
      <div class="page-head" style="grid-template-columns: 1fr">
        <div>
          <h1>Benutzerverwaltung</h1>
          <p class="sub">Benutzer anlegen, löschen und den Code für users.js kopieren.</p>
        </div>
      </div>

      <div class="admin-card">
        <h2>Neuen Benutzer hinzufügen</h2>
        <div class="form-inline">
          <div class="form-group">
            <label for="newUser">Benutzername</label>
            <input type="text" id="newUser" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="newPass">Passwort</label>
            <input type="text" id="newPass" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="newName">Name (optional)</label>
            <input type="text" id="newName" autocomplete="name" />
          </div>
          <button type="button" class="btn-add" onclick="addUser()">Hinzufügen</button>
        </div>
        <p id="adminStatus" class="form-status" role="status" hidden></p>
      </div>

      <div class="admin-card">
        <h2>Benutzerliste</h2>
        <div class="user-list" id="userList"></div>
        <button type="button" class="btn btn-soft btn-export" onclick="exportUsers()">Code für users.js kopieren</button>
        <div class="export-box" id="exportBox" hidden></div>
      </div>
    </div>
  </main>

  <script src="users.js"></script>
  <script>
    let users = [...USERS];

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function setStatus(message, type) {
      const el = document.getElementById('adminStatus');
      el.hidden = !message;
      el.className = 'form-status ' + (type || '');
      el.textContent = message || '';
    }

    function checkAdmin() {
      const pass = document.getElementById('adminPass').value;
      const error = document.getElementById('adminError');
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('loginGate').hidden = true;
        document.getElementById('adminPanel').hidden = false;
        error.hidden = true;
        renderUsers();
      } else {
        error.hidden = false;
      }
    }

    function renderUsers() {
      const list = document.getElementById('userList');
      list.innerHTML = '';
      if (!users.length) {
        list.innerHTML = '<p class="search-empty">Keine Benutzer</p>';
        return;
      }
      users.forEach((u, i) => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <div class="info">
            <span class="name">${esc(u.username)}</span>
            <span class="role">${esc(u.name || '')} · ${esc(u.role || 'student')}</span>
          </div>
          <button type="button" class="btn-del" onclick="deleteUser(${i})" aria-label="Löschen">✕</button>
        `;
        list.appendChild(div);
      });
    }

    function addUser() {
      const username = document.getElementById('newUser').value.trim();
      const password = document.getElementById('newPass').value;
      const name = document.getElementById('newName').value.trim();
      if (!username || !password) {
        setStatus('Benutzername und Passwort erforderlich', 'err');
        return;
      }
      if (users.find(u => u.username === username)) {
        setStatus('Benutzername existiert bereits', 'err');
        return;
      }
      users.push({ username, password, name, role: 'student' });
      document.getElementById('newUser').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newName').value = '';
      setStatus('Benutzer hinzugefügt. Exportiere den Code, damit er in users.js bleibt.', 'ok');
      renderUsers();
    }

    function deleteUser(index) {
      if (users[index].role === 'admin') {
        setStatus('Admin kann nicht gelöscht werden', 'err');
        return;
      }
      if (confirm('Benutzer wirklich löschen?')) {
        users.splice(index, 1);
        setStatus('', '');
        renderUsers();
      }
    }

    function exportUsers() {
      const code = `const USERS = ${JSON.stringify(users, null, 2)};\n\nconst ADMIN_PASSWORD = "${ADMIN_PASSWORD}";`;
      const box = document.getElementById('exportBox');
      box.textContent = code;
      box.hidden = false;
      navigator.clipboard.writeText(code).then(() => {
        setStatus('Code kopiert. Füge ihn in users.js ein.', 'ok');
      }).catch(() => {
        setStatus('Code angezeigt. Kopiere ihn manuell.', 'err');
      });
    }

  </script>
</body>
</html>
