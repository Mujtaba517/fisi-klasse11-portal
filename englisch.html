<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Englisch | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .topic-list{display:grid;gap:.8rem;margin-top:1rem}
    .topic-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;text-decoration:none;color:inherit;transition:.2s}
    .topic-item:hover{border-color:var(--blue);transform:translateY(-2px)}
    .topic-item h3{font-size:1.05rem;margin:0}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="englisch.html" class="active">Englisch</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>
  <div class="container page-head">
    <button type="button" class="back-btn" id="smartBack" onclick="smartBack()">←</button>
    <h1>Englisch – Computer Languages & Technical English</h1>
    <p class="sub">Machine Languages · Mnemonics · Vocabulary · IT-News</p>
  </div>
  <main class="container">
    <div id="topicListView">
      <h2 data-i18n="topicsTitle" style="margin-bottom:1rem">موضوعات</h2>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div id="topicContentView" style="display:none">
      <div id="singleTopicContent"></div>
    </div>
  </main>
  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const topics = {
      fa: [
        { id:'noten', title:'ساختار نمره', content:'<div class="card"><h3>ساختار نمره</h3><ul><li>3 نمره هم‌ارزش</li><li>حداقل 1 نمره کتبی (اعلام‌شده)</li><li>1 ارائه (Referat)</li><li>احتمالاً مشارکت کلاسی / تست</li></ul><p><strong>KMK Fremdsprachenzertifikat</strong> (B1/B2) اختیاری است. ثبت‌نام در ژانویه/فوریه، آزمون در اوریل/مه. هزینه حدود 30€.</p></div>' },
        { id:'machine', title:'Machine Languages', content:'<div class="card"><h3>Machine Languages & Programming Languages</h3><ul><li><strong>Machine Code / Machine Language:</strong> زبان ماشین – مستقیم برای پردازنده</li><li><strong>Assembly Language:</strong> زبان سطح پایین با استفاده از منمونیک</li><li><strong>Mnemonic:</strong> مخفف برای دستورات (مثل AND، SUB، MUL)</li><li><strong>High-level languages:</strong> زبان‌های سطح بالا (قابل فهم‌تر برای انسان)</li></ul><p>زبان ماشین مستقیم اجرا می‌شود اما سخت و وابسته به ماشین است. زبان‌های سطح بالا باید به زبان ماشین ترجمه (compile) شوند.</p></div>' },
        { id:'vocab', title:'واژگان مهم', content:'<div class="card"><h3>واژگان مهم (Vocabulary)</h3><ul><li><strong>mnemonic</strong> – مخفف / Eselsbrücke</li><li><strong>to assemble</strong> – مونتاژ کردن / جمع کردن</li><li><strong>to compile</strong> – ترجمه / کامپایل کردن</li><li><strong>machine dependent</strong> – وابسته به ماشین</li><li><strong>tedious</strong> – خسته‌کننده / کسل‌کننده</li><li><strong>instruction</strong> – دستور</li><li><strong>executables</strong> – فایل‌های قابل اجرا</li><li><strong>payroll program</strong> – برنامه حقوق و دستمزد</li></ul></div>' },
        { id:'themen', title:'موضوعات کلاس', content:'<div class="card"><h3>موضوعات کلاس</h3><ul><li>Hörverstehen und Leseverstehen</li><li>Computer & Machine Languages</li><li>واژگان فنی</li><li>IT-News (ارائه خبرهای فناوری)</li></ul><p>آزمون اول: پنجشنبه، 08.10.2026</p></div>' }
      ],
      de: [
        { id:'noten', title:'Notengebung', content:'<div class="card"><h3>Notengebung</h3><p>3 gleichwertige Noten · mind. 1 schriftliche · 1 Referat · ggf. Unterrichtsbeitrag/Test</p><p>KMK Fremdsprachenzertifikat (B1/B2) freiwillig möglich.</p></div>' },
        { id:'machine', title:'Machine Languages', content:'<div class="card"><h3>Machine Languages</h3><p>Machine Code ist direkt vom Prozessor ausführbar, aber mühsam und maschinenabhängig.<br>Assembly verwendet Mnemonics (z. B. AND, SUB, MUL).<br>Höhere Sprachen müssen kompiliert werden.</p></div>' },
        { id:'vocab', title:'Wichtige Vokabeln', content:'<div class="card"><h3>Wichtige Vokabeln</h3><p>mnemonic = Eselsbrücke<br>to assemble = zusammenbauen<br>to compile = übersetzen<br>machine dependent = maschinenabhängig<br>tedious = mühsam<br>instruction = Befehl<br>executables = ausführbare Programme</p></div>' },
        { id:'themen', title:'Themen', content:'<div class="card"><h3>Themen</h3><p>Hör- und Leseverstehen, Computer & Machine Languages, Fachvokabular, IT-News</p></div>' }
      ],
      en: [
        { id:'noten', title:'Grading', content:'<div class="card"><h3>Grading</h3><p>3 equal grades · at least 1 written test · 1 presentation · possibly class participation/test</p><p>KMK Foreign Language Certificate (B1/B2) is voluntary.</p></div>' },
        { id:'machine', title:'Machine Languages', content:'<div class="card"><h3>Machine Languages</h3><p>Machine code is directly executable by the processor but tedious and machine-dependent.<br>Assembly language uses mnemonics (e.g. AND, SUB, MUL).<br>High-level languages must be compiled.</p></div>' },
        { id:'vocab', title:'Key Vocabulary', content:'<div class="card"><h3>Key Vocabulary</h3><p>mnemonic = memory aid / abbreviation<br>to assemble = to put together<br>to compile = to translate into machine code<br>machine dependent = dependent on the hardware<br>tedious = boring / laborious<br>instruction = command<br>executables = programs that can be run</p></div>' },
        { id:'themen', title:'Topics', content:'<div class="card"><h3>Topics</h3><p>Listening and reading comprehension, Computer & Machine Languages, technical vocabulary, IT-News</p></div>' }
      ]
    };

    let viewingTopic = false;
    function currentLang(){ return localStorage.getItem('fisi-lang') || 'fa'; }
    function renderTopicList(){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const container = document.getElementById('topicList');
      container.innerHTML = '';
      list.forEach(t => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'topic-item';
        a.innerHTML = `<h3>${t.title}</h3><span>→</span>`;
        a.onclick = (e) => { e.preventDefault(); showTopic(t.id); };
        container.appendChild(a);
      });
    }
    function showTopic(id){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const topic = list.find(t => t.id === id);
      if (!topic) return;
      document.getElementById('singleTopicContent').innerHTML = topic.content;
      document.getElementById('topicListView').style.display = 'none';
      document.getElementById('topicContentView').style.display = 'block';
      viewingTopic = true;
      history.replaceState(null, '', '#' + id);
      window.scrollTo(0, 0);
    }
    function showList(){
      document.getElementById('topicContentView').style.display = 'none';
      document.getElementById('topicListView').style.display = 'block';
      viewingTopic = false;
      history.replaceState(null, '', location.pathname + location.search);
      renderTopicList();
    }
    function smartBack(){
      if (viewingTopic) showList();
      else window.location.href = 'index.html';
    }
    function initFromHash() {
      const hash = location.hash.slice(1);
      if (hash) {
        const lang = currentLang();
        const list = topics[lang] || topics.fa;
        if (list.find(t => t.id === hash)) {
          showTopic(hash);
          return;
        }
      }
      renderTopicList();
    }
    const originalSetLang = window.setLang;
    window.setLang = function(lang){
      originalSetLang(lang);
      const hash = location.hash.slice(1);
      if (hash && viewingTopic) {
        showTopic(hash);
      } else {
        renderTopicList();
      }
    };
    document.addEventListener('DOMContentLoaded', initFromHash);
    window.addEventListener('hashchange', initFromHash);
  </script>
</body>
</html>
