<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fachpraxis | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .topic-list{display:grid;gap:.8rem;margin-top:1rem}
    .topic-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;text-decoration:none;color:inherit;transition:.2s}
    .topic-item:hover{border-color:var(--blue);transform:translateY(-2px)}
    .topic-item h3{font-size:1.05rem;margin:0}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html" class="active">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="englisch.html">Englisch</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>
  <div class="container page-head">
    <button type="button" class="back-btn" id="smartBack" onclick="smartBack()">←</button>
    <h1>Fachpraxis</h1>
    <p class="sub">Switch · Router · DHCP · Packet Tracer</p>
  </div>
  <main class="container">
    <div id="topicListView">
      <h2 data-i18n="topicsTitle" style="margin-bottom:1rem">موضوعات</h2>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div id="topicContentView" style="display:none">
      <div id="singleTopicContent"></div>
    </div>
  </main>
  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const topics = {
      fa: [
        { id:'ziel', title:'هدف', content:'<div class="card"><h3>هدف</h3><p>VLAN، روتر، DHCP و ping را خودت در Packet Tracer یا آزمایشگاه پیاده کنی.</p></div>' },
        { id:'szenario', title:'1) سناریو', content:'<div class="card"><h3>1) سناریو</h3><ul><li>VLAN 10: 192.168.10.0/24 · GW .1</li><li>VLAN 20: 192.168.20.0/24 · GW .1</li><li>1 سوئیچ · 1 روتر · 2 PC</li></ul></div>' },
        { id:'switch', title:'2) سوئیچ', content:'<div class="card"><h3>2) سوئیچ</h3><pre>vlan 10\n name BUERO\nvlan 20\n name TECHNIK\ninterface fa0/1\n switchport mode access\n switchport access vlan 10\ninterface fa0/2\n switchport mode access\n switchport access vlan 20\ninterface fa0/24\n switchport mode trunk</pre><p>Access برای PC · Trunk به روتر.</p></div>' },
        { id:'router', title:'3) روتر', content:'<div class="card"><h3>3) روتر</h3><pre>interface g0/0.10\n encapsulation dot1Q 10\n ip address 192.168.10.1 255.255.255.0\ninterface g0/0.20\n encapsulation dot1Q 20\n ip address 192.168.20.1 255.255.255.0\ninterface g0/0\n no shutdown</pre></div>' },
        { id:'dhcp', title:'4) DHCP', content:'<div class="card"><h3>4) DHCP</h3><pre>ip dhcp excluded-address 192.168.10.1 192.168.10.99\nip dhcp pool BUERO\n network 192.168.10.0 255.255.255.0\n default-router 192.168.10.1\n dns-server 8.8.8.8</pre></div>' },
        { id:'test', title:'5) تست', content:'<div class="card"><h3>5) تست</h3><ol><li>ipconfig → IP درست؟</li><li>ping Gateway</li><li>ping VLAN دیگر</li></ol></div>' }
      ],
      de: [
        { id:'ziel', title:'Ziel', content:'<div class="card"><h3>Ziel</h3><p>VLAN, Router, DHCP und Ping selbst in Packet Tracer oder Labor umsetzen.</p></div>' },
        { id:'szenario', title:'1) Szenario', content:'<div class="card"><h3>1) Szenario</h3><ul><li>VLAN 10: 192.168.10.0/24 · GW .1</li><li>VLAN 20: 192.168.20.0/24 · GW .1</li><li>1 Switch · 1 Router · 2 PCs</li></ul></div>' },
        { id:'switch', title:'2) Switch', content:'<div class="card"><h3>2) Switch</h3><pre>vlan 10\n name BUERO\nvlan 20\n name TECHNIK\ninterface fa0/1\n switchport mode access\n switchport access vlan 10\ninterface fa0/2\n switchport mode access\n switchport access vlan 20\ninterface fa0/24\n switchport mode trunk</pre><p>Access für PC · Trunk zum Router.</p></div>' },
        { id:'router', title:'3) Router', content:'<div class="card"><h3>3) Router</h3><pre>interface g0/0.10\n encapsulation dot1Q 10\n ip address 192.168.10.1 255.255.255.0\ninterface g0/0.20\n encapsulation dot1Q 20\n ip address 192.168.20.1 255.255.255.0\ninterface g0/0\n no shutdown</pre></div>' },
        { id:'dhcp', title:'4) DHCP', content:'<div class="card"><h3>4) DHCP</h3><pre>ip dhcp excluded-address 192.168.10.1 192.168.10.99\nip dhcp pool BUERO\n network 192.168.10.0 255.255.255.0\n default-router 192.168.10.1\n dns-server 8.8.8.8</pre></div>' },
        { id:'test', title:'5) Test', content:'<div class="card"><h3>5) Test</h3><ol><li>ipconfig → richtige IP?</li><li>ping Gateway</li><li>ping anderes VLAN</li></ol></div>' }
      ],
      en: [
        { id:'ziel', title:'Goal', content:'<div class="card"><h3>Goal</h3><p>Build VLAN, router, DHCP and ping yourself in Packet Tracer or the lab.</p></div>' },
        { id:'szenario', title:'1) Scenario', content:'<div class="card"><h3>1) Scenario</h3><ul><li>VLAN 10: 192.168.10.0/24 · GW .1</li><li>VLAN 20: 192.168.20.0/24 · GW .1</li><li>1 switch · 1 router · 2 PCs</li></ul></div>' },
        { id:'switch', title:'2) Switch', content:'<div class="card"><h3>2) Switch</h3><pre>vlan 10\n name BUERO\nvlan 20\n name TECHNIK\ninterface fa0/1\n switchport mode access\n switchport access vlan 10\ninterface fa0/2\n switchport mode access\n switchport access vlan 20\ninterface fa0/24\n switchport mode trunk</pre><p>Access for PC · Trunk to router.</p></div>' },
        { id:'router', title:'3) Router', content:'<div class="card"><h3>3) Router</h3><pre>interface g0/0.10\n encapsulation dot1Q 10\n ip address 192.168.10.1 255.255.255.0\ninterface g0/0.20\n encapsulation dot1Q 20\n ip address 192.168.20.1 255.255.255.0\ninterface g0/0\n no shutdown</pre></div>' },
        { id:'dhcp', title:'4) DHCP', content:'<div class="card"><h3>4) DHCP</h3><pre>ip dhcp excluded-address 192.168.10.1 192.168.10.99\nip dhcp pool BUERO\n network 192.168.10.0 255.255.255.0\n default-router 192.168.10.1\n dns-server 8.8.8.8</pre></div>' },
        { id:'test', title:'5) Test', content:'<div class="card"><h3>5) Test</h3><ol><li>ipconfig → correct IP?</li><li>ping gateway</li><li>ping other VLAN</li></ol></div>' }
      ]
    };

    let viewingTopic = false;
    function currentLang(){ return localStorage.getItem('fisi-lang') || 'fa'; }
    function renderTopicList(){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const container = document.getElementById('topicList');
      container.innerHTML = '';
      list.forEach(t => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'topic-item';
        a.innerHTML = `<h3>${t.title}</h3><span>→</span>`;
        a.onclick = (e) => { e.preventDefault(); showTopic(t.id); };
        container.appendChild(a);
      });
    }
    function showTopic(id){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const topic = list.find(t => t.id === id);
      if (!topic) return;
      document.getElementById('singleTopicContent').innerHTML = topic.content;
      document.getElementById('topicListView').style.display = 'none';
      document.getElementById('topicContentView').style.display = 'block';
      viewingTopic = true;
      window.scrollTo(0, 0);
    }
    function showList(){
      document.getElementById('topicContentView').style.display = 'none';
      document.getElementById('topicListView').style.display = 'block';
      viewingTopic = false;
      renderTopicList();
    }
    function smartBack(){
      if (viewingTopic) showList();
      else window.location.href = 'index.html';
    }
    const originalSetLang = window.setLang;
    window.setLang = function(lang){
      originalSetLang(lang);
      renderTopicList();
      showList();
    };
    document.addEventListener('DOMContentLoaded', renderTopicList);
  </script>
</body>
</html>
