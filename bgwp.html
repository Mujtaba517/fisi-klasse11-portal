<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BGWP | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .topic-list{display:grid;gap:.8rem;margin-top:1rem}
    .topic-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;text-decoration:none;color:inherit;transition:.2s}
    .topic-item:hover{border-color:var(--blue);transform:translateY(-2px)}
    .topic-item h3{font-size:1.05rem;margin:0}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html" class="active">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="englisch.html">Englisch</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>
  <div class="container page-head">
    <button type="button" class="back-btn" id="smartBack" onclick="smartBack()">←</button>
    <h1>BGWP – IT-Service Management</h1>
    <p class="sub">ITSM · Aufbau- & Ablauforganisation · eEPK · SLA · Incident</p>
  </div>
  <main class="container">
    <div id="topicListView">
      <h2 data-i18n="topicsTitle" style="margin-bottom:1rem">موضوعات</h2>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div id="topicContentView" style="display:none">
      <div id="singleTopicContent"></div>
    </div>
  </main>
  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const topics = {
      fa: [
        { id:'itsm', title:'1. مقدمه ITSM', content:'<div class="card"><h3>1. مقدمه ITSM</h3><p>IT Service Management = مدیریت خدمات فناوری اطلاعات بر اساس ITIL.</p><p>هدف: ارائه خدمات باکیفیت به کاربران با رعایت SLA.</p></div>' },
        { id:'org', title:'2. Aufbau- و Ablauforganisation', content:'<div class="card"><h3>2. Aufbau- و Ablauforganisation</h3><p><strong>Aufbauorganisation:</strong> ساختار سازمانی (چه کسی چه مسئولیتی دارد)</p><p><strong>Ablauforganisation:</strong> فرآیندها و نحوه انجام کارها (چگونه تیکت پردازش می‌شود)</p></div>' },
        { id:'eepk', title:'3. eEPK', content:'<div class="card"><h3>3. eEPK (زنجیره فرآیند توسعه‌یافته)</h3><p>Erweiterte ereignisgesteuerte Prozesskette = روش نمایش فرآیندها با:</p><ul><li><strong>Ereignis</strong> (رویداد)</li><li><strong>Funktion</strong> (فعالیت)</li><li><strong>Organisationseinheit</strong> (واحد سازمانی)</li><li><strong>Informationsobjekt</strong> (شیء اطلاعاتی)</li></ul></div>' },
        { id:'sla', title:'Serviceanfrage و SLA', content:'<div class="card"><h3>Serviceanfrage و SLA</h3><p>هر درخواست کاربر از IT = Serviceanfrage</p><ul><li><strong>Reaktionszeit:</strong> زمان تا اولین پاسخ</li><li><strong>Lösungszeit:</strong> زمان تا حل کامل</li></ul></div>' },
        { id:'incident', title:'Incident در مقابل Problem', content:'<div class="card"><h3>Incident در مقابل Problem</h3><ul><li><strong>Incident:</strong> اختلال فعلی → باید سریع برگردانده شود</li><li><strong>Problem:</strong> علت ریشه‌ای تکرار اختلالات</li></ul></div>' }
      ],
      de: [
        { id:'itsm', title:'1. Einführung in das ITSM', content:'<div class="card"><h3>1. Einführung in das ITSM</h3><p>IT Service Management auf Basis von ITIL. Ziel: qualitätsgesicherte Services unter Einhaltung von SLAs.</p></div>' },
        { id:'org', title:'2. Aufbau- und Ablauforganisation', content:'<div class="card"><h3>2. Aufbau- und Ablauforganisation</h3><p><strong>Aufbauorganisation:</strong> Wer ist für was verantwortlich?<br><strong>Ablauforganisation:</strong> Wie laufen die Prozesse ab?</p></div>' },
        { id:'eepk', title:'3. eEPK', content:'<div class="card"><h3>3. eEPK</h3><p>Erweiterte ereignisgesteuerte Prozesskette: Ereignis → Funktion → Organisationseinheit → Informationsobjekt</p></div>' },
        { id:'sla', title:'Serviceanfrage & SLA', content:'<div class="card"><h3>Serviceanfrage & SLA</h3><p>Reaktionszeit und Lösungszeit sind vertraglich festgelegt.</p></div>' },
        { id:'incident', title:'Incident vs. Problem', content:'<div class="card"><h3>Incident vs. Problem</h3><p>Incident = aktuelle Störung. Problem = Ursache wiederkehrender Störungen.</p></div>' }
      ],
      en: [
        { id:'itsm', title:'1. Introduction to ITSM', content:'<div class="card"><h3>1. Introduction to ITSM</h3><p>IT Service Management based on ITIL. Goal: quality services while meeting SLAs.</p></div>' },
        { id:'org', title:'2. Structural and Process Organisation', content:'<div class="card"><h3>2. Structural and Process Organisation</h3><p><strong>Aufbauorganisation:</strong> Who is responsible for what?<br><strong>Ablauforganisation:</strong> How do the processes run?</p></div>' },
        { id:'eepk', title:'3. eEPK', content:'<div class="card"><h3>3. eEPK</h3><p>Extended event-driven process chain: Event → Function → Organisational unit → Information object</p></div>' },
        { id:'sla', title:'Service Request & SLA', content:'<div class="card"><h3>Service Request & SLA</h3><p>Response time and resolution time are contractually defined.</p></div>' },
        { id:'incident', title:'Incident vs Problem', content:'<div class="card"><h3>Incident vs Problem</h3><p>Incident = current disruption. Problem = root cause of recurring issues.</p></div>' }
      ]
    };

    let viewingTopic = false;
    function currentLang(){ return localStorage.getItem('fisi-lang') || 'fa'; }
    function renderTopicList(){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const container = document.getElementById('topicList');
      container.innerHTML = '';
      list.forEach(t => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'topic-item';
        a.innerHTML = `<h3>${t.title}</h3><span>→</span>`;
        a.onclick = (e) => { e.preventDefault(); showTopic(t.id); };
        container.appendChild(a);
      });
    }
    function showTopic(id){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const topic = list.find(t => t.id === id);
      if (!topic) return;
      document.getElementById('singleTopicContent').innerHTML = topic.content;
      document.getElementById('topicListView').style.display = 'none';
      document.getElementById('topicContentView').style.display = 'block';
      viewingTopic = true;
      history.replaceState(null, '', '#' + id);
      window.scrollTo(0, 0);
    }
    function showList(){
      document.getElementById('topicContentView').style.display = 'none';
      document.getElementById('topicListView').style.display = 'block';
      viewingTopic = false;
      history.replaceState(null, '', location.pathname + location.search);
      renderTopicList();
    }
    function smartBack(){
      if (viewingTopic) showList();
      else window.location.href = 'index.html';
    }
    function initFromHash() {
      const hash = location.hash.slice(1);
      if (hash) {
        const lang = currentLang();
        const list = topics[lang] || topics.fa;
        if (list.find(t => t.id === hash)) {
          showTopic(hash);
          return;
        }
      }
      renderTopicList();
    }
    const originalSetLang = window.setLang;
    window.setLang = function(lang){
      originalSetLang(lang);
      const hash = location.hash.slice(1);
      if (hash && viewingTopic) {
        showTopic(hash);
      } else {
        renderTopicList();
      }
    };
    document.addEventListener('DOMContentLoaded', initFromHash);
    window.addEventListener('hashchange', initFromHash);
  </script>
</body>
</html>
