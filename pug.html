<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PuG | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .topic-list{display:grid;gap:.8rem;margin-top:1rem}
    .topic-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;text-decoration:none;color:inherit;transition:.2s}
    .topic-item:hover{border-color:var(--blue);transform:translateY(-2px)}
    .topic-item h3{font-size:1.05rem;margin:0}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html" class="active">PuG</a>
      <a href="englisch.html">Englisch</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>
  <div class="container page-head">
    <button type="button" class="back-btn" id="smartBack" onclick="smartBack()">←</button>
    <h1>PuG – Demokratie in der BRD</h1>
    <p class="sub">Strukturprinzipien · Volkssouveränität · Gewaltenteilung · Rechtsstaat</p>
  </div>
  <main class="container">
    <div id="topicListView">
      <h2 data-i18n="topicsTitle" style="margin-bottom:1rem">موضوعات</h2>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div id="topicContentView" style="display:none">
      <div id="singleTopicContent"></div>
    </div>
  </main>
  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const topics = {
      fa: [
        { id:'struktur', title:'1. اصول ساختاری', content:'<div class="card"><h3>1. اصول ساختاری (Strukturprinzipien)</h3><ul><li><strong>Volkssouveränität:</strong> قدرت برتر از مردم ناشی می‌شود</li><li><strong>Repräsentativsystem:</strong> مردم قدرت را به نمایندگان واگذار می‌کنند (نه مستقیم)</li><li><strong>Mehrheitsprinzip:</strong> اکثریت تصمیم می‌گیرد و اقلیت می‌پذیرد</li><li><strong>Gewaltenteilung:</strong> تفکیک قوا (قانون‌گذاری، اجرایی، قضایی)</li><li><strong>Rechtsstaatlichkeit:</strong> حاکمیت قانون، برابری در برابر قانون، حمایت از خودسری</li><li><strong>Sozialstaatlichkeit:</strong> سیاست اجتماعی و عدالت اجتماعی</li><li><strong>Bundesstaatlichkeit:</strong> تقسیم وظایف بین فدرال و ایالات</li></ul></div>' },
        { id:'demo', title:'2. اصول دموکراسی', content:'<div class="card"><h3>2. اصول دموکراسی در Grundgesetz</h3><p><strong>Volkssouveränität:</strong> قدرت برتر از مردم برمی‌آید.</p><p><strong>Repräsentativsystem:</strong> مردم مستقیم حکومت نمی‌کنند، بلکه از طریق انتخاب نمایندگان.</p><p><strong>Mehrheitsprinzip:</strong> اکثریت تصمیم می‌گیرد و اقلیت آن را می‌پذیرد.</p></div>' },
        { id:'direkt', title:'دموکراسی مستقیم', content:'<div class="card"><h3>دموکراسی مستقیم (Direkte Demokratie)</h3><p><strong>مزایا:</strong> تأثیر مستقیم مردم، افزایش مشروعیت، شفافیت بیشتر</p><p><strong>معایب:</strong> فقط برای مسائل ساده مناسب است، روند طولانی، اقلیت‌های متشکل ممکن است تأثیرگذار شوند</p></div>' },
        { id:'gewalt', title:'تفکیک قوا', content:'<div class="card"><h3>تفکیک قوا</h3><ul><li><strong>قوه قانون‌گذار:</strong> Bundestag + Bundesrat</li><li><strong>قوه مجریه:</strong> Bundesregierung، اداره، پلیس، ارتش</li><li><strong>قوه قضاییه:</strong> دادگاه‌ها (کنترل)</li></ul></div>' }
      ],
      de: [
        { id:'struktur', title:'1. Strukturprinzipien', content:'<div class="card"><h3>1. Strukturprinzipien</h3><ul><li>Volkssouveränität</li><li>Repräsentativsystem</li><li>Mehrheitsprinzip</li><li>Gewaltenteilung</li><li>Rechtsstaatlichkeit</li><li>Sozialstaatlichkeit</li><li>Bundesstaatlichkeit</li></ul></div>' },
        { id:'demo', title:'2. Prinzipien der Demokratie (GG)', content:'<div class="card"><h3>2. Prinzipien der Demokratie (GG)</h3><p><strong>Volkssouveränität:</strong> Alle Staatsgewalt geht vom Volke aus.<br><strong>Repräsentativsystem:</strong> Das Volk übt die Macht nicht direkt aus, sondern durch gewählte Abgeordnete.<br><strong>Mehrheitsprinzip:</strong> Die Mehrheit entscheidet, die Minderheit erkennt an.</p></div>' },
        { id:'direkt', title:'Direkte Demokratie', content:'<div class="card"><h3>Direkte Demokratie</h3><p><strong>Pro:</strong> unmittelbare Einflussnahme, höhere Legitimation, mehr Transparenz<br><strong>Contra:</strong> nur für einfache Fragen geeignet, langwierig, organisierte Minderheiten können Einfluss nehmen</p></div>' },
        { id:'gewalt', title:'Gewaltenteilung', content:'<div class="card"><h3>Gewaltenteilung</h3><p>Gesetzgebung (Bundestag/Bundesrat) – Ausführung (Regierung) – Rechtsprechung (Gerichte)</p></div>' }
      ],
      en: [
        { id:'struktur', title:'1. Structural Principles', content:'<div class="card"><h3>1. Structural Principles</h3><ul><li>Popular sovereignty (Volkssouveränität)</li><li>Representative system</li><li>Majority principle</li><li>Separation of powers</li><li>Rule of law</li><li>Welfare state</li><li>Federalism</li></ul></div>' },
        { id:'demo', title:'2. Democratic Principles (Basic Law)', content:'<div class="card"><h3>2. Democratic Principles (Basic Law)</h3><p><strong>Popular sovereignty:</strong> All state power comes from the people.<br><strong>Representative system:</strong> The people exercise power through elected representatives, not directly.<br><strong>Majority principle:</strong> The majority decides; the minority accepts.</p></div>' },
        { id:'direkt', title:'Direct Democracy', content:'<div class="card"><h3>Direct Democracy</h3><p><strong>Pros:</strong> direct influence, higher legitimacy, more transparency<br><strong>Cons:</strong> only suitable for simple questions, lengthy, organised minorities can exert influence</p></div>' },
        { id:'gewalt', title:'Separation of Powers', content:'<div class="card"><h3>Separation of Powers</h3><p>Legislature (Bundestag/Bundesrat) – Executive (Government) – Judiciary (Courts)</p></div>' }
      ]
    };

    let viewingTopic = false;
    function currentLang(){ return localStorage.getItem('fisi-lang') || 'fa'; }
    function renderTopicList(){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const container = document.getElementById('topicList');
      container.innerHTML = '';
      list.forEach(t => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'topic-item';
        a.innerHTML = `<h3>${t.title}</h3><span>→</span>`;
        a.onclick = (e) => { e.preventDefault(); showTopic(t.id); };
        container.appendChild(a);
      });
    }
    function showTopic(id){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const topic = list.find(t => t.id === id);
      if (!topic) return;
      document.getElementById('singleTopicContent').innerHTML = topic.content;
      document.getElementById('topicListView').style.display = 'none';
      document.getElementById('topicContentView').style.display = 'block';
      viewingTopic = true;
      history.replaceState(null, '', '#' + id);
      window.scrollTo(0, 0);
    }
    function showList(){
      document.getElementById('topicContentView').style.display = 'none';
      document.getElementById('topicListView').style.display = 'block';
      viewingTopic = false;
      history.replaceState(null, '', location.pathname + location.search);
      renderTopicList();
    }
    function smartBack(){
      if (viewingTopic) showList();
      else window.location.href = 'index.html';
    }
    function initFromHash() {
      const hash = location.hash.slice(1);
      if (hash) {
        const lang = currentLang();
        const list = topics[lang] || topics.fa;
        if (list.find(t => t.id === hash)) {
          showTopic(hash);
          return;
        }
      }
      renderTopicList();
    }
    const originalSetLang = window.setLang;
    window.setLang = function(lang){
      originalSetLang(lang);
      const hash = location.hash.slice(1);
      if (hash && viewingTopic) {
        showTopic(hash);
      } else {
        renderTopicList();
      }
    };
    document.addEventListener('DOMContentLoaded', initFromHash);
    window.addEventListener('hashchange', initFromHash);
  </script>
</body>
</html>
