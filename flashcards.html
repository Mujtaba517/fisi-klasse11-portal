  <main id="main" class="container">
    <div class="fc-wrap">
      <div class="fc-scene" id="cardScene" onclick="flipCard()" onkeydown="cardKey(event)" role="button" tabindex="0" aria-labelledby="cardTerm">
        <div class="fc-card" id="flashcard">
          <div class="fc-face fc-front">
            <div class="term" id="cardTerm">Serviceanfrage</div>

          </div>

  <script src="script.js"></script>
  <script>
    const cards = [
      {"de": "Serviceanfrage", "def": {"de": "Jede Bitte einer Person an die IT, zum Beispiel Software installieren oder einen Drucker reparieren.", "en": "Any request a person makes to IT, for example installing software or repairing a printer.", "fa": "هر درخواست یک شخص از IT، مثلاً نصب نرم‌افزار یا تعمیر چاپگر."}},
      {"de": "Störungsmeldung", "def": {"de": "Meldung, dass ein Dienst oder ein Gerät gerade nicht richtig arbeitet.", "en": "A report that a service or a device is not working properly right now.", "fa": "گزارش اینکه یک خدمت یا دستگاه همین حالا درست کار نمی‌کند."}},
      {"de": "Eskalation", "def": {"de": "Der Fall geht mit den bisherigen Notizen an eine höhere Support-Stufe.", "en": "The case goes to a higher support level together with the notes already taken.", "fa": "پرونده با یادداشت‌های تا اینجا به سطح بالاتر پشتیبانی می‌رود."}},
      {"de": "Deeskalation", "def": {"de": "Ein aufgebrachtes Gespräch beruhigen. Das ist kein Ticketstatus und ersetzt keine technische Eskalation.", "en": "Calming an upset conversation. This is not a ticket status and does not replace technical escalation.", "fa": "آرام کردن یک گفتگوی ناراحت. این وضعیت تیکت نیست و جای ارجاع فنی را نمی‌گیرد."}},
      {"de": "First-Level-Support", "def": {"de": "Die erste Anlaufstelle. Sie löst Standardfälle, zum Beispiel ein Passwort, und dokumentiert sie.", "en": "The first contact. It solves standard cases, for example a password, and documents them.", "fa": "اولین تماس. موارد استاندارد را حل می‌کند، مثلاً گذرواژه، و ثبت می‌کند."}},
      {"de": "Incident", "def": {"de": "Die Störung jetzt. Ziel ist, den Dienst schnell wieder benutzbar zu machen.", "en": "The fault right now. The goal is to make the service usable again quickly.", "fa": "اختلال همین حالا. هدف این است که خدمت سریع دوباره قابل استفاده شود."}},
      {"de": "Problem", "def": {"de": "Die Ursache, die Störungen wiederholt erzeugt. Nicht dasselbe wie die einzelne Störung.", "en": "The cause that creates faults again and again. Not the same as the single fault.", "fa": "علتی که اختلال را بارها می‌سازد. همان اختلال تنها نیست."}},
      {"de": "SLA", "def": {"de": "Schriftliche Zusage mit zwei Uhren: Reaktionszeit bis zur ersten fachlichen Antwort und Lösungszeit bis der Dienst wieder da ist.", "en": "A written promise with two clocks: response time until the first professional reply, and resolution time until the service is back.", "fa": "قول کتبی با دو ساعت: زمان واکنش تا اولین پاسخ تخصصی، و زمان حل تا بازگشت خدمت."}},
      {"de": "Cyber-physisches System", "def": {"de": "Software und Physik im Kreis: messen, entscheiden, handeln, wieder messen. Eine reine Netzverbindung reicht nicht.", "en": "Software and physics in a loop: measure, decide, act, measure again. A network connection alone is not enough.", "fa": "نرم‌افزار و فیزیک در یک حلقه: اندازه بگیر، تصمیم بگیر، عمل کن، دوباره اندازه بگیر. اتصال شبکه به‌تنهایی کافی نیست."}},
      {"de": "Sensor", "def": {"de": "Wandelt eine physikalische Größe in ein Signal für die Software. Die Information kommt aus der Welt.", "en": "Turns a physical quantity into a signal for the software. The information comes from the world.", "fa": "یک کمیت فیزیکی را به سیگنال برای نرم‌افزار تبدیل می‌کند. اطلاعات از جهان می‌آید."}},
      {"de": "Aktor", "def": {"de": "Wandelt ein Signal in eine Wirkung in der Welt, zum Beispiel Relais, Lampe oder Motor. Eine LED ist ein Aktor, kein Sensor.", "en": "Turns a signal into an effect in the world, for example a relay, lamp or motor. An LED is an actuator, not a sensor.", "fa": "یک سیگنال را به اثر در جهان تبدیل می‌کند، مثلاً رله، لامپ یا موتور. LED عملگر است، نه سنسور."}},
      {"de": "Mikrocontroller", "def": {"de": "Kleiner Rechner, der Sensoren liest und Aktoren steuert. Ein ESP32 ist ein Beispiel, mit WLAN und 3,3-V-Logik.", "en": "A small computer that reads sensors and controls actuators. An ESP32 is an example, with Wi-Fi and 3.3 V logic.", "fa": "رایانه کوچک که سنسور می‌خواند و عملگر را کنترل می‌کند. ESP32 یک مثال است، با وای‌فای و منطق ۳٫۳ ولت."}},
      {"de": "MQTT-Broker", "def": {"de": "Vermittler für MQTT. Die Geräte schicken Nachrichten an ihn, nicht jeder direkt an jeden.", "en": "The MQTT intermediary. Devices send messages to it, not everyone directly to everyone.", "fa": "واسط MQTT. دستگاه‌ها پیام را به او می‌فرستند، نه هر کدام مستقیم به هر کدام."}},
      {"de": "Topic", "def": {"de": "Name des MQTT-Kanals, zum Beispiel lager/temp. Wer ihn abonniert hat, bekommt die Nachrichten.", "en": "Name of the MQTT channel, for example lager/temp. Whoever subscribed receives the messages.", "fa": "نام کانال MQTT، مثلاً lager/temp. هر کس مشترک شده باشد پیام را می‌گیرد."}},
      {"de": "QoS", "def": {"de": "Zustellgarantie bei MQTT. 0 = höchstens einmal, 1 = mindestens einmal, 2 = genau einmal.", "en": "Delivery promise in MQTT. 0 = at most once, 1 = at least once, 2 = exactly once.", "fa": "قول تحویل در MQTT. ۰ = حداکثر یک بار، ۱ = حداقل یک بار، ۲ = دقیقاً یک بار."}},
      {"de": "Datenmodellierung", "def": {"de": "Der Plan, welche Dinge es gibt und wie sie zusammenhängen, bevor eine Tabelle angelegt wird.", "en": "The plan of which things exist and how they belong together, before a table is created.", "fa": "نقشه اینکه چه چیزهایی هستند و چطور به هم‌اند، پیش از ساختن جدول."}},
      {"de": "Entität", "def": {"de": "Ein Ding, das gespeichert wird, zum Beispiel ein Kunde oder ein Ticket.", "en": "A thing that is stored, for example a customer or a ticket.", "fa": "چیزی که ذخیره می‌شود، مثلاً مشتری یا تیکت."}},
      {"de": "Primärschlüssel", "def": {"de": "Die eindeutige ID einer Zeile. Ein Name ist dafür schlecht, weil er sich wiederholen kann.", "en": "The unique ID of a row. A name is a poor key because it can repeat.", "fa": "شناسه یکتای یک ردیف. نام برای این کار بد است چون می‌تواند تکرار شود."}},
      {"de": "Schnittstelle / API", "def": {"de": "Eine vereinbarte Grenze, über die zwei Systeme Daten tauschen.", "en": "An agreed boundary through which two systems exchange data.", "fa": "مرز توافق‌شده‌ای که دو سیستم از آن داده عوض می‌کنند."}},
      {"de": "JSON", "def": {"de": "Ein Textformat mit Feldern und Werten. Bei REST üblich, aber nicht vorgeschrieben.", "en": "A text format with fields and values. Common with REST, but not required.", "fa": "یک قالب متنی با فیلد و مقدار. با REST معمول است، ولی اجباری نیست."}},
      {"de": "Teilnetz / Subnetz", "def": {"de": "Ein großes Netz in kleinere Netze teilen. Bei /24 bleiben 254 nutzbare Hosts, nicht 256.", "en": "Splitting a large network into smaller ones. A /24 leaves 254 usable hosts, not 256.", "fa": "تقسیم یک شبکه بزرگ به شبکه‌های کوچک‌تر. در /24، ۲۵۴ میزبان قابل استفاده می‌ماند، نه ۲۵۶."}},
      {"de": "VLAN", "def": {"de": "Ein logisches Netz auf einem physischen Switch. Verschiedene VLANs sprechen nicht direkt miteinander.", "en": "A logical network on one physical switch. Different VLANs do not talk directly.", "fa": "یک شبکه منطقی روی یک سوئیچ فیزیکی. VLANهای مختلف مستقیم حرف نمی‌زنند."}},
      {"de": "Standardgateway", "def": {"de": "Die Routeradresse für Ziele außerhalb des eigenen Netzes. Sie steht in der IP-Anzeige und ist nicht automatisch .1.", "en": "The router address for targets outside your own network. It is on the IP screen and is not automatically .1.", "fa": "آدرس روتر برای هدف‌های بیرون شبکه خودت. در صفحه IP است و خودکار .1 نیست."}},
      {"de": "Firewall", "def": {"de": "Filtert Verkehr nach Regeln. NAT übersetzt nur Adressen und ist keine Firewall.", "en": "Filters traffic by rules. NAT only translates addresses and is not a firewall.", "fa": "ترافیک را با قانون فیلتر می‌کند. NAT فقط آدرس را ترجمه می‌کند و فایروال نیست."}},
      {"de": "OSI-Schicht", "def": {"de": "Ein Denkmodell. Schicht 1 ist das Signal, nicht der Switch. Schicht 2 ist MAC, Switch und VLAN.", "en": "A thinking model. Layer 1 is the signal, not the switch. Layer 2 is MAC, switch and VLAN.", "fa": "یک مدل فکری. لایه ۱ سیگنال است، نه سوئیچ. لایه ۲ یعنی MAC، سوئیچ و VLAN."}},
      {"de": "DHCP", "def": {"de": "Vergibt Adresse, Maske, Gateway und oft DNS. Die Reihenfolge ist Discover, Offer, Request, Acknowledge.", "en": "Assigns address, mask, gateway and often DNS. The order is Discover, Offer, Request, Acknowledge.", "fa": "آدرس، ماسک، Gateway و اغلب DNS می‌دهد. ترتیب Discover، Offer، Request، Acknowledge است."}},
      {"de": "DNS", "def": {"de": "Übersetzt einen Namen in eine IP-Adresse. Antwortet die IP und der Name nicht, liegt es an der Übersetzung.", "en": "Translates a name into an IP address. If the IP answers and the name does not, the translation is the fault.", "fa": "یک نام را به آدرس IP ترجمه می‌کند. اگر IP جواب بدهد و نام نه، اشکال از ترجمه است."}},
      {"de": "NAT", "def": {"de": "Übersetzt private Adressen in eine öffentliche. Es filtert nicht und ersetzt keine Firewall.", "en": "Translates private addresses into a public one. It does not filter and does not replace a firewall.", "fa": "آدرس خصوصی را به یک آدرس عمومی ترجمه می‌کند. فیلتر نمی‌کند و جای فایروال را نمی‌گیرد."}},
      {"de": "Access-Port", "def": {"de": "Ein Switch-Port mit genau einem VLAN, für einen PC, ohne VLAN-Tag.", "en": "A switch port with exactly one VLAN, for a PC, without a VLAN tag.", "fa": "یک پورت سوئیچ با دقیقاً یک VLAN، برای رایانه، بدون برچسب VLAN."}},
      {"de": "Trunk", "def": {"de": "Ein Switch-Port mit mehreren VLANs und Tags, typisch zwischen Switch und Router.", "en": "A switch port with several VLANs and tags, typically between switch and router.", "fa": "یک پورت سوئیچ با چند VLAN و برچسب، معمولاً بین سوئیچ و روتر."}},
      {"de": "Berichtsheft", "def": {"de": "Nachweis, was in Betrieb und Schule gelernt wurde. Regelmäßig schreiben, nicht am Ende erfinden.", "en": "A record of what was learned in the company and at school. Write it regularly. Do not invent it at the end.", "fa": "ثبت آنچه در شرکت و مدرسه یاد گرفته شد. مرتب بنویس، در پایان نساز."}},
    ];

    const ui = {
      fa: { prev: '← قبلی', next: 'بعدی →', shuffle: 'بُر زدن', hint: 'کلیک برای دیدن توضیح' },
      de: { prev: '← Zurück', next: 'Weiter →', shuffle: 'Mischen', hint: 'Klicken zum Umdrehen' },
      en: { prev: '← Previous', next: 'Next →', shuffle: 'Shuffle', hint: 'Click to flip' }
    };

    let current = 0;
    let flipped = false;

    function lang() {
      return localStorage.getItem('fisi-lang') || 'fa';
    }

    function renderCard() {
      const c = cards[current];
      const l = lang();
      const t = ui[l] || ui.fa;

      document.getElementById('cardTerm').textContent = c.de;
      document.getElementById('cardHint').textContent = t.hint;
      const meaning = (c.def && (c.def[l] || c.def.de)) || '';
      document.getElementById('cardMeaning').textContent = meaning;

      document.getElementById('btnPrev').textContent = t.prev;
      document.getElementById('btnNext').textContent = t.next;
      document.getElementById('btnShuffle').textContent = t.shuffle;
      document.getElementById('progress').textContent = (current + 1) + ' / ' + cards.length;

      document.getElementById('flashcard').classList.remove('is-flipped');
      flipped = false;
      const scene = document.getElementById('cardScene');
      if (scene) scene.setAttribute('aria-pressed', 'false');
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('flashcard').classList.toggle('is-flipped', flipped);
      const scene = document.getElementById('cardScene');
      if (scene) scene.setAttribute('aria-pressed', flipped ? 'true' : 'false');
    }

    function cardKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipCard();
        return;
      }
      const rtl = document.documentElement.dir === 'rtl';
      const next = rtl ? 'ArrowLeft' : 'ArrowRight';
      const prev = rtl ? 'ArrowRight' : 'ArrowLeft';
      if (e.key === next) { e.preventDefault(); nextCard(); }
      if (e.key === prev) { e.preventDefault(); prevCard(); }
    }

    function nextCard() {
      current = (current + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      current = (current - 1 + cards.length) % cards.length;
      renderCard();
    }

    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      current = 0;
      renderCard();
    }

    document.addEventListener('DOMContentLoaded', renderCard);

    const _setLang = window.setLang;
    window.setLang = function (l) {
      _setLang(l);
      renderCard();
    };
  </script>
  <script src="settings.js"></script>
