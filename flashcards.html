  <main id="main" class="container">
    <div class="fc-wrap">
      <div class="fc-scene" id="cardScene" onclick="flipCard()" onkeydown="cardKey(event)" role="button" tabindex="0" aria-labelledby="cardTerm">
        <div class="fc-card" id="flashcard">
          <div class="fc-face fc-front">
            <div class="term" id="cardTerm">Serviceanfrage</div>
            <div class="hint" id="cardHint"></div>
          </div>
          <div class="fc-face fc-back">
            <div class="meaning" id="cardMeaning"></div>
          </div>
        </div>
      </div>

      <div class="fc-controls">
        <button type="button" class="btn btn-soft" onclick="event.stopPropagation(); prevCard()" id="btnPrev">← قبلی</button>
        <button type="button" class="btn btn-primary" onclick="event.stopPropagation(); nextCard()" id="btnNext">بعدی →</button>
        <button type="button" class="btn btn-soft" onclick="event.stopPropagation(); shuffleCards()" id="btnShuffle">بُر زدن</button>
      </div>
      <div class="fc-progress" id="progress">1 / 24</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p data-i18n="footer">Fachinformatiker Systemintegration · Klasse 11 · 2026</p>

    </div>

  <script src="script.js"></script>
  <script>
    const cards = [
      { de: 'Serviceanfrage', 
        fa: 'درخواست خدمات: هر درخواستی که کاربر از بخش IT دارد (مثل نصب نرم‌افزار یا خرابی پرینتر).', 
        en: 'Service request: Any request a user makes to the IT department (e.g. software installation or printer issue).' },
      { de: 'Störungsmeldung', 
        fa: 'گزارش اختلال: اعلام خرابی یک سرویس یا دستگاه به پشتیبانی.', 
        en: 'Incident report: Reporting a disruption of a service or device to support.' },
      { de: 'Eskalation', 
        fa: 'ارجاع به سطح بالاتر: وقتی که مشکل در سطح اول حل نشود و به متخصص بالاتر ارجاع می‌شود.', 
        en: 'Escalation: Passing a problem to a higher support level when it cannot be solved at the first level.' },
      { de: 'Deeskalation', 
        fa: 'آرام‌سازی: آرام کردن کاربر عصبانی و جلوگیری از افزایش تنش.', 
        en: 'De-escalation: Calming an angry user and preventing the situation from getting worse.' },
      { de: 'First-Level-Support', 
        fa: 'پشتیبانی سطح اول: اولین نقطه تماس که مشکلات ساده را حل می‌کند (ریست رمز، راهنمایی اولیه).', 
        en: 'First-level support: The first contact point that handles simple issues (password reset, basic guidance).' },
      { de: 'Incident', 
        fa: 'اختلال فعلی سرویس: چیزی الان خراب است و باید سریع برگردانده شود.', 
        en: 'Incident: Something is currently broken and needs to be restored quickly.' },
      { de: 'Problem', 
        fa: 'علت ریشه‌ای: علت اصلی که باعث تکرار اختلالات می‌شود.', 
        en: 'Problem: The root cause that leads to recurring incidents.' },
      { de: 'SLA', 
        fa: 'توافق سطح خدمات: قول کتبی درباره زمان پاسخ و زمان حل مشکل.', 
        en: 'Service Level Agreement: Written promise about response time and resolution time.' },
      { de: 'Cyber-physisches System', 
        fa: 'سیستم سایبر-فیزیکی: ترکیب دنیای فیزیکی (سنسور، موتور) با دنیای IT.', 
        en: 'Cyber-physical system: Combination of the physical world (sensors, motors) with IT.' },
      { de: 'Sensor', 
        fa: 'سنسور: دستگاهی که مقدار فیزیکی (دما، رطوبت، حرکت) را اندازه می‌گیرد.', 
        en: 'Sensor: A device that measures a physical value (temperature, humidity, motion).' },
      { de: 'Aktor', 
        fa: 'عملگر: دستگاهی که کار فیزیکی انجام می‌دهد (رله، فن، موتور).', 
        en: 'Actuator: A device that performs a physical action (relay, fan, motor).' },
      { de: 'Mikrocontroller', 
        fa: 'میکروکنترلر: مغز کوچک سیستم (مثل ESP32) که سنسورها را می‌خواند و اکتورها را کنترل می‌کند.', 
        en: 'Microcontroller: Small brain of the system (e.g. ESP32) that reads sensors and controls actuators.' },
      { de: 'MQTT-Broker', 
        fa: 'واسط پیام MQTT: سرور مرکزی که پیام‌ها را بین دستگاه‌ها منتقل می‌کند.', 
        en: 'MQTT Broker: Central server that forwards messages between devices.' },
      { de: 'Topic', 
        fa: 'موضوع پیام: نام کانالی که پیام‌ها روی آن منتشر می‌شوند (مثل lager/temp).', 
        en: 'Topic: The channel name on which messages are published (e.g. lager/temp).' },
      { de: 'QoS', 
        fa: 'کیفیت تحویل پیام: سطح تضمین رسیدن پیام در MQTT (0 = ممکن است گم شود، 1 = حداقل یک بار).', 
        en: 'Quality of Service: Delivery guarantee level in MQTT (0 = may be lost, 1 = at least once).' },
      { de: 'Datenmodellierung', 
        fa: 'مدل‌سازی داده: طراحی ساختار داده‌ها قبل از پیاده‌سازی پایگاه داده.', 
        en: 'Data modelling: Designing the structure of data before implementing a database.' },
      { de: 'Entität', 
        fa: 'موجودیت: شیء یا مفهومی که در پایگاه داده ذخیره می‌شود (مثل مشتری یا تیکت).', 
        en: 'Entity: A thing or concept that is stored in a database (e.g. customer or ticket).' },
      { de: 'Primärschlüssel', 
        fa: 'کلید اصلی: شناسه یکتا برای هر رکورد در جدول (مثل id).', 
        en: 'Primary key: Unique identifier for each record in a table (e.g. id).' },
      { de: 'Schnittstelle / API', 
        fa: 'رابط برنامه‌نویسی: راه ارتباط بین دو سیستم برای تبادل داده.', 
        en: 'Interface / API: A way for two systems to communicate and exchange data.' },
      { de: 'JSON', 
        fa: 'فرمت داده سبک: فرمت متنی رایج برای ارسال داده در APIها.', 
        en: 'Lightweight data format: Common text format for sending data in APIs.' },
      { de: 'Teilnetz / Subnetz', 
        fa: 'زیرشبکه: تقسیم یک شبکه بزرگ به چند شبکه کوچک‌تر.', 
        en: 'Subnet: Dividing a large network into smaller networks.' },
      { de: 'VLAN', 
        fa: 'شبکه مجازی محلی: جدا کردن منطقی شبکه روی یک سوئیچ فیزیکی.', 
        en: 'Virtual LAN: Logically separating networks on the same physical switch.' },
      { de: 'Standardgateway', 
        fa: 'دروازه پیش‌فرض: آدرس روتر که پکت‌ها را به خارج از شبکه محلی می‌فرستد.', 
        en: 'Default gateway: The router address that forwards packets outside the local network.' },
      { de: 'Firewall', 
        fa: 'فایروال: دستگاه یا نرم‌افزاری که ترافیک شبکه را کنترل و فیلتر می‌کند.', 
        en: 'Firewall: Device or software that controls and filters network traffic.' }
    ];

    const ui = {
      fa: { prev: '← قبلی', next: 'بعدی →', shuffle: 'بُر زدن', hint: 'کلیک برای دیدن توضیح' },
      de: { prev: '← Zurück', next: 'Weiter →', shuffle: 'Mischen', hint: 'Klicken zum Umdrehen' },
      en: { prev: '← Previous', next: 'Next →', shuffle: 'Shuffle', hint: 'Click to flip' }
    };

    let current = 0;
    let flipped = false;

    function lang() {
      return localStorage.getItem('fisi-lang') || 'fa';
    }

    function renderCard() {
      const c = cards[current];
      const l = lang();
      const t = ui[l] || ui.fa;

      document.getElementById('cardTerm').textContent = c.de;
      document.getElementById('cardHint').textContent = t.hint;

      let html = '';
      if (l === 'fa') {
        html = c.fa + '<span class="trans">EN: ' + c.en + '</span>';
      } else if (l === 'de') {
        html = c.en + '<span class="trans">FA: ' + c.fa.split(':')[0] + '</span>';
      } else {
        html = c.en + '<span class="trans">DE: ' + c.de + '</span>';
      }
      document.getElementById('cardMeaning').innerHTML = html;

      document.getElementById('btnPrev').textContent = t.prev;
      document.getElementById('btnNext').textContent = t.next;
      document.getElementById('btnShuffle').textContent = t.shuffle;
      document.getElementById('progress').textContent = (current + 1) + ' / ' + cards.length;

      document.getElementById('flashcard').classList.remove('is-flipped');
      flipped = false;
      const scene = document.getElementById('cardScene');
      if (scene) scene.setAttribute('aria-pressed', 'false');
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('flashcard').classList.toggle('is-flipped', flipped);
      const scene = document.getElementById('cardScene');
      if (scene) scene.setAttribute('aria-pressed', flipped ? 'true' : 'false');
    }

    function cardKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipCard();
        return;
      }
      const rtl = document.documentElement.dir === 'rtl';
      const next = rtl ? 'ArrowLeft' : 'ArrowRight';
      const prev = rtl ? 'ArrowRight' : 'ArrowLeft';
      if (e.key === next) { e.preventDefault(); nextCard(); }
      if (e.key === prev) { e.preventDefault(); prevCard(); }
    }

    function nextCard() {
      current = (current + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      current = (current - 1 + cards.length) % cards.length;
      renderCard();
    }

    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      current = 0;
      renderCard();
    }

    document.addEventListener('DOMContentLoaded', renderCard);

    const _setLang = window.setLang;
    window.setLang = function (l) {
      _setLang(l);
      renderCard();
    };
  </script>
  <script src="settings.js"></script>
  <script src="admin-panel.js"></script>
  <script src="shell.js"></script>
  <script src="lesson.js"></script>
