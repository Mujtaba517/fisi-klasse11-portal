  <script>
    const cards = [{"de":"Serviceanfrage","def":{"de":"Jede Bitte einer Person an die IT, zum Beispiel Software installieren oder einen Drucker reparieren.","en":"Any request a person makes to IT, for example installing software or repairing a printer.","fa":"هر درخواست یک شخص از IT، مثلاً نصب نرم‌افزار یا تعمیر چاپگر."}},{"de":"Störungsmeldung","def":{"de":"Meldung, dass ein Dienst oder ein Gerät gerade nicht richtig arbeitet.","en":"A report that a service or a device is not working properly right now.","fa":"گزارش اینکه یک خدمت یا دستگاه همین حالا درست کار نمی‌کند."}},{"de":"Eskalation","def":{"de":"Der Fall geht mit den bisherigen Notizen an eine höhere Support-Stufe.","en":"The case goes to a higher support level together with the notes already taken.","fa":"پرونده با یادداشت‌های تا اینجا به سطح بالاتر پشتیبانی می‌رود."}},{"de":"Deeskalation","def":{"de":"Ein aufgebrachtes Gespräch beruhigen. Das ist kein Ticketstatus und ersetzt keine technische Eskalation.","en":"Calming an upset conversation. This is not a ticket status and does not replace technical escalation.","fa":"آرام کردن یک گفتگوی ناراحت. این وضعیت تیکت نیست و جای ارجاع فنی را نمی‌گیرد."}},{"de":"First-Level-Support","def":{"de":"Die erste Anlaufstelle. Sie löst Standardfälle, zum Beispiel ein Passwort, und dokumentiert sie.","en":"The first contact. It solves standard cases, for example a password, and documents them.","fa":"اولین تماس. موارد استاندارد را حل می‌کند، مثلاً گذرواژه، و ثبت می‌کند."}},{"de":"Incident","def":{"de":"Die Störung jetzt. Ziel ist, den Dienst schnell wieder benutzbar zu machen.","en":"The fault right now. The goal is to make the service usable again quickly.","fa":"اختلال همین حالا. هدف این است که خدمت سریع دوباره قابل استفاده شود."}},{"de":"Problem","def":{"de":"Die Ursache, die Störungen wiederholt erzeugt. Nicht dasselbe wie die einzelne Störung.","en":"The cause that creates faults again and again. Not the same as the single fault.","fa":"علتی که اختلال را بارها می‌سازد. همان اختلال تنها نیست."}},{"de":"SLA","def":{"de":"Schriftliche Zusage mit zwei Uhren: Reaktionszeit bis zur ersten fachlichen Antwort und Lösungszeit bis der Dienst wieder da ist.","en":"A written promise with two clocks: response time until the first professional reply, and resolution time until the service is back.","fa":"قول کتبی با دو ساعت: زمان واکنش تا اولین پاسخ تخصصی، و زمان حل تا بازگشت خدمت."}},{"de":"Cyber-physisches System","def":{"de":"Software und Physik im Kreis: messen, entscheiden, handeln, wieder messen. Eine reine Netzverbindung reicht nicht.","en":"Software and physics in a loop: measure, decide, act, measure again. A network connection alone is not enough.","fa":"نرم‌افزار و فیزیک در یک حلقه: اندازه بگیر، تصمیم بگیر، عمل کن، دوباره اندازه بگیر. اتصال شبکه به‌تنهایی کافی نیست."}},{"de":"Sensor","def":{"de":"Wandelt eine physikalische Größe in ein Signal für die Software. Die Information kommt aus der Welt.","en":"Turns a physical quantity into a signal for the software. The information comes from the world.","fa":"یک کمیت فیزیکی را به سیگنال برای نرم‌افزار تبدیل می‌کند. اطلاعات از جهان می‌آید."}},{"de":"Aktor","def":{"de":"Wandelt ein Signal in eine Wirkung in der Welt, zum Beispiel Relais, Lampe oder Motor. Eine LED ist ein Aktor, kein Sensor.","en":"Turns a signal into an effect in the world, for example a relay, lamp or motor. An LED is an actuator, not a sensor.","fa":"یک سیگنال را به اثر در جهان تبدیل می‌کند، مثلاً رله، لامپ یا موتور. LED عملگر است، نه سنسور."}},{"de":"Mikrocontroller","def":{"de":"Kleiner Rechner, der Sensoren liest und Aktoren steuert. Ein ESP32 ist ein Beispiel, mit WLAN und 3,3-V-Logik.","en":"A small computer that reads sensors and controls actuators. An ESP32 is an example, with Wi-Fi and 3.3 V logic.","fa":"رایانه کوچک که سنسور می‌خواند و عملگر را کنترل می‌کند. ESP32 یک مثال است، با وای‌فای و منطق ۳٫۳ ولت."}},{"de":"MQTT-Broker","def":{"de":"Vermittler für MQTT. Die Geräte schicken Nachrichten an ihn, nicht jeder direkt an jeden.","en":"The MQTT intermediary. Devices send messages to it, not everyone directly to everyone.","fa":"واسط MQTT. دستگاه‌ها پیام را به او می‌فرستند، نه هر کدام مستقیم به هر کدام."}},{"de":"Topic","def":{"de":"Name des MQTT-Kanals, zum Beispiel lager/temp. Wer ihn abonniert hat, bekommt die Nachrichten.","en":"Name of the MQTT channel, for example lager/temp. Whoever subscribed receives the messages.","fa":"نام کانال MQTT، مثلاً lager/temp. هر کس مشترک شده باشد پیام را می‌گیرد."}},{"de":"QoS","def":{"de":"Zustellgarantie bei MQTT. 0 = höchstens einmal, 1 = mindestens einmal, 2 = genau einmal.","en":"Delivery promise in MQTT. 0 = at most once, 1 = at least once, 2 = exactly once.","fa":"قول تحویل در MQTT. ۰ = حداکثر یک بار، ۱ = حداقل یک بار، ۲ = دقیقاً یک بار."}},{"de":"Datenmodellierung","def":{"de":"Der Plan, welche Dinge es gibt und wie sie zusammenhängen, bevor eine Tabelle angelegt wird.","en":"The plan of which things exist and how they belong together, before a table is created.","fa":"نقشه اینکه چه چیزهایی هستند و چطور به هم‌اند، پیش از ساختن جدول."}},{"de":"Entität","def":{"de":"Ein Ding, das gespeichert wird, zum Beispiel ein Kunde oder ein Ticket.","en":"A thing that is stored, for example a customer or a ticket.","fa":"چیزی که ذخیره می‌شود، مثلاً مشتری یا تیکت."}},{"de":"Primärschlüssel","def":{"de":"Die eindeutige ID einer Zeile. Ein Name ist dafür schlecht, weil er sich wiederholen kann.","en":"The unique ID of a row. A name is a poor key because it can repeat.","fa":"شناسه یکتای یک ردیف. نام برای این کار بد است چون می‌تواند تکرار شود."}},{"de":"Schnittstelle / API","def":{"de":"Eine vereinbarte Grenze, über die zwei Systeme Daten tauschen.","en":"An agreed boundary through which two systems exchange data.","fa":"مرز توافق‌شده‌ای که دو سیستم از آن داده عوض می‌کنند."}},{"de":"JSON","def":{"de":"Ein Textformat mit Feldern und Werten. Bei REST üblich, aber nicht vorgeschrieben.","en":"A text format with fields and values. Common with REST, but not required.","fa":"یک قالب متنی با فیلد و مقدار. با REST معمول است، ولی اجباری نیست."}},{"de":"Teilnetz / Subnetz","def":{"de":"Ein großes Netz in kleinere Netze teilen. Bei /24 bleiben 254 nutzbare Hosts, nicht 256.","en":"Splitting a large network into smaller ones. A /24 leaves 254 usable hosts, not 256.","fa":"تقسیم یک شبکه بزرگ به شبکه‌های کوچک‌تر. در /24، ۲۵۴ میزبان قابل استفاده می‌ماند، نه ۲۵۶."}},{"de":"VLAN","def":{"de":"Ein logisches Netz auf einem physischen Switch. Verschiedene VLANs sprechen nicht direkt miteinander.","en":"A logical network on one physical switch. Different VLANs do not talk directly.","fa":"یک شبکه منطقی روی یک سوئیچ فیزیکی. VLANهای مختلف مستقیم حرف نمی‌زنند."}},{"de":"Standardgateway","def":{"de":"Die Routeradresse für Ziele außerhalb des eigenen Netzes. Sie steht in der IP-Anzeige und ist nicht automatisch .1.","en":"The router address for targets outside your own network. It is on the IP screen and is not automatically .1.","fa":"آدرس روتر برای هدف‌های بیرون شبکه خودت. در صفحه IP است و خودکار .1 نیست."}},{"de":"Firewall","def":{"de":"Filtert Verkehr nach Regeln. NAT übersetzt nur Adressen und ist keine Firewall.","en":"Filters traffic by rules. NAT only translates addresses and is not a firewall.","fa":"ترافیک را با قانون فیلتر می‌کند. NAT فقط آدرس را ترجمه می‌کند و فایروال نیست."}},{"de":"OSI-Schicht","def":{"de":"Ein Denkmodell. Schicht 1 ist das Signal, nicht der Switch. Schicht 2 ist MAC, Switch und VLAN.","en":"A thinking model. Layer 1 is the signal, not the switch. Layer 2 is MAC, switch and VLAN.","fa":"یک مدل فکری. لایه ۱ سیگنال است، نه سوئیچ. لایه ۲ یعنی MAC، سوئیچ و VLAN."}},{"de":"DHCP","def":{"de":"Vergibt Adresse, Maske, Gateway und oft DNS. Die Reihenfolge ist Discover, Offer, Request, Acknowledge.","en":"Assigns address, mask, gateway and often DNS. The order is Discover, Offer, Request, Acknowledge.","fa":"آدرس، ماسک، Gateway و اغلب DNS می‌دهد. ترتیب Discover، Offer، Request، Acknowledge است."}},{"de":"DNS","def":{"de":"Übersetzt einen Namen in eine IP-Adresse. Antwortet die IP und der Name nicht, liegt es an der Übersetzung.","en":"Translates a name into an IP address. If the IP answers and the name does not, the translation is the fault.","fa":"یک نام را به آدرس IP ترجمه می‌کند. اگر IP جواب بدهد و نام نه، اشکال از ترجمه است."}},{"de":"NAT","def":{"de":"Übersetzt private Adressen in eine öffentliche. Es filtert nicht und ersetzt keine Firewall.","en":"Translates private addresses into a public one. It does not filter and does not replace a firewall.","fa":"آدرس خصوصی را به یک آدرس عمومی ترجمه می‌کند. فیلتر نمی‌کند و جای فایروال را نمی‌گیرد."}},{"de":"Access-Port","def":{"de":"Ein Switch-Port mit genau einem VLAN, für einen PC, ohne VLAN-Tag.","en":"A switch port with exactly one VLAN, for a PC, without a VLAN tag.","fa":"یک پورت سوئیچ با دقیقاً یک VLAN، برای رایانه، بدون برچسب VLAN."}},{"de":"Trunk","def":{"de":"Ein Switch-Port mit mehreren VLANs und Tags, typisch zwischen Switch und Router.","en":"A switch port with several VLANs and tags, typically between switch and router.","fa":"یک پورت سوئیچ با چند VLAN و برچسب، معمولاً بین سوئیچ و روتر."}},{"de":"Berichtsheft","def":{"de":"Nachweis, was in Betrieb und Schule gelernt wurde. Regelmäßig schreiben, nicht am Ende erfinden.","en":"A record of what was learned in the company and at school. Write it regularly. Do not invent it at the end.","fa":"ثبت آنچه در شرکت و مدرسه یاد گرفته شد. مرتب بنویس، در پایان نساز."}},{"de":"OSI-Modell","def":{"de":"Das OSI-Modell ist ein Denkmodell mit Schichten. Es sagt, wo du bei einer Störung suchst, nicht welches Kabel du kaufen sollst.","en":"The OSI model is a layered way of thinking. It tells you where to look for a fault, not which cable to buy.","fa":"مدل OSI یک مدل فکری با لایه‌هاست. می‌گوید خرابی را کجا بگردی، نه اینکه کدام کابل را بخری."}},{"de":"IP, Maske und Gateway","def":{"de":"Die IPv4-Adresse nennt den Rechner. Die Subnetzmaske sagt, welcher Teil das Netz ist. Das Gateway ist die Tür aus diesem Netz, meist der Router.","en":"The IPv4 address names the computer. The subnet mask says which part is the network. The gateway is the door out of that network, usually the router.","fa":"آدرس IPv4 رایانه را مشخص می‌کند. ماسک زیرشبکه می‌گوید کدام بخش، شبکه است. گیت‌وی درِ خروج از همین شبکه است و معمولاً روتر است."}},{"de":"Subnetting","def":{"de":"Subnetting schneidet ein großes Netz in kleinere Blöcke. Die Präfixlänge sagt, wie viele Bits zum Netz gehören.","en":"Subnetting cuts a large network into smaller blocks. The prefix length says how many bits belong to the network.","fa":"زیرشبکه‌سازی یک شبکه بزرگ را به بلوک‌های کوچک‌تر می‌بُرد. طول پیشوند می‌گوید چند بیت مال شبکه است."}},{"de":"Routing","def":{"de":"Routing ist die Entscheidung, in welches Netz ein Paket als Nächstes geschickt wird.","en":"Routing is the decision about which network a packet is sent to next.","fa":"مسیریابی تصمیم این است که بسته بعد به کدام شبکه فرستاده شود."}},{"de":"IPv6","def":{"de":"IPv6 ist die neuere Adresse mit 128 Bit. IPv4 hat nur 32 Bit, der Vorrat ist knapp.","en":"IPv6 is the newer address with 128 bits. IPv4 has only 32 bits, and the supply is tight.","fa":"IPv6 آدرس جدیدتر با ۱۲۸ بیت است. IPv4 فقط ۳۲ بیت دارد و موجودی آن کم است."}},{"de":"Topologie","def":{"de":"Die Topologie beschreibt, wer mit wem verbunden ist.","en":"The topology describes who is connected to whom.","fa":"توپولوژی می‌گوید چه کسی به چه کسی وصل است."}},{"de":"Fehlersuche","def":{"de":"Eine Netzstörung prüfst du in fester Reihenfolge, nicht bei der Firewall, wenn das Kabel lose ist.","en":"You check a network fault in a fixed order, not at the firewall when the cable is loose.","fa":"خرابی شبکه را با ترتیب ثابت بررسی می‌کنی، نه از فایروال، وقتی کابل شل است."}},{"de":"Sicherheit im kleinen Netz","def":{"de":"Sicherheit heißt hier Begrenzung: nur nötige Ports, nur nötige Rechte, getrennte Gäste, aktuelle Systeme und eine Kopie der Daten.","en":"Security here means limits: only needed ports, only needed rights, separated guests, current systems and a copy of the data.","fa":"امنیت اینجا یعنی محدودیت: فقط پورت‌های لازم، فقط حق‌های لازم، مهمان جدا، سیستم به‌روز، و یک نسخه از داده‌ها."}},{"de":"IoT und CPS","def":{"de":"IoT bedeutet: Dinge senden Daten über ein Netz. Ein cyber-physisches System koppelt Software und Physik in einem Kreis aus Messen, Entscheiden und Handeln.","en":"IoT means things send data over a network. A cyber-physical system couples software and physics in a loop of measure, decide and act.","fa":"اینترنت اشیا یعنی چیزها داده را از شبکه می‌فرستند. یک سیستم سایبر-فیزیکی نرم‌افزار و فیزیک را در حلقه سنجش، تصمیم و عمل به هم وصل می‌کند."}},{"de":"Sensor und Aktor","def":{"de":"Ein Sensor wandelt eine physikalische Größe in ein Signal für die Software. Ein Aktor wandelt ein Signal in eine physikalische Wirkung.","en":"A sensor turns a physical quantity into a signal for the software. An actuator turns a signal into a physical effect.","fa":"سنسور یک مقدار فیزیکی را به سیگنال برای نرم‌افزار تبدیل می‌کند. عملگر یک سیگنال را به اثر فیزیکی تبدیل می‌کند."}},{"de":"ESP32","def":{"de":"Der ESP32 ist ein Mikrocontroller mit WLAN. Im Arduino-Rahmen läuft setup einmal und loop immer wieder. Die Logik verträgt 3,3 Volt, nicht bedenkenlos 5 Volt.","en":"The ESP32 is a microcontroller with Wi-Fi. In the Arduino frame, setup runs once and loop runs forever. The logic accepts 3.3 volts, not carelessly 5 volts.","fa":"ESP32 یک میکروکنترلر با وای‌فای است. در چارچوب آردوینو، setup یک بار اجرا می‌شود و loop همیشه. منطق ۳٫۳ ولت را تحمل می‌کند، نه بی‌احتیاط ۵ ولت را."}},{"de":"Pull-up und Pull-down","def":{"de":"Ein unbeschalteter Eingang schwebt. Er liest zufällig HIGH oder LOW. Ein Widerstand zieht ihn auf einen festen Pegel, solange der Taster offen ist.","en":"An unconnected input floats. It reads HIGH or LOW at random. A resistor pulls it to a fixed level while the button is open.","fa":"یک ورودی بی‌اتصال شناور است. تصادفی HIGH یا LOW می‌خواند. یک مقاومت تا وقتی کلید باز است آن را به یک سطح ثابت می‌کشد."}},{"de":"Prellen","def":{"de":"Metallkontakte federn. Ein Tastendruck ist elektrisch mehrere schnelle Wechsel. Der Controller zählt sonst jeden Wechsel als eigenen Druck.","en":"Metal contacts bounce. Electrically, one press is several fast changes. Otherwise the controller counts each change as its own press.","fa":"کنتاکت فلزی می‌پرد. از نظر الکتریکی یک فشار چند تغییر سریع است. وگرنه کنترلر هر تغییر را یک فشار جدا می‌شمارد."}},{"de":"Baudrate","def":{"de":"Die Baudrate ist die Schrittgeschwindigkeit der seriellen Leitung. Sender und Empfänger müssen dieselbe Zahl verwenden.","en":"The baud rate is the step speed of the serial line. Sender and receiver must use the same number.","fa":"نرخ باد سرعت گام خط سریال است. فرستنده و گیرنده باید همان عدد را به کار ببرند."}},{"de":"WLAN am ESP32","def":{"de":"Der ESP32 tritt einem Funknetz mit SSID und Passwort bei. Erfolg siehst du an einer IP-Adresse im Serial Monitor, nicht nur an einer Lampe.","en":"The ESP32 joins a wireless network with an SSID and a password. You see success as an IP address in the serial monitor, not only as a lamp.","fa":"ESP32 با SSID و گذرواژه به یک شبکه بی‌سیم می‌پیوندد. موفقیت را با یک آدرس IP در نمایشگر سریال می‌بینی، نه فقط با یک چراغ."}},{"de":"MQTT","def":{"de":"MQTT ist ein leichtes Nachrichtenprotokoll für Geräte. Ein Broker nimmt Nachrichten an und gibt sie an Abonnenten weiter.","en":"MQTT is a lightweight messaging protocol for devices. A broker accepts messages and forwards them to subscribers.","fa":"MQTT یک پروتکل پیام سبک برای دستگاه‌هاست. یک کارگزار پیام را می‌گیرد و به مشترک‌ها می‌دهد."}},{"de":"Datenarten","def":{"de":"Strukturierte Daten haben feste Felder. Unstrukturierte Daten haben kein festes Schema. Bestandsdaten ändern sich selten, Bewegungsdaten entstehen durch einen Vorgang.","en":"Structured data has fixed fields. Unstructured data has no fixed schema. Master data changes rarely, transaction data is created by an event.","fa":"داده ساخت‌یافته فیلد ثابت دارد. داده بدون ساختار طرح ثابت ندارد. داده پایه کم عوض می‌شود، داده حرکتی با یک رویداد ساخته می‌شود."}},{"de":"Datenmodell","def":{"de":"Ein Datenmodell ist die Absprache, welche Dinge es gibt und wie sie zusammenhängen, bevor jemand eine Tabelle anlegt.","en":"A data model is the agreement about which things exist and how they relate, before anyone creates a table.","fa":"مدل داده توافق است که چه چیزهایی وجود دارند و چطور به هم مربوط‌اند، پیش از آنکه کسی جدول بسازد."}},{"de":"ER-Modell","def":{"de":"Im ER-Modell ist eine Entität ein Ding, das du speichern willst. Ein Attribut ist eine Eigenschaft. Eine Beziehung verbindet Entitäten. Der Primärschlüssel macht jede Zeile eindeutig.","en":"In the ER model an entity is a thing you want to store. An attribute is a property. A relationship connects entities. The primary key makes each row unique.","fa":"در مدل ER موجودیت چیزی است که می‌خواهی ذخیره کنی. ویژگی یک خصوصیت است. رابطه موجودیت‌ها را وصل می‌کند. کلید اصلی هر سطر را یکتا می‌کند."}},{"de":"Relationales Modell","def":{"de":"Das relationale Modell speichert Entitäten als Tabellen. Eine Beziehung eins-zu-viele wird zum Fremdschlüssel auf der Seite mit den vielen Zeilen.","en":"The relational model stores entities as tables. A one-to-many relationship becomes a foreign key on the side with many rows.","fa":"مدل رابطه‌ای موجودیت‌ها را جدول ذخیره می‌کند. رابطه یک‌به‌چند کلید خارجی می‌شود، در سمتی که سطرهای زیاد دارد."}},{"de":"JSON und API","def":{"de":"Eine API ist eine vereinbarte Tür zwischen zwei Systemen. JSON ist das heute übliche Textformat, in dem diese Tür Daten trägt.","en":"An API is an agreed door between two systems. JSON is the usual text format today in which this door carries data.","fa":"API یک درِ توافق‌شده بین دو سیستم است. JSON قالب متنی رایج امروز است که این در داده را با آن حمل می‌کند."}},{"de":"IT-Servicemanagement","def":{"de":"IT-Servicemanagement organisiert, wie eine IT-Abteilung Aufträge und Störungen annimmt, bearbeitet und abschließt.","en":"IT service management organises how an IT department accepts, handles and closes orders and faults.","fa":"مدیریت خدمات IT سامان می‌دهد که بخش IT سفارش و خرابی را چطور می‌پذیرد، انجام می‌دهد و می‌بندد."}},{"de":"Aufbau und Ablauf","def":{"de":"Der Aufbau sagt, wer welche Stelle hat. Der Ablauf sagt, in welcher Reihenfolge die Arbeit läuft.","en":"The structure says who holds which post. The process says in which order the work runs.","fa":"ساختار می‌گوید چه کسی کدام پست را دارد. جریان می‌گوید کار با چه ترتیبی پیش می‌رود."}},{"de":"eEPK","def":{"de":"Eine ereignisgesteuerte Prozesskette zeigt einen Ablauf als Wechsel von Ereignis und Funktion.","en":"An event-driven process chain shows a process as an alternation of event and function.","fa":"یک زنجیره فرایند رویدادمحور جریان را به صورت جابه‌جایی رویداد و کارکرد نشان می‌دهد."}},{"de":"Incident und Problem","def":{"de":"Ein Incident ist eine aktuelle Störung eines Dienstes. Ein Problem ist die Ursache, die solche Störungen wiederkehren lässt.","en":"An incident is a current disruption of a service. A problem is the cause that makes such disruptions return.","fa":"Incident اختلال فعلی یک خدمت است. Problem علتی است که این اختلال‌ها را برمی‌گرداند."}},{"de":"Support-Stufen","def":{"de":"Support-Stufen teilen die Bearbeitung nach Schwierigkeit. Was vorne lösbar ist, bleibt vorne.","en":"Support levels split the work by difficulty. What can be solved at the front stays at the front.","fa":"سطح‌های پشتیبانی کار را بر اساس سختی تقسیم می‌کنند. آنچه جلو حل می‌شود همان‌جا می‌ماند."}},{"de":"Szenario","def":{"de":"Das Szenario ist der Auftrag: welche Abteilungen es gibt, welche Netze sie brauchen und woran du Erfolg erkennst.","en":"The scenario is the brief: which departments exist, which networks they need, and how you know it works.","fa":"سناریو سفارش است: کدام بخش‌ها هستند، به کدام شبکه‌ها نیاز دارند و از کجا می‌فهمی کار کرده است."}},{"de":"Switch und VLAN","def":{"de":"Ein Switch leitet einen Rahmen an den Port der Ziel-MAC-Adresse. Ein Access-Port trägt genau ein VLAN, ein Trunk-Port trägt mehrere VLANs mit Markierung.","en":"A switch forwards a frame to the port of the destination MAC address. An access port carries exactly one VLAN, a trunk port carries several VLANs with a tag.","fa":"سوئیچ قاب را به درگاه نشانی MAC مقصد می‌فرستد. درگاه Access دقیقاً یک VLAN دارد، درگاه Trunk چند VLAN را با برچسب می‌برد."}},{"de":"Router und Gateway","def":{"de":"Ein Router verbindet IP-Netze. Das Standard-Gateway ist die Router-Adresse im eigenen Netz des PCs.","en":"A router connects IP networks. The default gateway is the router address in the PC’s own network.","fa":"مسیریاب شبکه‌های IP را به هم وصل می‌کند. دروازه پیش‌فرض نشانی مسیریاب در شبکه خود رایانه است."}},{"de":"DHCP je VLAN","def":{"de":"DHCP vergibt Adresse, Maske, Gateway und DNS. Adressen für Router, Switch und Server schließt du aus, damit sie nicht doppelt vergeben werden.","en":"DHCP assigns address, mask, gateway and DNS. You exclude addresses for the router, switch and servers so they are not handed out twice.","fa":"DHCP نشانی، نقاب، دروازه و DNS می‌دهد. نشانی مسیریاب، سوئیچ و سرورها را مستثنی می‌کنی تا دوباره واگذار نشوند."}},{"de":"Prüfung in drei Schritten","def":{"de":"Du prüfst von nah nach fern: eigenes Gateway, Gateway des anderen Netzes, danach ein Host im anderen Netz.","en":"You test from near to far: your own gateway, the other network’s gateway, then a host in the other network.","fa":"از نزدیک به دور می‌آزمایی: دروازه خودت، دروازه شبکه دیگر، بعد یک میزبان در شبکه دیگر."}},{"de":"Artikel 20 Grundgesetz","def":{"de":"Artikel 20 sagt: Die Bundesrepublik ist ein demokratischer und sozialer Bundesstaat. Alle Staatsgewalt geht vom Volk aus.","en":"Article 20 says: the Federal Republic is a democratic and social federal state. All state authority comes from the people.","fa":"اصل ۲۰ می‌گوید: جمهوری فدرال دولتی دموکراتیک، اجتماعی و فدرال است. همه قدرت دولت از مردم می‌آید."}},{"de":"Demokratie","def":{"de":"Demokratie heißt, dass Herrschaft vom Volk ausgeht und an Regeln gebunden bleibt, auch für die Mehrheit.","en":"Democracy means that authority comes from the people and stays bound by rules, including for the majority.","fa":"دموکراسی یعنی قدرت از مردم می‌آید و به قاعده مقید می‌ماند، حتی برای اکثریت."}},{"de":"Direkt und repräsentativ","def":{"de":"Direkt heißt: die Bürger entscheiden selbst über eine Sache. Repräsentativ heißt: sie wählen Personen, die für sie entscheiden.","en":"Direct means the citizens decide a matter themselves. Representative means they elect people who decide for them.","fa":"مستقیم یعنی شهروندان خودشان درباره یک موضوع تصمیم می‌گیرند. نمایندگی یعنی کسانی را انتخاب می‌کنند که برایشان تصمیم بگیرند."}},{"de":"Gewaltenteilung","def":{"de":"Gesetzgebung, ausführende Gewalt und Rechtsprechung sind getrennt, damit niemand alles allein entscheiden kann.","en":"Legislation, executive power and the courts are separated so that nobody can decide everything alone.","fa":"قانون‌گذاری، قوه مجریه و قضاوت جدا هستند تا هیچ‌کس نتواند همه‌چیز را تنها تصمیم بگیرد."}},{"de":"Ausbildungsnachweis","def":{"de":"Der Ausbildungsnachweis, oft Berichtsheft genannt, hält fest, welche Tätigkeiten du in der Ausbildung wirklich gemacht hast.","en":"The training record, often called a report book, states which tasks you actually did in training.","fa":"گزارش آموزش، که اغلب دفتر گزارش نامیده می‌شود، ثبت می‌کند کدام کارها را واقعاً در آموزش انجام داده‌ای."}},{"de":"Wie die Note entsteht","def":{"de":"Die Englischnote setzt sich aus drei gleich großen Teilen zusammen. Das freiwillige KMK-Zertifikat auf B1 oder B2 ersetzt diese Teile nicht.","en":"The English grade is made of three equal parts. The voluntary KMK certificate at B1 or B2 does not replace those parts.","fa":"نمره انگلیسی از سه بخش برابر ساخته می‌شود. گواهی داوطلبانه KMK در سطح B1 یا B2 جای این بخش‌ها را نمی‌گیرد."}},{"de":"Maschinencode, Assembler, Hochsprache","def":{"de":"Maschinencode führt der Prozessor direkt aus. Assembler ist eine kurze, lesbare Schreibweise dafür. Eine Hochsprache beschreibt die Aufgabe näher an der menschlichen Sprache.","en":"The processor runs machine code directly. Assembly is a short, readable way to write it. A high-level language describes the task closer to human language.","fa":"پردازنده کد ماشین را مستقیم اجرا می‌کند. اسمبلی یک نوشتن کوتاه و خوانا برای همان است. زبان سطح بالا کار را نزدیک‌تر به زبان انسان توصیف می‌کند."}},{"de":"Assemble, compile, executable","def":{"de":"To assemble macht aus Assembler-Text Maschinencode. To compile übersetzt eine Hochsprache. Executable ist die Datei, die gestartet werden kann. Ein mnemonic ist nur eine Merkhilfe.","en":"To assemble turns assembly text into machine code. To compile translates a high-level language. An executable is the file that can be started. A mnemonic is only a memory aid.","fa":"To assemble متن اسمبلی را به کد ماشین تبدیل می‌کند. To compile یک زبان سطح بالا را ترجمه می‌کند. Executable فایلی است که می‌توان اجرا کرد. mnemonic فقط یک کمک حافظه است."}},{"de":"Hören, Lesen, IT-Nachrichten","def":{"de":"Geübt werden Hörverstehen, Leseverstehen und kurze Nachrichten aus der IT. Im Material stand als Termin Donnerstag, der 8. Oktober 2026.","en":"You practise listening, reading and short IT news. The material named Thursday 8 October 2026 as a date.","fa":"شنیدن، خواندن و خبر کوتاه IT تمرین می‌شود. در مواد، پنجشنبه ۸ اکتبر ۲۰۲۶ به‌عنوان یک تاریخ آمده بود."}},{"de":"Geräte und Server","def":{"de":"Ein Switch verbindet Geräte im lokalen Netz. Ein Access Point hängt WLAN-Geräte an dieses Netz. Ein Router verbindet verschiedene IP-Netze.","en":"A switch connects devices in the local network. An access point attaches WLAN devices to that network. A router connects different IP networks.","fa":"سوئیچ دستگاه‌ها را در شبکه محلی وصل می‌کند. نقطه دسترسی دستگاه‌های WLAN را به همان شبکه می‌آورد. مسیریاب شبکه‌های IP متفاوت را وصل می‌کند."}},{"de":"Reichweite der Netze","def":{"de":"Der Name eines Netzes sagt, welchen Raum es überspannt: Körper, Person, Raum, Gelände, Stadt, weit oder weltweit.","en":"The name of a network says which space it covers: a body, a person, a room, a campus, a city, a long distance or the world.","fa":"نام شبکه می‌گوید کدام فضا را می‌پوشاند: بدن، شخص، اتاق، محوطه، شهر، فاصله دور یا جهان."}},{"de":"OSI als Landkarte","def":{"de":"Das OSI-Modell teilt die Kommunikation in sieben Schichten, damit jede Schicht nur ihre eigene Aufgabe hat.","en":"The OSI model splits communication into seven layers so that each layer has only its own job.","fa":"مدل OSI ارتباط را به هفت لایه تقسیم می‌کند تا هر لایه فقط کار خودش را داشته باشد."}},{"de":"Repeater, Hub, Bridge, Switch","def":{"de":"Ein Repeater frischt das Signal auf. Ein Hub ist ein Repeater mit mehreren Ports. Eine Bridge trennt anhand der MAC-Adresse. Ein Switch ist eine Bridge mit vielen Ports.","en":"A repeater refreshes the signal. A hub is a repeater with several ports. A bridge separates traffic by MAC address. A switch is a bridge with many ports.","fa":"تکرارگر سیگنال را تازه می‌کند. هاب تکرارگری با چند درگاه است. پل ترافیک را با نشانی MAC جدا می‌کند. سوئیچ پلی با درگاه‌های زیاد است."}},{"de":"Kupfer, Glas und Struktur","def":{"de":"Kupferkabel tragen elektrische Signale auf der Etage. Glasfasern tragen Licht über längere Strecken. Die Verkabelung eines Geländes ist in drei Ebenen gegliedert.","en":"Copper cable carries electrical signals on the floor. Fibre carries light over longer distances. The cabling of a site is split into three levels.","fa":"کابل مس سیگنال الکتریکی را در طبقه می‌برد. فیبر نور را در فاصله بلندتر می‌برد. کابل‌کشی یک محوطه به سه سطح تقسیم می‌شود."}},{"de":"Vom Relais zum Mikroprozessor","def":{"de":"Rechner wurden kleiner und dichter: von elektromechanischen Teilen über Röhren und Transistoren zu integrierten Schaltungen und zum Mikroprozessor.","en":"Computers became smaller and denser: from electromechanical parts through tubes and transistors to integrated circuits and the microprocessor.","fa":"رایانه کوچک‌تر و فشرده‌تر شد: از قطعه الکترومکانیکی، از لامپ و ترانزیستور تا مدار مجتمع و ریزپردازنده."}},{"de":"EVA und Bauformen","def":{"de":"Ein Rechner nimmt Daten auf, verarbeitet sie und gibt ein Ergebnis aus. Der Speicher hält Daten zwischen diesen Schritten. Die Bauform ist nur das Gehäuse.","en":"A computer takes data in, processes it and puts a result out. Storage holds data between these steps. The form factor is only the case.","fa":"رایانه داده را می‌گیرد، پردازش می‌کند و نتیجه را بیرون می‌دهد. حافظه داده را بین این گام‌ها نگه می‌دارد. شکل فقط جعبه است."}},{"de":"Mainboard","def":{"de":"Das Mainboard verbindet Prozessor, Speicher, Steckplätze, Strom und Anschlüsse. Es rechnet nicht selbst.","en":"The motherboard connects the processor, memory, slots, power and ports. It does not compute by itself.","fa":"برد اصلی پردازنده، حافظه، شکاف، برق و درگاه را وصل می‌کند. خودش حساب نمی‌کند."}},{"de":"Chipsatz","def":{"de":"Der Chipsatz steuert, wie der Prozessor mit Speicher, Karten und Anschlüssen spricht.","en":"The chipset controls how the processor talks to memory, cards and ports.","fa":"چیپ‌ست کنترل می‌کند پردازنده چطور با حافظه، کارت و درگاه حرف می‌زند."}},{"de":"PCIe und USB","def":{"de":"PCIe verbindet schnelle Karten punktgenau mit Lanes. USB verbindet Geräte am Rand des Rechners. Die Form der Buchse sagt nicht automatisch die Geschwindigkeit.","en":"PCIe connects fast cards point to point with lanes. USB connects devices at the edge of the computer. The shape of the socket does not automatically tell the speed.","fa":"PCIe کارت سریع را نقطه‌به‌نقطه با خط وصل می‌کند. USB دستگاه را در لبه رایانه وصل می‌کند. شکل سوکت خودکار سرعت را نمی‌گوید."}},{"de":"Warum es Hochsprachen gibt","def":{"de":"Nahe an der Maschine schreibst du, was der Prozessor tut. Eine Hochsprache beschreibt, was das Programm tun soll. Python ist so eine Sprache.","en":"Close to the machine you write what the processor does. A high-level language describes what the program should do. Python is such a language.","fa":"نزدیک ماشین می‌نویسی پردازنده چه می‌کند. زبان سطح بالا توصیف می‌کند برنامه چه باید بکند. پایتون چنین زبانی است."}},{"de":"Übersetzen und Ausführen","def":{"de":"Ein Compiler übersetzt das ganze Programm vor dem Lauf. Ein Interpreter führt es anweisung für Anweisung aus.","en":"A compiler translates the whole program before it runs. An interpreter runs it instruction by instruction.","fa":"کامپایلر همه برنامه را پیش از اجرا ترجمه می‌کند. مفسر آن را دستور به دستور اجرا می‌کند."}},{"de":"Name, Typ, Wert","def":{"de":"Eine Variable hat einen Namen, einen Typ und einen Wert. Der Name ist die Beschriftung, der Wert ist der Inhalt.","en":"A variable has a name, a type and a value. The name is the label, the value is the content.","fa":"یک متغیر نام، نوع و مقدار دارد. نام برچسب است، مقدار محتوا است."}},{"de":"int, float, str, bool","def":{"de":"int ist eine ganze Zahl, float eine Kommazahl, str ein Text, bool ein Wahrheitswert wahr oder falsch.","en":"int is a whole number, float a decimal number, str text, bool a truth value true or false.","fa":"int عدد صحیح است، float عدد اعشاری، str متن، bool مقدار درست یا نادرست."}},{"de":"Drei Arten von Fehlern","def":{"de":"Ein Syntaxfehler ist ungültige Schreibweise. Ein Laufzeitfehler bricht während der Ausführung ab. Ein Logikfehler läuft durch und liefert das falsche Ergebnis.","en":"A syntax error is invalid writing. A runtime error stops during execution. A logic error runs through and returns the wrong result.","fa":"خطای نحو نوشتن نامعتبر است. خطای زمان اجرا هنگام اجرا قطع می‌کند. خطای منطق تا آخر می‌رود و نتیجه غلط می‌دهد."}},{"de":"if und elif","def":{"de":"Eine Verzweigung führt einen Block nur aus, wenn eine Bedingung wahr ist. elif prüft die nächste Bedingung, else den Rest.","en":"A branch runs a block only if a condition is true. elif checks the next condition, else the rest.","fa":"یک شاخه یک بلوک را فقط وقتی اجرا می‌کند که شرط درست باشد. elif شرط بعدی را می‌سنجد، else بقیه را."}},{"de":"for und while","def":{"de":"Eine Schleife wiederholt einen Block. for geht eine bekannte Folge durch. while wiederholt, solange eine Bedingung wahr ist.","en":"A loop repeats a block. for walks through a known sequence. while repeats as long as a condition is true.","fa":"حلقه یک بلوک را تکرار می‌کند. for یک دنباله معلوم را می‌پیماید. while تا وقتی شرط درست است تکرار می‌کند."}},{"de":"Listen","def":{"de":"Eine Liste speichert mehrere Werte in einer festen Reihenfolge. Der erste Index ist 0. Du kannst Werte anhängen oder ersetzen.","en":"A list stores several values in a fixed order. The first index is 0. You can append or replace values.","fa":"یک فهرست چند مقدار را به ترتیب ثابت ذخیره می‌کند. اولین نمایه ۰ است. می‌توانی مقدار اضافه یا عوض کنی."}},{"de":"Erweiterter Wirtschaftskreislauf","def":{"de":"Der erweiterte Kreislauf zeigt, wie Haushalte, Unternehmen, Staat, Banken und das Ausland Leistungen und Geld tauschen.","en":"The extended cycle shows how households, firms, the state, banks and foreign countries exchange goods and money.","fa":"چرخه گسترده نشان می‌دهد خانوار، بنگاه، دولت، بانک و خارج چطور کالا و پول را عوض می‌کنند."}},{"de":"Marktformen","def":{"de":"Die Marktform beschreibt, wie viele Anbieter einer gleichen Leistung gegenüberstehen.","en":"The market form describes how many suppliers face each other for the same service.","fa":"شکل بازار توصیف می‌کند چند عرضه‌کننده برای یک خدمت یکسان روبه‌رو هستند."}},{"de":"Eine Firma gründen","def":{"de":"Eine Gründung ist die geordnete Folge von Idee, Rechtsform, Plan, Anmeldung und Start. Die Skriptseiten dazu waren Scans und sind hier nicht abgetippt.","en":"A founding is the ordered sequence of idea, legal form, plan, registration and start. The script pages for this were scans and are not typed out here.","fa":"تأسیس ترتیب منظم ایده، شکل حقوقی، طرح، ثبت و شروع است. صفحه‌های جزوه اسکن بودند و اینجا رونویسی نشده‌اند."}},{"de":"Rechtsformen","def":{"de":"Die Rechtsform legt fest, wer haftet, wer entscheidet und wie die Firma angemeldet wird.","en":"The legal form sets who is liable, who decides and how the firm is registered.","fa":"شکل حقوقی تعیین می‌کند چه کسی مسئول است، چه کسی تصمیم می‌گیرد و شرکت چطور ثبت می‌شود."}},{"de":"Prokura und Handlungsvollmacht","def":{"de":"Beide ermächtigen, für ein Handelsgeschäft zu handeln. Die Prokura ist weit und wird ins Handelsregister eingetragen. Die Handlungsvollmacht ist enger und wird nicht eingetragen.","en":"Both authorise someone to act for a commercial business. Prokura is broad and is entered in the commercial register. Commercial authority is narrower and is not entered.","fa":"هر دو اجازه می‌دهند کسی برای یک کسب تجاری عمل کند. پروکورا گسترده است و در ثبت تجاری نوشته می‌شود. اختیار تجاری باریک‌تر است و ثبت نمی‌شود."}},{"de":"Wörter der Ausbildung","def":{"de":"Diese Wörter beschreiben das duale System auf Englisch: Betrieb, Schule, Vertrag und die Personen.","en":"These words describe the dual system in English: company, school, contract and the people.","fa":"این واژه‌ها نظام دوگانه را به انگلیسی توصیف می‌کنند: شرکت، مدرسه، قرارداد و اشخاص."}},{"de":"Abteilungen","def":{"de":"Englische Abteilungsnamen sagen, wohin eine Mail oder ein Anruf gehört.","en":"English department names say where a mail or a call belongs.","fa":"نام انگلیسی بخش‌ها می‌گوید ایمیل یا تماس کجا می‌رود."}},{"de":"Modalverben","def":{"de":"Ein Modalverb sagt, ob etwas möglich, erlaubt, nötig oder ein Rat ist. Es steht vor dem Verb in der Grundform.","en":"A modal verb says whether something is possible, allowed, necessary or advice. It stands before the verb in the base form.","fa":"فعل وجهی می‌گوید چیزی ممکن، مجاز، لازم یا توصیه است. پیش از فعل در شکل پایه می‌آید."}},{"de":"E-Mails","def":{"de":"Eine förmliche Mail nennt Anrede, Anliegen und Gruß. Eine lockere Mail ist kürzer und nur für Menschen, die du duzt.","en":"A formal mail has a greeting, a request and a close. A casual mail is shorter and only for people you know well.","fa":"ایمیل رسمی خطاب، درخواست و پایان دارد. ایمیل خودمانی کوتاه‌تر است و فقط برای کسی که خوب می‌شناسی."}},{"de":"Buchstabieren","def":{"de":"Das NATO-Alphabet macht Buchstaben am Telefon eindeutig. Jeder Buchstabe hat ein festes Wort.","en":"The NATO alphabet makes letters clear on the phone. Each letter has a fixed word.","fa":"الفبای ناتو حرف را در تلفن روشن می‌کند. هر حرف یک واژه ثابت دارد."}},{"de":"Telefonieren","def":{"de":"Am Telefon nennst du Firma und Namen, leitest weiter oder nimmst eine Nachricht auf und verschiebst Termine klar.","en":"On the phone you give the company and your name, put someone through or take a message, and move appointments clearly.","fa":"در تلفن شرکت و نام را می‌گویی، وصل می‌کنی یا پیام می‌گیری و قرار را روشن جابه‌جا می‌کنی."}},{"de":"Was ein Projekt ist","def":{"de":"Ein Projekt ist einmalig, hat ein klares Ergebnis, Meilensteine, begrenzte Mittel und ist von der laufenden Arbeit getrennt.","en":"A project is unique, has a clear result, milestones, limited means and is separate from ongoing work.","fa":"پروژه یکتا است، نتیجه روشن، نقطه عطف، وسیله محدود دارد و از کار جاری جدا است."}},{"de":"Gelingen und Scheitern","def":{"de":"Projekte scheitern an schweigsamer Abstimmung, offenen Kosten und Zeiten, fehlender Dokumentation, am Kunden vorbei und an der falschen Besetzung.","en":"Projects fail through silent coordination, open costs and times, missing documentation, missing the customer and the wrong staffing.","fa":"پروژه با هماهنگی ساکت، هزینه و زمان باز، سند نبودن، رد شدن از مشتری و نفر اشتباه شکست می‌خورد."}},{"de":"Phasen","def":{"de":"Das Projekt läuft in Vorbereitung, Planung und Steuerung. Zur Steuerung gehören Kontrolle und Dokumentation.","en":"The project runs through preparation, planning and control. Control includes checking and documentation.","fa":"پروژه از آماده‌سازی، برنامه‌ریزی و هدایت می‌گذرد. هدایت شامل کنترل و سند است."}},{"de":"Warum ausgebildet wird","def":{"de":"Ausbildung sichert dem Betrieb Fachkräfte und der lernenden Person einen anerkannten Beruf. Arbeit ist dabei mehr als Beschäftigung.","en":"Training secures skilled people for the firm and a recognised occupation for the learner. Work is more than being busy.","fa":"آموزش برای بنگاه نیروی متخصص و برای شخص در حال یادگیری یک شغل شناخته‌شده تأمین می‌کند. کار بیش از مشغول بودن است."}},{"de":"Ausbildungsvertrag","def":{"de":"Der Ausbildungsvertrag ist schriftlich und nennt die Bedingungen der Ausbildung, bevor sie beginnt.","en":"The training contract is in writing and states the conditions of the training before it begins.","fa":"قرارداد آموزش نوشتاری است و شرایط آموزش را پیش از شروع نام می‌برد."}},{"de":"Duales System","def":{"de":"Die Ausbildung läuft an zwei Orten: im Betrieb und in der Berufsschule. Beide sind Pflicht, keiner ersetzt den anderen.","en":"Training runs in two places: in the firm and at vocational school. Both are compulsory, neither replaces the other.","fa":"آموزش در دو جا می‌رود: در بنگاه و در هنرستان شغلی. هر دو واجب‌اند، هیچ‌کدام جای دیگری نیست."}},{"de":"Jugendarbeitsschutz","def":{"de":"Das Jugendarbeitsschutzgesetz begrenzt Zeit und Belastung von Beschäftigten unter 18 Jahren. Ausnahmen stehen im Gesetz, nicht in einem Merksatz.","en":"The Youth Employment Protection Act limits the time and strain of employees under 18. Exceptions are in the statute, not in a memory sentence.","fa":"قانون حمایت از کار جوانان زمان و فشار کارکنان زیر ۱۸ سال را محدود می‌کند. استثنا در قانون است، نه در یک جمله حفظی."}}];

    const ui = {
      fa: { prev: '← قبلی', next: 'بعدی →', shuffle: 'بُر زدن', hint: 'کلیک برای دیدن توضیح' },
      de: { prev: '← Zurück', next: 'Weiter →', shuffle: 'Mischen', hint: 'Klicken zum Umdrehen' },
      en: { prev: '← Previous', next: 'Next →', shuffle: 'Shuffle', hint: 'Click to flip' }
    };

    let current = 0;
    let flipped = false;

    function lang() {
      return localStorage.getItem('fisi-lang') || 'fa';
    }

    function renderCard() {
      const c = cards[current];
      const l = lang();
      const t = ui[l] || ui.fa;

      document.getElementById('cardTerm').textContent = c.de;
      document.getElementById('cardHint').textContent = t.hint;
      const meaning = (c.def && (c.def[l] || c.def.de)) || '';
      document.getElementById('cardMeaning').textContent = meaning;

      document.getElementById('btnPrev').textContent = t.prev;
      document.getElementById('btnNext').textContent = t.next;
      document.getElementById('btnShuffle').textContent = t.shuffle;
      document.getElementById('progress').textContent = (current + 1) + ' / ' + cards.length;

      document.getElementById('flashcard').classList.remove('is-flipped');
      flipped = false;
      const scene = document.getElementById('cardScene');
      if (scene) scene.setAttribute('aria-pressed', 'false');
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('flashcard').classList.toggle('is-flipped', flipped);
      const scene = document.getElementById('cardScene');
      if (scene) scene.setAttribute('aria-pressed', flipped ? 'true' : 'false');
    }

    function cardKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipCard();
        return;
      }
      const rtl = document.documentElement.dir === 'rtl';
      const next = rtl ? 'ArrowLeft' : 'ArrowRight';
      const prev = rtl ? 'ArrowRight' : 'ArrowLeft';
      if (e.key === next) { e.preventDefault(); nextCard(); }
      if (e.key === prev) { e.preventDefault(); prevCard(); }
    }

    function nextCard() {
      current = (current + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      current = (current - 1 + cards.length) % cards.length;
      renderCard();
    }

    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      current = 0;
      renderCard();
    }

    document.addEventListener('DOMContentLoaded', renderCard);

    const _setLang = window.setLang;
    window.setLang = function (l) {
      _setLang(l);
      renderCard();
    };
  </script>
