<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فلش‌کارت | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .fc-wrap { max-width: 420px; margin: 1.5rem auto; }
    .fc-scene {
      perspective: 1200px;
      height: 240px;
      cursor: pointer;
    }
    .fc-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2,.8,.2,1);
    }
    .fc-card.is-flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background: var(--card);
    }
    .fc-front .term {
      font-size: 1.55rem;
      font-weight: 750;
      color: var(--blue);
      letter-spacing: -.02em;
    }
    .fc-front .hint {
      margin-top: .65rem;
      color: var(--muted);
      font-size: .88rem;
    }
    .fc-back {
      transform: rotateY(180deg);
      background: #eef5ff;
    }
    .fc-back .meaning {
      font-size: 1.15rem;
      font-weight: 650;
      color: var(--text);
      line-height: 1.45;
    }
    .fc-back .meaning small {
      display: block;
      margin-top: .45rem;
      color: var(--muted);
      font-weight: 500;
      font-size: .95rem;
    }
    .fc-controls {
      display: flex;
      gap: .55rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }
    .fc-progress {
      text-align: center;
      margin-top: .85rem;
      color: var(--soft);
      font-size: .9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="flashcards.html" class="active" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>

  <div class="container page-head">
    <a class="back" href="index.html" data-i18n="backHome">← بازگشت به خانه</a>
    <h1 data-i18n="flashPageTitle">فلش‌کارت اصطلاحات آلمانی</h1>
    <p class="sub" data-i18n="flashPageSub">روی کارت بزن تا معنی را ببینی</p>
  </div>

  <main class="container">
    <div class="fc-wrap">
      <div class="fc-scene" onclick="flipCard()" role="button" tabindex="0" aria-label="Flip card">
        <div class="fc-card" id="flashcard">
          <div class="fc-face fc-front">
            <div class="term" id="cardTerm">Serviceanfrage</div>
            <div class="hint" id="cardHint">کلیک برای دیدن معنی</div>
          </div>
          <div class="fc-face fc-back">
            <div class="meaning" id="cardMeaning">درخواست خدمات</div>
          </div>
        </div>
      </div>

      <div class="fc-controls">
        <button type="button" class="btn btn-soft" onclick="event.stopPropagation(); prevCard()">← قبلی</button>
        <button type="button" class="btn btn-primary" onclick="event.stopPropagation(); nextCard()">بعدی →</button>
        <button type="button" class="btn btn-soft" onclick="event.stopPropagation(); shuffleCards()" data-i18n="shuffle">بُر زدن</button>
      </div>
      <div class="fc-progress" id="progress">1 / 24</div>
    </div>
  </main>

  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const cards = [
      { de: 'Serviceanfrage', fa: 'درخواست خدمات', en: 'Service request' },
      { de: 'Störungsmeldung', fa: 'گزارش اختلال', en: 'Incident report' },
      { de: 'Eskalation', fa: 'ارجاع به سطح بالاتر', en: 'Escalation' },
      { de: 'Deeskalation', fa: 'آرام‌سازی', en: 'De-escalation' },
      { de: 'First-Level-Support', fa: 'پشتیبانی سطح اول', en: 'First-level support' },
      { de: 'Incident', fa: 'اختلال فعلی سرویس', en: 'Incident' },
      { de: 'Problem', fa: 'علت ریشه‌ای', en: 'Problem (root cause)' },
      { de: 'SLA', fa: 'توافق سطح خدمات', en: 'Service level agreement' },
      { de: 'Cyber-physisches System', fa: 'سیستم سایبر-فیزیکی', en: 'Cyber-physical system' },
      { de: 'Sensor', fa: 'سنسور', en: 'Sensor' },
      { de: 'Aktor', fa: 'عملگر', en: 'Actuator' },
      { de: 'Mikrocontroller', fa: 'میکروکنترلر', en: 'Microcontroller' },
      { de: 'MQTT-Broker', fa: 'واسط پیام MQTT', en: 'MQTT broker' },
      { de: 'Topic', fa: 'موضوع پیام', en: 'Topic' },
      { de: 'QoS', fa: 'کیفیت تحویل پیام', en: 'Quality of Service' },
      { de: 'Datenmodellierung', fa: 'مدل‌سازی داده', en: 'Data modelling' },
      { de: 'Entität', fa: 'موجودیت', en: 'Entity' },
      { de: 'Primärschlüssel', fa: 'کلید اصلی', en: 'Primary key' },
      { de: 'Schnittstelle / API', fa: 'رابط برنامه‌نویسی', en: 'Interface / API' },
      { de: 'JSON', fa: 'فرمت داده سبک', en: 'Lightweight data format' },
      { de: 'Teilnetz / Subnetz', fa: 'زیرشبکه', en: 'Subnet' },
      { de: 'VLAN', fa: 'شبکه مجازی محلی', en: 'Virtual LAN' },
      { de: 'Standardgateway', fa: 'دروازه پیش‌فرض', en: 'Default gateway' },
      { de: 'Firewall', fa: 'فایروال', en: 'Firewall' }
    ];

    let current = 0;
    let flipped = false;

    const hints = {
      fa: 'کلیک برای دیدن معنی',
      de: 'Klicken zum Umdrehen',
      en: 'Click to flip'
    };

    function lang() {
      return localStorage.getItem('fisi-lang') || 'fa';
    }

    function renderCard() {
      const c = cards[current];
      const l = lang();
      document.getElementById('cardTerm').textContent = c.de;
      document.getElementById('cardHint').textContent = hints[l] || hints.fa;

      if (l === 'de') {
        document.getElementById('cardMeaning').innerHTML = c.en + '<small>' + c.fa + '</small>';
      } else if (l === 'en') {
        document.getElementById('cardMeaning').innerHTML = c.en + '<small>' + c.fa + '</small>';
      } else {
        document.getElementById('cardMeaning').innerHTML = c.fa + '<small>' + c.en + '</small>';
      }

      document.getElementById('progress').textContent = (current + 1) + ' / ' + cards.length;
      document.getElementById('flashcard').classList.remove('is-flipped');
      flipped = false;
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('flashcard').classList.toggle('is-flipped', flipped);
    }

    function nextCard() {
      current = (current + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      current = (current - 1 + cards.length) % cards.length;
      renderCard();
    }

    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      current = 0;
      renderCard();
    }

    document.addEventListener('DOMContentLoaded', renderCard);

    const _setLang = window.setLang;
    window.setLang = function (l) {
      _setLang(l);
      renderCard();
    };
  </script>
</body>
</html>
