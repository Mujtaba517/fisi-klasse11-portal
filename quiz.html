<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" class="active" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>

  <div class="container page-head">
    <a class="back" href="index.html" data-i18n="backHome">← بازگشت به خانه</a>
    <h1 data-i18n="quizPageTitle">کوییز آمادگی</h1>
    <p class="sub" data-i18n="quizPageSub">۱۲ سؤال از مضامین صنف ۱۱</p>
  </div>

  <main class="container" id="quizArea"></main>

  <div class="container" style="text-align:center;margin:1.5rem 0 2rem">
    <button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" data-i18n="submitQuiz">ثبت پاسخ‌ها</button>
    <button class="btn btn-soft" id="retryBtn" style="display:none" onclick="location.reload()" data-i18n="retryQuiz">دوباره</button>
  </div>
  <div class="container"><div class="quiz-score" id="scoreBox" style="display:none"></div></div>

  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const questions = [
      { q:{fa:"اولین گام منطقی در پردازش درخواست خدمات؟",de:"Erster sinnvoller Schritt bei einer Serviceanfrage?",en:"First logical step for a service request?"},
        options:{fa:["بستن تیکت","ثبت کامل اطلاعات","ارسال فوری به سازنده","نادیده گرفتن SLA"],de:["Ticket schließen","Vollständige Aufnahme","Sofort an Hersteller","SLA ignorieren"],en:["Close ticket","Full capture of information","Immediate vendor call","Ignore SLA"]},
        correct:1 },
      { q:{fa:"Incident در ITIL بیشتر یعنی؟",de:"Incident in ITIL bedeutet vor allem?",en:"Incident in ITIL mainly means?"},
        options:{fa:["علت ریشه‌ای","اختلال در سرویس که باید سریع برگردد","درخواست لپ‌تاپ جدید","تغییر برنامه‌ریزی‌شده"],de:["Grundursache","Störung des Services, die schnell behoben werden soll","Neuer Laptop-Antrag","Geplanter Change"],en:["Root cause","Service disruption to restore quickly","New laptop request","Planned change"]},
        correct:1 },
      { q:{fa:"MQTT عمدتاً برای چیست؟",de:"MQTT dient vor allem?",en:"MQTT is mainly for?"},
        options:{fa:["ویدیو ۴K","پیام سبک IoT","ویرایش عکس","DNS"],de:["4K-Video","leichte IoT-Botschaften","Bildbearbeitung","DNS"],en:["4K video","lightweight IoT messaging","photo editing","DNS"]},
        correct:1 },
      { q:{fa:"QoS 1 در MQTT یعنی؟",de:"QoS 1 bei MQTT bedeutet?",en:"MQTT QoS 1 means?"},
        options:{fa:["حداکثر یک‌بار","حداقل یک‌بار","هرگز ارسال نشود","فقط UDP"],de:["höchstens einmal","mindestens einmal","nie senden","nur UDP"],en:["at most once","at least once","never send","UDP only"]},
        correct:1 },
      { q:{fa:"ER در مدل‌سازی داده؟",de:"ER in der Datenmodellierung?",en:"ER in data modelling?"},
        options:{fa:["Error Route","Entity-Relationship","Email Relay","Edge Router"],de:["Error Route","Entity-Relationship","Email Relay","Edge Router"],en:["Error Route","Entity-Relationship","Email Relay","Edge Router"]},
        correct:1 },
      { q:{fa:"فرمت رایج API مدرن؟",de:"Gängiges API-Format heute?",en:"Common modern API format?"},
        options:{fa:["فقط Binary","JSON","MP3","EXE"],de:["nur Binary","JSON","MP3","EXE"],en:["binary only","JSON","MP3","EXE"]},
        correct:1 },
      { q:{fa:"DHCP چه می‌کند؟",de:"Was macht DHCP?",en:"What does DHCP do?"},
        options:{fa:["نام را به IP ترجمه می‌کند","IP را خودکار می‌دهد","فایروال است","VLAN می‌سازد"],de:["Name zu IP","vergibt IP automatisch","ist Firewall","erstellt VLANs"],en:["maps name to IP","assigns IP automatically","is a firewall","creates VLANs"]},
        correct:1 },
      { q:{fa:"هدف اصلی VLAN؟",de:"Hauptzweck VLAN?",en:"Main purpose of VLAN?"},
        options:{fa:["جداسازی منطقی شبکه","حذف نیاز به سوئیچ","جایگزین DNS","افزایش ولتاژ"],de:["logische Netztrennung","Switch überflüssig machen","DNS ersetzen","Spannung erhöhen"],en:["logical network separation","remove need for switches","replace DNS","increase voltage"]},
        correct:0 },
      { q:{fa:"در /26 تقریباً چند Host قابل استفاده؟",de:"Nutzbare Hosts in /26?",en:"Usable hosts in /26?"},
        options:{fa:["14","30","62","254"],de:["14","30","62","254"],en:["14","30","62","254"]},
        correct:2 },
      { q:{fa:"Inter-VLAN Routing برای چیست؟",de:"Wozu Inter-VLAN-Routing?",en:"What is inter-VLAN routing for?"},
        options:{fa:["ارتباط بین VLANها","حذف IP","فقط وای‌فای","جایگزین کابل"],de:["Kommunikation zwischen VLANs","IP löschen","nur WLAN","Kabel ersetzen"],en:["communication between VLANs","delete IPs","Wi-Fi only","replace cables"]},
        correct:0 },
      { q:{fa:"Grundgesetz در آلمان چیست؟",de:"Was ist das Grundgesetz?",en:"What is the Grundgesetz?"},
        options:{fa:["قرارداد کاری یک شرکت","قانون اساسی","دستور یک روتر","مجوز نرم‌افزار"],de:["Arbeitsvertrag einer Firma","die Verfassung","Router-Befehl","Softwarelizenz"],en:["one company employment contract","the constitution","a router command","a software license"]},
        correct:1 },
      { q:{fa:"Berichtsheft در Ausbildung چرا مهم است؟",de:"Warum ist das Berichtsheft wichtig?",en:"Why is the training record (Berichtsheft) important?"},
        options:{fa:["فقط تزئینی است","اثبات آموزش و اغلب پیش‌نیاز آزمون","جایگزین دیپلم","مالیات"],de:["nur Deko","Nachweis der Ausbildung und oft Prüfungsvoraussetzung","ersetzt Abschluss","Steuer"],en:["decoration only","proof of training and often exam prerequisite","replaces diploma","taxes"]},
        correct:1 }
    ];

    let answered = {};
    let submitted = false;

    function getLang(){ return localStorage.getItem('fisi-lang') || 'fa'; }

    function renderQuiz(){
      const lang = getLang();
      const area = document.getElementById('quizArea');
      area.innerHTML = '';
      questions.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = 'q'+idx;
        let opts = '';
        item.options[lang].forEach((opt, oIdx) => {
          opts += `<button type="button" class="quiz-option" data-q="${idx}" data-o="${oIdx}" onclick="selectOption(${idx},${oIdx})">${opt}</button>`;
        });
        card.innerHTML = `<div class="quiz-question">${idx+1}. ${item.q[lang]}</div><div class="quiz-options">${opts}</div>`;
        area.appendChild(card);

        if (answered[idx] !== undefined) {
          const options = card.querySelectorAll('.quiz-option');
          const oIdx = answered[idx];
          if (options[oIdx]) {
            options[oIdx].style.borderColor = 'var(--blue)';
            options[oIdx].style.background = 'var(--blue-soft)';
            options[oIdx].style.color = 'var(--text)';
          }
        }
      });
    }

    function selectOption(qIdx, oIdx){
      if (submitted) return;
      answered[qIdx] = oIdx;
      const options = document.querySelectorAll('#q'+qIdx+' .quiz-option');
      options.forEach(o => {
        o.style.borderColor = 'transparent';
        o.style.background = '';
        o.style.color = '';
      });
      options[oIdx].style.borderColor = 'var(--blue)';
      options[oIdx].style.background = 'var(--blue-soft)';
      options[oIdx].style.color = 'var(--text)';
    }

    function submitQuiz(){
      if (submitted) return;
      submitted = true;
      let score = 0;
      questions.forEach((item, idx) => {
        const options = document.querySelectorAll('#q'+idx+' .quiz-option');
        options.forEach(o => o.classList.add('disabled'));
        const userAns = answered[idx];
        if (userAns === item.correct) {
          score++;
          options[item.correct].classList.add('correct');
        } else {
          options[item.correct].classList.add('correct');
          if (userAns !== undefined) options[userAns].classList.add('wrong');
        }
      });
      const box = document.getElementById('scoreBox');
      box.style.display = 'block';
      box.innerHTML = '<strong>'+score+' / '+questions.length+'</strong><br>'+Math.round(score/questions.length*100)+'%';
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'inline-flex';
    }

    document.addEventListener('DOMContentLoaded', renderQuiz);
    const _setLang = window.setLang;
    window.setLang = function(lang){
      _setLang(lang);
      if (!submitted) renderQuiz();
    };
  </script>
</body>
</html>
