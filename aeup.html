<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEuP | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .topic-list{display:grid;gap:.8rem;margin-top:1rem}
    .topic-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;text-decoration:none;color:inherit;transition:.2s}
    .topic-item:hover{border-color:var(--blue);transform:translateY(-2px)}
    .topic-item h3{font-size:1.05rem;margin:0}
    .back-topics{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1rem;color:var(--blue);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html" class="active">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="englisch.html">Englisch</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>
  <div class="container page-head">
    <a class="back" href="index.html" data-i18n="backHome">← بازگشت به خانه</a>
    <h1>AEuP – Daten systemübergreifend bereitstellen</h1>
    <p class="sub">Welt der Daten · Datenmodelle · ER-Modell · relationales Modell</p>
  </div>
  <main class="container">
    <div id="topicListView">
      <h2 data-i18n="topicsTitle" style="margin-bottom:1rem">موضوعات</h2>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div id="topicContentView" style="display:none">
      <a href="#" class="back-topics" onclick="showList(event)" data-i18n="backTopics">← بازگشت به فهرست</a>
      <div id="singleTopicContent"></div>
    </div>
  </main>
  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script>
    const topics = {
      fa: [
        { id:'welt', title:'1. جهان داده‌ها', content:'<div class="card"><h3>1. جهان داده‌ها</h3><ul><li><strong>داده ساختاریافته:</strong> فرمت ثابت، قابل پردازش ماشینی (پایگاه داده، Excel)</li><li><strong>داده غیرساختاریافته:</strong> بدون فرمت ثابت (ایمیل، عکس، ویدیو)</li><li><strong>Bestandsdaten:</strong> داده‌های پایه که کم تعییر می‌کنند (مشتریان، قیمت لیست)</li><li><strong>Bewegungsdaten:</strong> داده‌های ناشی از فرآیند کسب‌وکار (تعداد، مبلغ فاکتور)</li></ul></div>' },
        { id:'modelle', title:'2. مدل‌های داده', content:'<div class="card"><h3>2. مدل‌های داده</h3><p>مدل‌سازی داده قبل از پیاده‌سازی پایگاه داده انجام می‌شود.</p></div>' },
        { id:'er', title:'2.1 ER-Modell', content:'<div class="card"><h3>2.1 ER-Modell (Entity-Relationship)</h3><ul><li><strong>Entität:</strong> موجودیت (مشتری، تیکت، محصول)</li><li><strong>Attribut:</strong> ویژگی موجودیت (نام، قیمت، تاریخ)</li><li><strong>Beziehung:</strong> ارتباط بین موجودیت‌ها</li><li><strong>Primärschlüssel:</strong> شناسه یکتا</li></ul></div>' },
        { id:'rel', title:'2.2 مدل رابطه‌ای', content:'<div class="card"><h3>2.2 مدل رابطه‌ای (relationales Modell)</h3><p>تبدیل ER به جداول با کلیدهای اصلی و خارجی.</p><p>مثال: جدول Kunde (KundenID, Name) و Bestellung (BestellID, KundenID, Datum)</p></div>' }
      ],
      de: [
        { id:'welt', title:'1. Die Welt der Daten', content:'<div class="card"><h3>1. Die Welt der Daten</h3><p><strong>Strukturierte Daten:</strong> festes Format (Datenbank, Excel)<br><strong>Unstrukturierte Daten:</strong> ohne festes Format (E-Mail, Bilder)<br><strong>Bestandsdaten:</strong> ändern sich selten<br><strong>Bewegungsdaten:</strong> entstehen durch Geschäftsprozesse</p></div>' },
        { id:'modelle', title:'2. Datenmodelle', content:'<div class="card"><h3>2. Datenmodelle</h3><p>Modellierung vor der Implementierung der Datenbank.</p></div>' },
        { id:'er', title:'2.1 ER-Modell', content:'<div class="card"><h3>2.1 ER-Modell</h3><p>Entität – Attribut – Beziehung – Primärschlüssel</p></div>' },
        { id:'rel', title:'2.2 Relationales Modell', content:'<div class="card"><h3>2.2 Relationales Modell</h3><p>Überführung des ER-Modells in Tabellen mit Primär- und Fremdschlüsseln.</p></div>' }
      ],
      en: [
        { id:'welt', title:'1. The World of Data', content:'<div class="card"><h3>1. The World of Data</h3><p><strong>Structured data:</strong> fixed format (database, Excel)<br><strong>Unstructured data:</strong> no fixed format (email, images)<br><strong>Master data:</strong> changes rarely<br><strong>Transaction data:</strong> arises from business processes</p></div>' },
        { id:'modelle', title:'2. Data Models', content:'<div class="card"><h3>2. Data Models</h3><p>Modelling before implementing the database.</p></div>' },
        { id:'er', title:'2.1 ER Model', content:'<div class="card"><h3>2.1 ER Model</h3><p>Entity – Attribute – Relationship – Primary key</p></div>' },
        { id:'rel', title:'2.2 Relational Model', content:'<div class="card"><h3>2.2 Relational Model</h3><p>Converting the ER model into tables with primary and foreign keys.</p></div>' }
      ]
    };

    function currentLang(){ return localStorage.getItem('fisi-lang') || 'fa'; }
    function renderTopicList(){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const container = document.getElementById('topicList');
      container.innerHTML = '';
      list.forEach(t => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'topic-item';
        a.innerHTML = `<h3>${t.title}</h3><span>→</span>`;
        a.onclick = (e) => { e.preventDefault(); showTopic(t.id); };
        container.appendChild(a);
      });
    }
    function showTopic(id){
      const lang = currentLang();
      const list = topics[lang] || topics.fa;
      const topic = list.find(t => t.id === id);
      if (!topic) return;
      document.getElementById('singleTopicContent').innerHTML = topic.content;
      document.getElementById('topicListView').style.display = 'none';
      document.getElementById('topicContentView').style.display = 'block';
      window.scrollTo(0, 0);
    }
    function showList(e){
      if (e) e.preventDefault();
      document.getElementById('topicContentView').style.display = 'none';
      document.getElementById('topicListView').style.display = 'block';
      renderTopicList();
    }
    const originalSetLang = window.setLang;
    window.setLang = function(lang){
      originalSetLang(lang);
      renderTopicList();
      showList();
    };
    document.addEventListener('DOMContentLoaded', renderTopicList);
  </script>
</body>
</html>
