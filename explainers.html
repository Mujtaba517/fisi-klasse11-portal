  <main id="main" class="container">

      <div class="player-top">

        <button type="button" class="btn btn-soft" id="btnPrev" onclick="prevStep()">←</button>

  <script src="script.js"></script>
  <script src="explainers-data.js"></script>
  <script>
    const ui = {
      fa:{title:'توضیح‌گرهای کوتاه',sub:'همه مضامین · حدود یک دقیقه · با مثال',example:'مثال',next:'بعدی',prev:'قبلی',done:'تمام',step:'گام',all:'همه'},
      de:{title:'Kurzerklärer',sub:'Alle Fächer · ca. 1 Minute · mit Beispiel',example:'Beispiel',next:'Weiter',prev:'Zurück',done:'Fertig',step:'Schritt',all:'Alle'},
      en:{title:'Short explainers',sub:'All subjects · about 1 minute · with example',example:'Example',next:'Next',prev:'Back',done:'Done',step:'Step',all:'All'}
    };
    const catLabels = {
      fa:{all:'همه',bgwp:'BGWP',ittec:'IT-Technik',aeup:'AEuP',itsys:'IT-Systeme',fp:'Fachpraxis',pug:'PuG'},
      de:{all:'Alle',bgwp:'BGWP',ittec:'IT-Technik',aeup:'AEuP',itsys:'IT-Systeme',fp:'Fachpraxis',pug:'PuG'},
      en:{all:'All',bgwp:'BGWP',ittec:'IT-Technik',aeup:'AEuP',itsys:'IT-Systeme',fp:'Fachpraxis',pug:'PuG'}
    };

    const CAT_ICON = {
      bgwp: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg>',
      ittec: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',
      aeup: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
      itsys: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="18" cy="17" r="2"/><path d="M8 12h8M16.2 8.4 8.8 11M16.2 15.6 8.8 13"/></svg>',
      fp: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6.2 6.2L3 18l3 3 5.5-5.5a4.5 4.5 0 0 0 6.2-6.2L15 12l-3-3z"/></svg>',
      pug: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 10v8M10 10v8M14 10v8M18 10v8M12 3l9 7H3z"/></svg>'
    };

    let activeId = null, step = 0, filter = 'all';

    function lang(){ return localStorage.getItem('fisi-lang') || 'fa'; }

    function renderFilters(){
      const l = lang();
      const box = document.getElementById('filters');
      const cats = ['all','bgwp','ittec','aeup','itsys','fp','pug'];
      box.innerHTML = '';
      cats.forEach(c=>{
        const b = document.createElement('button');
        b.type='button';
        b.className = filter===c ? 'on' : '';
        b.setAttribute('aria-pressed', filter===c ? 'true' : 'false');
        b.textContent = catLabels[l][c];
        b.onclick = ()=>{ filter=c; activeId=null; document.getElementById('player').classList.remove('on'); renderList(); renderFilters(); };
        box.appendChild(b);
      });
    }

    function renderList(){
      const l = lang();
      const u = ui[l];
      document.getElementById('pageTitle').textContent = u.title;
      document.getElementById('pageSub').textContent = u.sub;
      const list = document.getElementById('topicList');
      list.innerHTML = '';
      Object.keys(EXPLAINERS).forEach(id=>{
        const t = EXPLAINERS[id];
        if (filter!=='all' && t.cat!==filter) return;
        const btn = document.createElement('button');
        btn.type='button';
        btn.className='ex-pick'+(activeId===id?' active':'');
        btn.onclick=()=>openTopic(id);
        btn.innerHTML = `<div class="ico">${CAT_ICON[t.cat] || ''}</div><div><strong>${t.title[l]}</strong><span>${t.blurb[l]}</span><div class="tag">${catLabels[l][t.cat]||t.cat}</div></div>`;
        list.appendChild(btn);
      });
    }

    function openTopic(id){
      activeId=id; step=0;
      document.getElementById('player').classList.add('on');
      renderList(); renderStep();
      document.getElementById('player').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function renderStep(){
      if(!activeId) return;
      const l=lang(), u=ui[l], t=EXPLAINERS[activeId], steps=t.steps[l], s=steps[step];
      document.getElementById('playerTitle').textContent=t.title[l];
      document.getElementById('playerMeta').textContent=u.step+' '+(step+1)+' / '+steps.length;
      document.getElementById('stepTitle').textContent=s.t;
      document.getElementById('stepText').textContent=s.x;
      document.getElementById('exampleLab').textContent=u.example;
      document.getElementById('exampleText').textContent=s.e;
      const dots=document.getElementById('dots'); dots.innerHTML='';
      steps.forEach((_,i)=>{const d=document.createElement('button');d.type='button';d.className='dot'+(i===step?' on':'');d.setAttribute('aria-label', u.step+' '+(i+1));d.setAttribute('aria-current', i===step ? 'step' : 'false');d.onclick=()=>{step=i;renderStep()};dots.appendChild(d)});
      document.getElementById('btnPrev').disabled=step===0;
      document.getElementById('btnPrev').textContent='← '+u.prev;
      document.getElementById('btnNext').textContent=(step===steps.length-1?u.done:u.next)+' →';
    }

    function nextStep(){
      if(!activeId)return;
      const steps=EXPLAINERS[activeId].steps[lang()];
      if(step<steps.length-1){step++;renderStep()}
      else{document.getElementById('player').classList.remove('on');activeId=null;renderList()}
    }
    function prevStep(){if(!activeId||step===0)return;step--;renderStep()}

    document.addEventListener('DOMContentLoaded',()=>{renderFilters();renderList()});
    const _setLang=window.setLang;
    window.setLang=function(l){_setLang(l);renderFilters();renderList();if(activeId)renderStep()};
  </script>
  <script src="settings.js"></script>
  <script src="shell.js"></script>
</body>
