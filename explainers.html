<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توضیح‌گرها | Klasse 11</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .filter-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
    .filter-row button{
      border:1px solid var(--border);background:var(--card);border-radius:980px;
      padding:.4rem .85rem;font-size:.8rem;font-weight:650;cursor:pointer;font-family:inherit;color:var(--muted)
    }
    .filter-row button.on{background:var(--blue-soft);color:var(--blue);border-color:transparent}
    .ex-list{display:grid;gap:.7rem;margin-bottom:1.4rem}
    .ex-pick{
      display:flex;align-items:center;gap:.85rem;width:100%;
      background:var(--card);border:1.5px solid var(--border);border-radius:16px;
      padding:.9rem 1rem;cursor:pointer;text-align:start;font-family:inherit;
      box-shadow:var(--shadow);transition:border-color .15s,transform .15s;
    }
    .ex-pick:hover,.ex-pick.active{border-color:var(--blue);transform:translateY(-1px)}
    .ex-pick .ico{
      width:42px;height:42px;border-radius:12px;background:var(--blue-soft);
      display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;
    }
    .ex-pick strong{display:block;font-size:.95rem;color:var(--text)}
    .ex-pick span{font-size:.8rem;color:var(--muted)}
    .ex-pick .tag{font-size:.68rem;font-weight:700;color:var(--blue);margin-top:.15rem}
    .player{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:none}
    .player.on{display:block}
    .player-top{background:linear-gradient(145deg,#007aff 0%,#5856d6 100%);color:#fff;padding:1.25rem 1.2rem 1rem}
    .player-top h2{font-size:1.15rem;font-weight:750;margin-bottom:.2rem}
    .player-top p{opacity:.9;font-size:.86rem}
    .player-body{padding:1.25rem 1.2rem 1.1rem;min-height:190px}
    .step-title{font-size:1.05rem;font-weight:750;margin-bottom:.5rem}
    .step-text{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:.8rem}
    .step-example{background:#f2f2f7;border-radius:14px;padding:.95rem 1rem;border-inline-start:3px solid var(--blue)}
    .step-example .lab{font-size:.7rem;font-weight:700;color:var(--blue);margin-bottom:.3rem;letter-spacing:.03em}
    .step-example p{margin:0;color:var(--text);font-size:.9rem}
    .player-bar{display:flex;align-items:center;gap:.55rem;padding:.85rem 1.1rem 1.1rem;border-top:1px solid var(--border);flex-wrap:wrap}
    .dots{display:flex;gap:.32rem;flex:1;justify-content:center;flex-wrap:wrap}
    .dot{width:8px;height:8px;border-radius:50%;background:#d2d2d7;border:none;padding:0;cursor:pointer}
    .dot.on{background:var(--blue);transform:scale(1.15)}
    .player-bar .btn{padding:.5rem .95rem;font-size:.86rem}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">FISI <span>Klasse 11</span></a>
      <div class="lang-menu">
        <button type="button" class="lang-toggle" onclick="toggleLangPanel(event)"><span id="langLabel">زبان</span> ▾</button>
        <div class="lang-panel" id="langPanel">
          <button type="button" data-lang="fa" onclick="setLang('fa')">فارسی</button>
          <button type="button" data-lang="de" onclick="setLang('de')">Deutsch</button>
          <button type="button" data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <div class="container"><nav class="nav-scroll">
      <a href="index.html" data-i18n="navHome">خانه</a>
      <a href="bgwp.html">BGWP</a>
      <a href="it-technik.html">IT-Technik</a>
      <a href="aeup.html">AEuP</a>
      <a href="it-systeme.html">IT-Systeme</a>
      <a href="fachpraxis.html">Fp-Plus</a>
      <a href="pug.html">PuG</a>
      <a href="explainers.html" class="active" data-i18n="navExplain">توضیح‌گر</a>
      <a href="flashcards.html" data-i18n="navFlash">فلش‌کارت</a>
      <a href="quiz.html" data-i18n="navQuiz">کوییز</a>
    </nav></div>
  </header>

  <div class="container page-head">
    <a class="back" href="index.html" data-i18n="backHome">← بازگشت به خانه</a>
    <h1 id="pageTitle">توضیح‌گرهای کوتاه</h1>
    <p class="sub" id="pageSub">همه مضامین · حدود یک دقیقه · با مثال · سه زبان</p>
  </div>

  <main class="container">
    <div class="filter-row" id="filters"></div>
    <div class="ex-list" id="topicList"></div>
    <div class="player" id="player">
      <div class="player-top">
        <h2 id="playerTitle">—</h2>
        <p id="playerMeta">—</p>
      </div>
      <div class="player-body">
        <div class="step-title" id="stepTitle"></div>
        <div class="step-text" id="stepText"></div>
        <div class="step-example">
          <div class="lab" id="exampleLab">مثال</div>
          <p id="exampleText"></p>
        </div>
      </div>
      <div class="player-bar">
        <button type="button" class="btn btn-soft" id="btnPrev" onclick="prevStep()">←</button>
        <div class="dots" id="dots"></div>
        <button type="button" class="btn btn-primary" id="btnNext" onclick="nextStep()">→</button>
      </div>
    </div>
  </main>

  <footer><div class="container"><p data-i18n="footer">FISI Klasse 11 · 2026</p></div></footer>
  <script src="script.js"></script>
  <script src="explainers-data.js"></script>
  <script>
    const ui = {
      fa:{title:'توضیح‌گرهای کوتاه',sub:'همه مضامین · حدود یک دقیقه · با مثال',example:'مثال',next:'بعدی',prev:'قبلی',done:'تمام',step:'گام',all:'همه'},
      de:{title:'Kurzerklärer',sub:'Alle Fächer · ca. 1 Minute · mit Beispiel',example:'Beispiel',next:'Weiter',prev:'Zurück',done:'Fertig',step:'Schritt',all:'Alle'},
      en:{title:'Short explainers',sub:'All subjects · about 1 minute · with example',example:'Example',next:'Next',prev:'Back',done:'Done',step:'Step',all:'All'}
    };
    const catLabels = {
      fa:{all:'همه',bgwp:'BGWP',ittec:'IT-Technik',aeup:'AEuP',itsys:'IT-Systeme',fp:'Fp-Plus',pug:'PuG'},
      de:{all:'Alle',bgwp:'BGWP',ittec:'IT-Technik',aeup:'AEuP',itsys:'IT-Systeme',fp:'Fp-Plus',pug:'PuG'},
      en:{all:'All',bgwp:'BGWP',ittec:'IT-Technik',aeup:'AEuP',itsys:'IT-Systeme',fp:'Fp-Plus',pug:'PuG'}
    };

    let activeId = null, step = 0, filter = 'all';

    function lang(){ return localStorage.getItem('fisi-lang') || 'fa'; }

    function renderFilters(){
      const l = lang();
      const box = document.getElementById('filters');
      const cats = ['all','bgwp','ittec','aeup','itsys','fp','pug'];
      box.innerHTML = '';
      cats.forEach(c=>{
        const b = document.createElement('button');
        b.type='button';
        b.className = filter===c ? 'on' : '';
        b.textContent = catLabels[l][c];
        b.onclick = ()=>{ filter=c; activeId=null; document.getElementById('player').classList.remove('on'); renderList(); renderFilters(); };
        box.appendChild(b);
      });
    }

    function renderList(){
      const l = lang();
      const u = ui[l];
      document.getElementById('pageTitle').textContent = u.title;
      document.getElementById('pageSub').textContent = u.sub;
      const list = document.getElementById('topicList');
      list.innerHTML = '';
      Object.keys(EXPLAINERS).forEach(id=>{
        const t = EXPLAINERS[id];
        if (filter!=='all' && t.cat!==filter) return;
        const btn = document.createElement('button');
        btn.type='button';
        btn.className='ex-pick'+(activeId===id?' active':'');
        btn.onclick=()=>openTopic(id);
        btn.innerHTML = `<div class="ico">${t.ico}</div><div><strong>${t.title[l]}</strong><span>${t.blurb[l]}</span><div class="tag">${catLabels[l][t.cat]||t.cat}</div></div>`;
        list.appendChild(btn);
      });
    }

    function openTopic(id){
      activeId=id; step=0;
      document.getElementById('player').classList.add('on');
      renderList(); renderStep();
      document.getElementById('player').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function renderStep(){
      if(!activeId) return;
      const l=lang(), u=ui[l], t=EXPLAINERS[activeId], steps=t.steps[l], s=steps[step];
      document.getElementById('playerTitle').textContent=t.title[l];
      document.getElementById('playerMeta').textContent=u.step+' '+(step+1)+' / '+steps.length;
      document.getElementById('stepTitle').textContent=s.t;
      document.getElementById('stepText').textContent=s.x;
      document.getElementById('exampleLab').textContent=u.example;
      document.getElementById('exampleText').textContent=s.e;
      const dots=document.getElementById('dots'); dots.innerHTML='';
      steps.forEach((_,i)=>{const d=document.createElement('button');d.type='button';d.className='dot'+(i===step?' on':'');d.onclick=()=>{step=i;renderStep()};dots.appendChild(d)});
      document.getElementById('btnPrev').disabled=step===0;
      document.getElementById('btnPrev').textContent='← '+u.prev;
      document.getElementById('btnNext').textContent=(step===steps.length-1?u.done:u.next)+' →';
    }

    function nextStep(){
      if(!activeId)return;
      const steps=EXPLAINERS[activeId].steps[lang()];
      if(step<steps.length-1){step++;renderStep()}
      else{document.getElementById('player').classList.remove('on');activeId=null;renderList()}
    }
    function prevStep(){if(!activeId||step===0)return;step--;renderStep()}

    document.addEventListener('DOMContentLoaded',()=>{renderFilters();renderList()});
    const _setLang=window.setLang;
    window.setLang=function(l){_setLang(l);renderFilters();renderList();if(activeId)renderStep()};
  </script>
</body>
</html>
