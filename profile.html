<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f5fa" />
  <title>Profil | Lernova</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    body.profile-page .page-heading .subtitle{display:none}
    .pf{display:grid;gap:1.25rem;max-width:62rem}
    .pf-hero{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:1.4rem;padding:1.8rem;border-radius:28px;background:linear-gradient(135deg,#d8ef85,#c2e7aa);color:#1f3a2c}
    .pf-hero::before,.pf-hero::after{content:'';position:absolute;border-radius:50%;z-index:-1;opacity:.5}
    .pf-hero::before{width:130px;height:130px;background:#ffd166;inset-inline-end:-30px;top:-40px}
    .pf-hero::after{width:70px;height:70px;background:#ff8f70;inset-inline-end:90px;bottom:-24px}
    html[data-theme=dark] .pf-hero{background:linear-gradient(135deg,#27402f,#1f3329);color:#f2f5e8}
    .pf-avatar{flex:none;width:5.5rem;height:5.5rem;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800;background:#d8ef85;color:#20342d;border:4px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(32,52,45,.2);transition:transform .3s}
    .pf-avatar:hover{transform:rotate(-6deg) scale(1.05)}
    .pf-name{margin:0;font-size:clamp(1.4rem,3vw,2rem);font-weight:800;line-height:1.2}
    .pf-user{margin:.2rem 0 .6rem;opacity:.8;font-weight:600}
    .pf-badges{display:flex;flex-wrap:wrap;gap:.5rem}
    .pf-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .75rem;border-radius:999px;font-size:.82rem;font-weight:700;background:rgba(255,255,255,.65);color:#20342d}
    html[data-theme=dark] .pf-badge{background:rgba(216,239,133,.16);color:#d8ef85}
    .pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1.25rem}
    .pf-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:1.4rem;display:grid;gap:1rem;align-content:start;animation:pfRise .5s both}
    .pf-card:nth-child(2){animation-delay:.06s}.pf-card:nth-child(3){animation-delay:.12s}.pf-card:nth-child(4){animation-delay:.18s}
    .pf-card h2{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:.6rem;color:var(--text)}
    .pf-ico{width:2.2rem;height:2.2rem;border-radius:12px;display:grid;place-items:center;flex:none}
    .pf-ico svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pf-card:nth-child(1) .pf-ico{background:#e4f3c4;color:#35523a}
    .pf-card:nth-child(2) .pf-ico{background:#ffe6a8;color:#7a5200}
    .pf-card:nth-child(3) .pf-ico{background:#cfeafb;color:#1f5a7a}
    .pf-card:nth-child(4) .pf-ico{background:#e5dcf8;color:#4a3770}
    .pf-sub{margin:0;color:var(--muted);font-size:.92rem}
    .pf-h3{margin:.2rem 0 0;font-size:.85rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .pf-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    @media(max-width:560px){.pf-row{grid-template-columns:1fr}.pf-hero{flex-direction:column;text-align:center}.pf-badges{justify-content:center}}
    .pf label{display:block;margin-bottom:.3rem;font-size:.85rem;font-weight:700;color:var(--muted)}
    .pf input[type=text],.pf input[type=email],.pf input[type=password]{width:100%;box-sizing:border-box;padding:.65rem .9rem;border-radius:14px;border:2px solid var(--border);background:var(--bg-soft);color:var(--text);font:inherit}
    .pf input:focus{outline:none;border-color:var(--primary-strong);box-shadow:0 0 0 3px var(--blue-soft)}
    .pf input[readonly]{opacity:.7;cursor:not-allowed}
    .pf-hint{display:block;margin-top:.25rem;font-size:.78rem;color:var(--muted)}
    .pf-pass{position:relative}
    .pf-pass input{padding-inline-end:3.4rem}
    .pf-eye{position:absolute;inset-inline-end:.5rem;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;font-weight:700;font-size:.78rem;padding:.3rem .5rem;border-radius:8px}
    .pf-eye:hover{background:var(--blue-soft)}
    .pf-meter{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
    .pf-meter span{display:block;height:100%;width:0;border-radius:999px;transition:width .4s,background .3s}
    .pf-btn{justify-self:start;border:0;border-radius:14px;padding:.7rem 1.3rem;font:inherit;font-weight:800;cursor:pointer;background:var(--primary-strong);color:var(--on-primary);transition:transform .2s,filter .2s}
    .pf-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .pf-btn:disabled{opacity:.6;cursor:wait;transform:none}
    .pf-btn.soft{background:var(--blue-soft);color:var(--text)}
    .pf-btn.danger{background:#fde3dc;color:#8a2a14}
    html[data-theme=dark] .pf-btn.danger{background:rgba(255,143,112,.18);color:#ffb3a0}
    .pf-status{margin:0;padding:.55rem .8rem;border-radius:12px;font-weight:600;font-size:.9rem}
    .pf-status.ok{background:rgba(120,190,120,.22);color:var(--text)}
    .pf-status.err{background:rgba(255,143,112,.25);color:var(--text)}
    .pf-photo{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
    .pf-photo input[type=file]{display:none}
    .pf-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.5rem}
    .pf-ic{aspect-ratio:1;border-radius:16px;border:2px solid var(--border);background:var(--bg-soft);font-size:1.5rem;cursor:pointer;transition:transform .2s,border-color .2s}
    .pf-ic:hover{transform:translateY(-3px) rotate(-4deg)}
    .pf-ic[aria-pressed=true]{border-color:var(--primary-strong);box-shadow:0 0 0 3px var(--blue-soft)}
    .pf-swatches{display:flex;flex-wrap:wrap;gap:.6rem}
    .pf-sw{width:2.6rem;height:2.6rem;border-radius:50%;border:3px solid transparent;cursor:pointer;display:grid;place-items:center;font-weight:800;transition:transform .2s}
    .pf-sw:hover{transform:scale(1.12)}
    .pf-sw[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 3px var(--blue-soft)}
    .pf-level{display:flex;align-items:center;gap:1rem}
    .pf-medal{flex:none;width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(135deg,#ffe6a8,#ffd166);box-shadow:0 8px 18px rgba(122,82,0,.25);animation:pfPulse 3s ease-in-out infinite}
    .pf-lvname{font-size:1.25rem;font-weight:800;color:var(--text)}
    .pf-lvsub{font-size:.85rem;color:var(--muted)}
    .pf-bar{height:12px;border-radius:999px;background:var(--border);overflow:hidden}
    .pf-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#d8ef85,#6fcf97);transition:width .8s}
    .pf-medals{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
    .pf-mc{display:grid;justify-items:center;gap:.2rem;padding:.6rem .2rem;border-radius:16px;background:var(--bg-soft);border:1px solid var(--border);text-align:center;font-size:.72rem;color:var(--muted)}
    .pf-mc i{font-style:normal;font-size:1.7rem}
    .pf-mc.locked i{filter:grayscale(1);opacity:.35}
    .pf-mc.current{border-color:var(--primary-strong);box-shadow:0 0 0 3px var(--blue-soft);color:var(--text);font-weight:700}
    .pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    .pf-stat{padding:.9rem;border-radius:16px;background:var(--bg-soft);border:1px solid var(--border)}
    .pf-stat b{display:block;font-size:1.3rem;color:var(--text)}
    .pf-stat span{font-size:.82rem;color:var(--muted)}
    .pf-note{margin:0;font-size:.82rem;color:var(--muted)}
    @keyframes pfRise{from{opacity:0;transform:translateY(16px)}}
    @keyframes pfPulse{50%{transform:scale(1.06) rotate(-3deg)}}
    @media(prefers-reduced-motion:reduce){.pf *,.pf-card{animation:none!important;transition:none!important}}
  </style>
</head>
<body class="profile-page">
  <a class="skip-link" href="#main" data-i18n="skipLink">Zum Inhalt</a>
  <main id="main">
    <h1 id="pTitle">Profil</h1>
    <div class="pf">
      <section class="pf-hero" aria-live="polite">
        <div class="pf-avatar" id="pfAvatar" aria-hidden="true">·</div>
        <div>
          <h2 class="pf-name" id="pfName"></h2>
          <p class="pf-user" id="pfUser" dir="ltr"></p>
          <div class="pf-badges">
            <span class="pf-badge" id="pfRole"></span>
            <span class="pf-badge" id="pfLv"></span>
            <span class="pf-badge" id="pfSince"></span>
          </div>
        </div>
      </section>

      <div class="pf-grid">
        <section class="pf-card">
          <h2><span class="pf-ico"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg></span><span data-p="personal"></span></h2>
          <p class="pf-sub" data-p="personalSub"></p>
          <form id="pfForm" novalidate>
            <div class="pf-row">
              <div><label for="pfFirst" data-p="first"></label><input type="text" id="pfFirst" autocomplete="given-name" /></div>
              <div><label for="pfLast" data-p="last"></label><input type="text" id="pfLast" autocomplete="family-name" /></div>
            </div>
            <div style="margin-top:.8rem"><label for="pfEmail" data-p="email"></label><input type="email" id="pfEmail" dir="ltr" readonly /><span class="pf-hint" data-p="emailHint"></span></div>
            <div class="pf-row" style="margin-top:.8rem">
              <div><label for="pfStudent" data-p="student"></label><input type="text" id="pfStudent" dir="ltr" inputmode="numeric" /></div>
              <div><label for="pfUsername" data-p="username"></label><input type="text" id="pfUsername" dir="ltr" readonly /><span class="pf-hint" data-p="usernameHint"></span></div>
            </div>
            <p class="pf-status" id="pfStatus" role="status" hidden style="margin-top:.8rem"></p>
            <button type="submit" class="pf-btn" style="margin-top:.9rem" data-p="save"></button>
          </form>
        </section>

        <section class="pf-card">
          <h2><span class="pf-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></span><span data-p="avatar"></span></h2>
          <p class="pf-sub" data-p="avatarSub"></p>
          <h3 class="pf-h3" data-p="photo"></h3>
          <div class="pf-photo">
            <button type="button" class="pf-btn soft" id="photoPick" data-p="photoPick"></button>
            <button type="button" class="pf-btn soft" id="photoRemove" data-p="photoRemove" hidden></button>
            <input type="file" id="photoFile" accept="image/*" />
          </div>
          <p class="pf-status" id="photoStatus" role="status" hidden></p>
          <h3 class="pf-h3" data-p="icons"></h3>
          <div class="pf-icons" id="pfIcons" role="group"></div>
          <h3 class="pf-h3" data-p="colors"></h3>
          <div class="pf-swatches" id="pfSwatches" role="group"></div>
        </section>

        <section class="pf-card">
          <h2><span class="pf-ico"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span data-p="password"></span></h2>
          <p class="pf-sub" data-p="passwordSub"></p>
          <form id="pwForm" novalidate>
            <div><label for="pwCur" data-p="cur"></label><div class="pf-pass"><input type="password" id="pwCur" dir="ltr" autocomplete="current-password" /><button type="button" class="pf-eye" data-eye="pwCur"></button></div></div>
            <div style="margin-top:.8rem"><label for="pwNew" data-p="new"></label><div class="pf-pass"><input type="password" id="pwNew" dir="ltr" autocomplete="new-password" /><button type="button" class="pf-eye" data-eye="pwNew"></button></div></div>
            <div class="pf-meter" style="margin-top:.6rem" aria-hidden="true"><span id="pwBar"></span></div>
            <span class="pf-hint" id="pwHint"></span>
            <div style="margin-top:.8rem"><label for="pwRep" data-p="rep"></label><div class="pf-pass"><input type="password" id="pwRep" dir="ltr" autocomplete="new-password" /><button type="button" class="pf-eye" data-eye="pwRep"></button></div></div>
            <p class="pf-status" id="pwStatus" role="status" hidden style="margin-top:.8rem"></p>
            <button type="submit" class="pf-btn" style="margin-top:.9rem" data-p="change"></button>
          </form>
        </section>

        <section class="pf-card">
          <h2><span class="pf-ico"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span><span data-p="learn"></span></h2>
          <div class="pf-level">
            <div class="pf-medal" id="lvMedal" aria-hidden="true">🌱</div>
            <div>
              <div class="pf-lvname" id="lvName"></div>
              <div class="pf-lvsub" id="lvSub"></div>
            </div>
          </div>
          <div class="pf-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="lvBarWrap"><span id="lvBar"></span></div>
          <div class="pf-medals" id="lvList"></div>
          <div class="pf-stats">
            <div class="pf-stat"><b id="stDone">0</b><span data-p="topicsDone"></span></div>
            <div class="pf-stat"><b id="stLast">–</b><span data-p="lastActive"></span></div>
          </div>
          <button type="button" class="pf-btn danger" id="pfLogout" data-p="logout"></button>
          <p class="pf-note" data-p="localNote"></p>
        </section>
      </div>
    </div>
  </main>

      var n = fullName(r) || r.username || '';
      var p = n.split(/\s+/).filter(Boolean);
      return p.length ? p.slice(0, 2).map(function (x) { return x.charAt(0); }).join('').toUpperCase() : '·';
    }
    function status(el, key, type) { el.hidden = !key; el.className = 'pf-status ' + (type || ''); el.textContent = key ? t(key) : ''; el._k = key; el._t = type; }
    function levelOf(done) { var i = 0; for (var k = 0; k < LV.length; k++) if (done >= LV[k].min) i = k; return i; }
    function doneCount() {
      var all = typeof readActivity === 'function' ? readActivity() : {};
      var done = 0, last = 0;
      Object.keys(all || {}).forEach(function (page) {
        Object.keys(all[page] || {}).forEach(function (id) {
          var row = all[page][id]; if (!row) return;
          if (row.checked) done += 1;
          if (row.updated > last) last = row.updated;
        });
      });
      return { done: done, last: last };
    }

    var rec = null;

    function paintAvatar() {
      var big = $('pfAvatar');
      big.style.backgroundImage = '';
      big.textContent = initials(rec);
      var side = document.querySelector('.profile .avatar');
      if (side) { side.style.backgroundImage = ''; side.textContent = initials(rec); }
      if (typeof lernovaPaintAvatar === 'function') { lernovaPaintAvatar(big, rec); lernovaPaintAvatar(side, rec); }
      document.querySelectorAll('#pfSwatches .pf-sw').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.key === rec.avatar ? 'true' : 'false'); });
      document.querySelectorAll('#pfIcons .pf-ic').forEach(function (b) { b.setAttribute('aria-pressed', (!rec.photo && b.dataset.ic === (rec.avatarIcon || '')) ? 'true' : 'false'); });
      $('photoRemove').hidden = !rec.photo;
    }

    function paintLevel() {
      var s = doneCount(), i = levelOf(s.done), cur = LV[i], next = LV[i + 1];
      var lg = L();
      $('lvMedal').textContent = cur.ic;
      $('lvName').textContent = t('level') + ' ' + (i + 1) + ' · ' + cur[lg];
      var pct = 100;
      if (next) {
        pct = Math.round((s.done - cur.min) / (next.min - cur.min) * 100);
        $('lvSub').textContent = t('toNext').replace('{n}', next.min - s.done).replace('{name}', next[lg]);
      } else { $('lvSub').textContent = t('maxLevel'); }
      $('lvBar').style.width = pct + '%';
      $('lvBarWrap').setAttribute('aria-valuenow', pct);
      $('lvList').innerHTML = LV.map(function (l, k) {
        return '<div class="pf-mc' + (k > i ? ' locked' : '') + (k === i ? ' current' : '') + '"><i>' + l.ic + '</i><span>' + l[lg] + '</span></div>';
      }).join('');
      $('stDone').textContent = s.done;
      $('stLast').textContent = s.last ? new Date(s.last).toLocaleDateString(lg) : '–';
      $('pfLv').textContent = cur.ic + ' ' + t('level') + ' ' + (i + 1) + ' · ' + cur[lg];
    }

    function paintHero() {
      $('pfName').textContent = fullName(rec) || rec.username;
      $('pfUser').textContent = '@' + rec.username;
      $('pfRole').textContent = t('role' + (rec.role || 'student'));
      var since = rec.registeredAt ? new Date(rec.registeredAt) : null;
      $('pfSince').textContent = since && !isNaN(since) ? t('since') + since.toLocaleDateString(L()) : t('unknown');
      var sideName = document.querySelector('.profile .profile-name');
      if (sideName) sideName.textContent = fullName(rec) || rec.username;
      paintAvatar();
    }

    function paintTexts() {
      document.querySelectorAll('[data-p]').forEach(function (el) { el.textContent = t(el.getAttribute('data-p')); });
      document.querySelectorAll('[data-eye]').forEach(function (b) {
        var inp = $(b.getAttribute('data-eye'));
        b.textContent = inp.type === 'password' ? t('show') : t('hide');
      });
      var h = document.querySelector('.page-header h1'); if (h) h.textContent = t('title');
      $('pTitle').textContent = t('title');
      document.title = t('title') + ' | Lernova';
      $('pwHint').textContent = t('pwHint');
      if (rec) paintHero();
      ['pfStatus', 'pwStatus', 'photoStatus'].forEach(function (id) { var el = $(id); if (el._k) status(el, el._k, el._t); });
      paintLevel();
    }

    async function update(patch) {
      try {
        rec = await SB.updateProfile(patch);
        paintHero();
        return true;
      } catch (e) {
        return false;
      }
    }

    function buildPickers() {
      var sw = $('pfSwatches');
      Object.keys(AV).forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pf-sw'; b.dataset.key = k;
        b.style.background = AV[k][0]; b.style.color = AV[k][1];
        b.setAttribute('aria-label', k); b.setAttribute('aria-pressed', 'false');
        b.textContent = 'A';
        b.addEventListener('click', function () { update({ avatar: k }); });
        sw.appendChild(b);
      });
      var ic = $('pfIcons');
      var none = document.createElement('button');
      none.type = 'button'; none.className = 'pf-ic'; none.dataset.ic = ''; none.textContent = 'Aa';
      none.style.fontSize = '1rem'; none.style.fontWeight = '800';
      none.setAttribute('aria-label', 'Initials'); none.setAttribute('aria-pressed', 'false');
      none.addEventListener('click', function () { update({ avatarIcon: '', photo: '' }); });
      ic.appendChild(none);
      ICONS.forEach(function (e) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pf-ic'; b.dataset.ic = e; b.textContent = e;
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', function () { update({ avatarIcon: e, photo: '' }); });
        ic.appendChild(b);
      });
    }

    function resizePhoto(file, cb) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var size = 192, c = document.createElement('canvas');
          c.width = size; c.height = size;
          var s = Math.min(img.width, img.height);
          c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          cb(c.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = function () { cb(null); };
        img.src = reader.result;
      };
      reader.onerror = function () { cb(null); };
      reader.readAsDataURL(file);
    }

    function strength(p) {
      var s = 0;
      if (p.length >= 6) s += 1;
      if (p.length >= 10) s += 1;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s += 1;
      if (/\d/.test(p)) s += 1;
      if (/[^A-Za-z0-9]/.test(p)) s += 1;
      return s;
    }

    function lockAll() {
      document.querySelectorAll('#pfForm input,#pfForm button,#pwForm input,#pwForm button.pf-btn,.pf-photo button').forEach(function (e) { e.disabled = true; });
    }

    async function init() {
      var s = session();
      if (!s || !SB) return;
      document.querySelectorAll('.sidenav .nav-item').forEach(function (a) { a.classList.remove('is-active'); a.removeAttribute('aria-current'); });
      buildPickers();
      try { rec = await SB.fetchProfileRec(); } catch (e) { rec = null; }
      if (!rec) rec = SB.cachedRec();
      if (!rec) {
        $('pfName').textContent = s.name || s.username || '';
        $('pfUser').textContent = s.username ? '@' + s.username : '';
        paintTexts();
        status($('pfStatus'), 'notFound', 'err');
        lockAll();
        return;
      }
      $('pfFirst').value = rec.firstName || '';
      $('pfLast').value = rec.lastName || '';
      $('pfEmail').value = rec.email || '';
      $('pfStudent').value = rec.studentId || '';
      $('pfUsername').value = rec.username;
      paintTexts();

      $('pfForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var first = $('pfFirst').value.trim(), last = $('pfLast').value.trim();
        if (!first && !last) { status($('pfStatus'), 'needName', 'err'); return; }
        var ok = await update({ firstName: first, lastName: last, studentId: $('pfStudent').value.trim() });
        status($('pfStatus'), ok ? 'saved' : 'saveFail', ok ? 'ok' : 'err');
      });

      $('photoPick').addEventListener('click', function () { $('photoFile').click(); });
      $('photoFile').addEventListener('change', function () {
        var f = this.files && this.files[0];
        var input = this;
        if (!f) return;
        if (!/^image\//.test(f.type)) { status($('photoStatus'), 'photoBad', 'err'); return; }
        resizePhoto(f, async function (data) {
          if (!data) { status($('photoStatus'), 'photoBad', 'err'); return; }
          if (data.length > 120000) { status($('photoStatus'), 'photoBig', 'err'); return; }
          var ok = await update({ photo: data });
          status($('photoStatus'), ok ? 'photoOk' : 'saveFail', ok ? 'ok' : 'err');
        });
        input.value = '';
      });
      $('photoRemove').addEventListener('click', async function () {
        var ok = await update({ photo: '' });
        status($('photoStatus'), ok ? null : 'saveFail', ok ? '' : 'err');
      });

      document.querySelectorAll('[data-eye]').forEach(function (b) {
        b.addEventListener('click', function () {
          var inp = $(b.getAttribute('data-eye'));
          inp.type = inp.type === 'password' ? 'text' : 'password';
          paintTexts();
        });
      });

      $('pwNew').addEventListener('input', function () {
        var v = $('pwNew').value, sc = strength(v);
        var bar = $('pwBar');
        bar.style.width = v ? (Math.max(1, sc) * 20) + '%' : '0';
        bar.style.background = sc <= 2 ? '#ff8f70' : sc === 3 ? '#ffd166' : '#6fcf97';
        $('pwHint').textContent = v ? (sc <= 2 ? t('weak') : sc === 3 ? t('ok') : t('strong')) : t('pwHint');
      });

      $('pwForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var cur = $('pwCur').value, nw = $('pwNew').value, rp = $('pwRep').value;
        var st = $('pwStatus');
        if (!cur || !nw || !rp) { status(st, 'pwFill', 'err'); return; }
        if (nw.length < 6) { status(st, 'pwShort', 'err'); return; }
        if (nw !== rp) { status(st, 'pwMismatch', 'err'); return; }
        if (nw === cur) { status(st, 'pwSame', 'err'); return; }
        try {
          await SB.changePassword(cur, nw);
          $('pwForm').reset(); $('pwBar').style.width = '0';
          status(st, 'pwDone', 'ok');
        } catch (err) {
          status(st, err && err.message === 'wrong_password' ? 'pwWrong' : 'saveFail', 'err');
        }
      });

      $('pfLogout').addEventListener('click', function () {
        SB.signOutLocal();
        location.href = 'login.html';
      });
    }

    document.addEventListener('fisi-lang', paintTexts);
    document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  })();
  </script>
</body>
</html>
