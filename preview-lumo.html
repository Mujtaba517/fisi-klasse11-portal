s pop{from{opacity:0;transform:scale(.3)}}@keyframes draw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}@keyframes travel{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(290px)}}@keyframes hop{40%{transform:translateY(-22px) rotate(-5deg)}70%{transform:translateY(0) scaleY(.92)}}@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}@keyframes wob{50%{transform:rotate(-5deg) scale(1.06)}}@media(max-width:760px){header{padding:14px}.brand{font-size:21px}main{padding:16px}.hero{grid-template-columns:1fr;padding:24px}.hero svg{max-height:190px}.grid,.ll{grid-template-columns:1fr}.side{position:static}.side a{display:inline-block;margin-inline-end:14px}.sh{align-items:start;flex-direction:column}.art h1{font-size:32px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cf{display:none}}</style><header><div class=brand><span class=mark>L</span>lernova<span style='color:var(--green)'>.</span></div><div class=tools><select id=lang aria-label=Language><option value=de>Deutsch<option value=fa>فارسی<option value=en>English</select><button id=theme aria-label='Toggle theme'>◐</button></div></header><main><div class=notice id=nt></div><div id=app></div><footer id=ft></footer></main><script>const C={de:{nt:'Interaktiver Designentwurf · Keine Anmeldung, keine Kontodaten · Nicht die Live-Lernplattform',ey:'DEIN LERNRAUM',h:'Große Ideen.<br>Ein Schritt nach dem anderen.',intro:'Verstehen statt nur auswendig lernen. Finde dein Thema, entdecke Zusammenhänge und probiere es selbst aus.',start:'Eine Lektion entdecken',subj:'Was möchtest du verstehen?',gr:'Klasse',title:'Daten sichtbar machen',desc:'Von der Idee zum ER-Modell: Dinge, Eigenschaften und Beziehungen verstehen.',av:'Interaktives Beispiel',open:'Thema öffnen',oth:'Nicht Teil dieses Entwurfs',net:'IT-Systeme',netd:'Platzhalter für einen späteren Fachbereich.',pr:'Fachpraxis',prd:'Wird erst nach Freigabe des Designs umgesetzt.',back:'Zur Übersicht',ov:'AEuP · Klasse 11',subi:'Ein klarer Weg durch das Thema. Dieser Entwurf enthält eine Beispiellektion, nicht den gesamten Kurs.',les:'Das ER-Modell verstehen',lesi:'Wie beschreibst du eine Abteilung und ihre Mitarbeiter, bevor du Tabellen anlegst?',goal:'Dein Lernziel',goalt:'Du unterscheidest Entitäten, Attribute und Beziehungen und liest eine 1:n-Beziehung.',rd:'Erklärung',ex:'Beispiel',qz:'Selbst ausprobieren',why:'Erst verstehen, dann modellieren',whyt:'Ein ER-Modell beschreibt, welche Dinge für eine Anwendung wichtig sind und wie sie zusammenhängen. Es ist ein Plan für die Daten, noch keine fertige Datenbank.',terms:['Entität: Ein unterscheidbares Objekt, zum Beispiel eine bestimmte Abteilung. Im Diagramm ein Rechteck.','Attribut: Eine Eigenschaft, etwa Name oder Abteilungsnummer. In dieser Notation ein Oval.','Beziehung: Die Verbindung zwischen Dingen, etwa Abteilung hat Mitarbeiter. Hier eine Raute.'],expl:'In diesem Beispiel gehört jeder Mitarbeiter genau einer Abteilung an. Eine Abteilung kann mehrere Mitarbeiter haben. Deshalb steht 1 neben Abteilung und n neben Mitarbeiter. Das sind die Annahmen dieses Beispiels, keine allgemeine Regel.',rp:'Aufbau abspielen',mis:'Achte auf die Seite: Das n neben Mitarbeiter zählt Mitarbeiter, nicht Abteilungen.',q:'Eine Abteilung hat mehrere Mitarbeiter. Jeder Mitarbeiter gehört genau einer Abteilung an. Welche Kardinalität passt?',chk:'Antwort prüfen',ok:'Die 1 steht bei Abteilung, das n bei Mitarbeiter: eine Abteilung, mehrere Mitarbeiter.',bad:'Lies beide Richtungen: eine Abteilung hat mehrere Mitarbeiter; ein Mitarbeiter gehört zu genau einer Abteilung. Das ergibt 1:n.',cho:'Wähle zuerst eine Antwort.',src:'Grundlage: vorhandene Portal-Lektion lessons/aeup.js (Schulquelle dort: AEuP11, S. 19–23). Das Originalheft wurde für diesen Entwurf nicht unabhängig geprüft.',ft:'Statischer Prototyp · Keine Fortschrittsspeicherung · Nur AEuP Klasse 11 ist interaktiv.',g10:'Klasse 10 ist in diesem Entwurf nicht eingebunden.',hi:['Hallo! Ich bin Lumo.','Klick mich an!','Los geht’s!'],ch:'Super gemacht!',hn:'Fast! Versuch es nochmal.'},en:{nt:'Interactive design preview · No login or account data · Not the live learning platform',ey:'YOUR LEARNING SPACE',h:'Big ideas.<br>One step at a time.',intro:'Understand, don’t just memorize. Find your topic, discover connections and try it yourself.',start:'Explore a lesson',subj:'What would you like to understand?',gr:'Grade',title:'Make data visible',desc:'From an idea to an ER model: understand objects, properties and relationships.',av:'Interactive sample',open:'Open subject',oth:'Not part of this preview',net:'IT systems',netd:'Placeholder for a future subject area.',pr:'Practical skills',prd:'Implemented only after design approval.',back:'Back to overview',ov:'AEuP · Grade 11',subi:'A clear route through the topic. This preview contains one sample lesson, not a full course.',les:'Understand the ER model',lesi:'How can you describe departments and employees before creating database tables?',goal:'Your learning goal',goalt:'Distinguish entities, attributes and relationships and read a 1:n relationship.',rd:'Explanation',ex:'Example',qz:'Try it yourself',why:'Understand first, then model',whyt:'An ER model describes the objects relevant to an application and how they relate. It is a plan for the data, not a finished database.',terms:['Entity: A distinguishable object, such as one department. A rectangle in the diagram.','Attribute: A property, such as a name or department number. An oval in this notation.','Relationship: A link between things, such as department has employees. A diamond here.'],expl:'In this example every employee belongs to exactly one department. A department can have several employees. The 1 sits beside Department and n beside Employee. These are this example’s assumptions, not a universal rule.',rp:'Play the build-up',mis:'Watch the side: n beside Employee counts employees, not departments.',q:'A department has several employees. Each employee belongs to exactly one department. Which cardinality fits?',chk:'Check answer',ok:'The 1 sits beside Department and n beside Employee: one department, several employees.',bad:'Read both directions: one department has several employees; one employee belongs to exactly one department. That gives 1:n.',cho:'Choose an answer first.',src:'Based on the existing portal file lessons/aeup.js (stated school source: AEuP11, pp. 19–23). The original handout was not independently checked for this preview.',ft:'Static prototype · No progress saving · Only Grade 11 AEuP is interactive.',g10:'Grade 10 is not included in this preview.',hi:['Hi! I’m Lumo.','Click me!','Let’s go!'],ch:'Great job!',hn:'Almost! Try again.'},fa:{nt:'نمونه تعاملی طراحی · بدون ورود یا اطلاعات حساب · پلتفرم زندهٔ آموزشی نیست',ey:'فضای یادگیری تو',h:'ایده‌های بزرگ؛<br>قدم‌های روشن و کوچک.',intro:'بفهم، نه اینکه فقط حفظ کنی. موضوعت را پیدا کن، ارتباط‌ها را ببین و خودت تمرین کن.',start:'یک درس را امتحان کن',subj:'امروز چه چیزی می‌خواهی یاد بگیری؟',gr:'صنف',title:'داده‌ها را دیدنی کن',desc:'از یک ایده تا مدل ER؛ چیزها، ویژگی‌ها و رابطه‌هایشان را بشناس.',av:'نمونه تعاملی',open:'مشاهده مضمون',oth:'بخشی از این نمونه نیست',net:'سیستم‌های IT',netd:'جای یک بخش آینده.',pr:'کار عملی',prd:'فقط پس از تأیید طراحی پیاده‌سازی می‌شود.',back:'بازگشت به نمای کلی',ov:'AEuP · صنف ۱۱',subi:'یک مسیر روشن برای یادگیری موضوع. این نسخه فقط یک درس نمونه دارد، نه کل دوره.',les:'مدل ER را بفهمیم',lesi:'قبل از ساخت جدول‌ها، بخش‌های یک شرکت و کارمندانش را چگونه توصیف کنیم؟',goal:'هدف این درس',goalt:'موجودیت، ویژگی و رابطه را از هم تشخیص بده و رابطهٔ یک‌به‌چند را بخوان.',rd:'توضیح',ex:'مثال',qz:'خودت امتحان کن',why:'اول بفهم، بعد مدل بساز',whyt:'مدل ER مشخص می‌کند چه چیزهایی برای یک برنامه مهم‌اند و چگونه به هم مربوط می‌شوند. این مدل طرح داده‌هاست، نه پایگاه دادهٔ آماده.',terms:['موجودیت (Entität): شیء قابل تشخیص، مثلاً یک بخش شرکت. در نمودار مستطیل است.','ویژگی (Attribut): خصوصیتی مثل نام یا شمارهٔ بخش. در این شیوه بیضی است.','رابطه (Beziehung): ارتباط بین چیزها، مثلاً بخش کارمند دارد. اینجا لوزی است.'],expl:'در این مثال هر کارمند دقیقاً به یک بخش تعلق دارد و یک بخش می‌تواند چند کارمند داشته باشد. پس ۱ کنار بخش و n کنار کارمند می‌آید. این فرض همین مثال است، نه قانون همهٔ شرکت‌ها.',rp:'پخش مراحل نمودار',mis:'سمت عدد مهم است: n کنار کارمند، کارمندان را می‌شمارد، نه بخش‌ها را.',q:'یک بخش چند کارمند دارد و هر کارمند دقیقاً به یک بخش تعلق دارد. کدام رابطه درست است؟',chk:'بررسی پاسخ',ok:'عدد ۱ کنار بخش و n کنار کارمند است: یک بخش و چند کارمند.',bad:'هر دو جهت را بخوان: یک بخش چند کارمند دارد؛ یک کارمند دقیقاً به یک بخش تعلق دارد. پس رابطه یک‌به‌چند است.',cho:'اول یک پاسخ انتخاب کن.',src:'مبنا: درس فعلی پورتال lessons/aeup.js (منبع مکتب در آن: AEuP11، صفحات ۱۹ تا ۲۳). اصل جزوه برای این نمونه مستقلاً بررسی نشده است.',ft:'نمونه ثابت · بدون ذخیرهٔ پیشرفت · فقط AEuP صنف ۱۱ تعاملی است.',g10:'صنف ۱۰ در این نمونه گنجانده نشده است.',hi:['سلام! من لومو هستم.','روی من کلیک کن!','بزن بریم!'],ch:'آفرین!',hn:'نزدیک بود! دوباره امتحان کن.'}};let lang='de',scr='home',gd=11,ans=null,hn=0;const app=document.getElementById('app');function mascot(m){const mo=m==='sad'?`<path d='M170 140q15-12 30 0' fill=none stroke=#20342d stroke-width=4 stroke-linecap=round />`:m==='happy'?`<path d='M160 130q25 32 50 0z' fill=#ff8f70 stroke=#20342d stroke-width=3 />`:`<path d='M165 135q20 20 40 0' fill=none stroke=#20342d stroke-width=4 stroke-linecap=round />`;return `<svg viewBox='0 0 360 260' role=img aria-label='Lumo'><ellipse cx=185 cy=240 rx=95 ry=12 fill=#20342d22 /><path class=sp d='M48 70l7 17 17 7-17 7-7 17-7-17-17-7 17-7z' fill=#ffd166 /><path class='sp s2' d='M310 52l5 12 12 5-12 5-5 12-5-12-12-5 12-5z' fill=#ff8f70 /><g class=bd><path class=tail d='M262 190q55-5 48-48' fill=none stroke=#20342d stroke-width=10 stroke-linecap=round /><rect x=105 y=48 width=160 height=165 rx=62 fill=#fff4c4 stroke=#20342d stroke-width=4 /><path d='M122 70L105 20l54 28M248 70l20-48-58 30' fill=#fff4c4 stroke=#20342d stroke-width=4 stroke-linejoin=round /><g class=ey><circle cx=152 cy=108 r=10 fill=#20342d /><circle cx=155 cy=104 r=3 fill=#fff /></g><g class=ey><circle cx=218 cy=108 r=10 fill=#20342d /><circle cx=221 cy=104 r=3 fill=#fff /></g>${mo}<ellipse cx=130 cy=135 rx=14 ry=8 fill=#ffb199 /><ellipse cx=240 cy=135 rx=14 ry=8 fill=#ffb199 /><path d='M140 178l45-10 45 10v36h-90z' fill=#7a9b76 stroke=#20342d stroke-width=3 /><g class=arm><path d='M262 170q42-8 38-52' fill=none stroke=#20342d stroke-width=10 stroke-linecap=round /><circle cx=300 cy=116 r=11 fill=#fff4c4 stroke=#20342d stroke-width=3 /></g><path d='M120 85q65-52 130 0' fill=none stroke=#215c43 stroke-width=9 stroke-linecap=round /></g></svg>`}function petb(t){return `<div class=pw><div class=bub id=bub>${t.hi[hn%3]}</div><button class=pet data-a=pet aria-label='Lumo'>${mascot()}</button></div>`}function dia(){return `<svg class=dg viewBox='0 0 700 250' role=img aria-label='Abteilung 1:n Mitarbeiter'><g class='pt p1'><rect class=n x=25 y=95 width=160 height=60 rx=10 /><text x=105 y=132 text-anchor=middle>Abteilung</text></g><g class='pt p2'><ellipse class=n cx=105 cy=38 rx=86 ry=23 /><line class=l x1=105 y1=61 x2=105 y2=95 /><text x=105 y=43 text-anchor=middle text-decoration=underline>AbteilungsNr</text></g><line class='l ln' x1=185 y1=125 x2=280 y2=125 /><line class='l ln' x1=360 y1=125 x2=500 y2=125 /><g class='pt p3'><polygon class=n points='280,125 320,90 360,125 320,160' /><text x=320 y=131 text-anchor=middle>hat</text></g><g class='pt p4'><rect class=n x=500 y=95 width=175 height=60 rx=10 /><text x=587 y=132 text-anchor=middle>Mitarbeiter</text><ellipse class=n cx=587 cy=38 rx=78 ry=23 /><line class=l x1=587 y1=61 x2=587 y2=95 /><text x=587 y=43 text-anchor=middle text-decoration=underline>PersonalNr</text><ellipse class=n cx=587 cy=215 rx=65 ry=23 /><line class=l x1=587 y1=155 x2=587 y2=192 /><text x=587 y=221 text-anchor=middle>Name</text></g><g class='pt p5'><circle cx=228 cy=108 r=16 fill=#ffd166 /><text x=228 y=114 text-anchor=middle>1</text><circle cx=470 cy=108 r=16 fill=#ffd166 /><text x=470 y=114 text-anchor=middle>n</text></g><circle class=pu cx=190 cy=125 r=7 style=opacity:0 /></svg>`}function burst(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=['#ffd166','#ff8f70','#9bd6f5','#d8ef85','#215c43'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}}function go(s){scr=s;ans=null;render();window.scrollTo(0,0)}function render(){const t=C[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.getElementById('nt').textContent=t.nt;document.getElementById('ft').textContent=t.ft;if(scr==='home'){app.innerHTML=`<section class=hero><i class='blob b1'></i><i class='blob b2'></i><div><div class=eyebrow>${t.ey}</div><h1>${t.h}</h1><p>${t.intro}</p><button class=primary data-a=go data-v=lesson>${t.start} ↗</button></div>${petb(t)}</section><div class=sh><h2>${t.subj}</h2><div class=tabs><button class='${gd===10?'sel':''}' data-a=grade data-v=10>${t.gr} 10</button><button class='${gd===11?'sel':''}' data-a=grade data-v=11>${t.gr} 11</button></div></div>${gd===10?`<div class=card><h2>${t.gr} 10</h2><p>${t.g10}</p><span class=tag>${t.oth}</span></div>`:`<div class=grid><article class=card><div class=icon>◇</div><h3>AEuP</h3><p>${t.desc}</p><span class=tag>${t.av}</span><br><button data-a=go data-v=subject>${t.open} ↗</button></article><article class=card><div class=icon>⌘</div><h3>${t.net}</h3><p>${t.netd}</p><span class=tag>${t.oth}</span></article><article class=card><div class=icon>⌁</div><h3>${t.pr}</h3><p>${t.prd}</p><span class=tag>${t.oth}</span></article></div>`}`}else if(scr==='subject'){app.innerHTML=`<button data-a=go data-v=home>← ${t.back}</button><section class=hero style='margin-top:22px'><i class='blob b1'></i><div><div class=eyebrow>${t.ov}</div><h1>${t.title}</h1><p>${t.subi}</p></div>${petb(t)}</section><article class=card style='margin-top:24px'><span class=tag>01 · ${t.av}</span><h2>${t.les}</h2><p>${t.lesi}</p><button class=primary data-a=go data-v=lesson>${t.start} ↗</button></article>`}else{app.innerHTML=`<div class=muted style='margin-bottom:18px'><button data-a=go data-v=subject>← ${t.back}</button> &nbsp; ${t.ov}</div><div class=ll><aside class='card side'><a href=#explanation>01 · ${t.rd}</a><a href=#example>02 · ${t.ex}</a><a href=#quiz>03 · ${t.qz}</a></aside><article class=art><div class=eyebrow>AEuP / ER</div><h1>${t.les}</h1><p class=muted>${t.lesi}</p><div class=callout><strong>${t.goal}</strong><div>${t.goalt}</div></div><section id=explanation><h2>${t.why}</h2><p>${t.whyt}</p>${t.terms.map((x,i)=>`<div class=step><span class=num>${i+1}</span><div>${x}</div></div>`).join('')}</section><section class=card id=example><div class=sh style='margin:0 0 18px'><h2>${t.ex}</h2><button data-a=replay>▷ ${t.rp}</button></div><div id=drawing class=an>${dia()}</div><p>${t.expl}</p><div class=callout>${t.mis}</div></section><section class=card id=quiz><span class=tag>${t.qz}</span><h2>${t.q}</h2><div class=answers role=group>${['1:1','1:n','n:m'].map((x,i)=>`<button aria-pressed=false data-a=sel data-v=${i}><bdi>${x}</bdi></button>`).join('')}</div><button class=primary style='margin-top:16px' data-a=check>${t.chk}</button><div id=fb role=status aria-live=polite></div></section><p class='muted src'>${t.src}</p></article></div>`}}function check(){const t=C[lang],f=document.getElementById('fb');if(ans===null){f.textContent=t.cho;return}const ok=ans===1;f.innerHTML=`<div class='coach ${ok?'good':'bad'}'>${mascot(ok?'happy':'sad')}<div><b>${ok?t.ch:t.hn}</b> ${ok?t.ok:t.bad}</div></div>`;if(ok)burst(34)}document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;if(a==='go')go(v);else if(a==='grade'){gd=+v;render()}else if(a==='sel'){ans=+v;document.querySelectorAll('[data-a=sel]').forEach((x,j)=>x.setAttribute('aria-pressed',j===ans));document.getElementById('fb').textContent=''}else if(a==='check')check();else if(a==='replay'){const d=document.getElementById('drawing');d.classList.remove('an');void d.offsetWidth;d.classList.add('an')}else if(a==='pet'){hn++;const bu=document.getElementById('bub');bu.textContent=C[lang].hi[hn%3];bu.style.animation='none';void bu.offsetWidth;bu.style.animation='';burst(10)}});document.getElementById('lang').onchange=e=>{lang=e.target.value;render()};document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');render();</script></html>
